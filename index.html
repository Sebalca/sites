<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frisk — Os meus sites</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sites">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<script>
  // Aspeto (tema e cor) guardado neste dispositivo; aplicado já para não piscar.
  window.HUB_CORES = {
    azul: ["Azul", "#2f6fed", "#5b8dff"], roxo: ["Roxo", "#7c3aed", "#a78bfa"],
    verde: ["Verde", "#1f8a4c", "#4cc582"], laranja: ["Laranja", "#c2410c", "#fb923c"],
    rosa: ["Rosa", "#db2777", "#f472b6"], cinza: ["Cinzento", "#475569", "#94a3b8"]
  };
  window.hubAspeto = function (a) {
    var r = document.documentElement, c = HUB_CORES[a.cor] || HUB_CORES.azul;
    if (a.tema === "claro" || a.tema === "escuro") r.dataset.theme = a.tema === "claro" ? "light" : "dark";
    else delete r.dataset.theme;
    r.style.setProperty("--accent-l", c[1]);
    r.style.setProperty("--accent-d", c[2]);
  };
  try { hubAspeto(JSON.parse(localStorage.getItem("hub.aspeto")) || {}); } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #5f6570;
    --accent: var(--accent-l, #2f6fed);
    --accent-text: #ffffff;
    --accent2: #a020f0;
    --border: #e3e5e9;
    --shadow: rgba(0,0,0,0.06);
    --danger: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121316;
      --card-bg: #1c1e22;
      --text: #f0f1f3;
      --muted: #9aa0aa;
      --accent: var(--accent-d, #5b8dff);
      --accent-text: #0d1220;
      --accent2: #c27bff;
      --border: #2c2f34;
      --shadow: rgba(0,0,0,0.4);
      --danger: #ff6b6b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121316;
    --card-bg: #1c1e22;
    --text: #f0f1f3;
    --muted: #9aa0aa;
    --accent: var(--accent-d, #5b8dff);
    --accent-text: #0d1220;
    --accent2: #c27bff;
    --border: #2c2f34;
    --shadow: rgba(0,0,0,0.4);
    --danger: #ff6b6b;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 8px;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
  }
  header {
    width: 100%;
    margin: 0 0 12px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px 12px;
    flex: none;
  }
  header h1 { font-size: 1.4rem; margin: 0; justify-self: start; white-space: nowrap; }
  header p { color: var(--muted); margin: 0; font-size: 0.9rem; text-align: center; }
  .toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; justify-self: end; }
  .toolbar button { padding: 7px 14px; white-space: nowrap; }
  @media (max-width: 720px) {
    header { grid-template-columns: 1fr auto; grid-template-areas: "t tb" "s s"; }
    header h1 { grid-area: t; font-size: 1.05rem; }
    header .toolbar { grid-area: tb; gap: 4px; flex-wrap: wrap; }
    header .toolbar button { padding: 5px 8px; font-size: 0.8rem; }
    header .toolbar .cfg { width: 30px; height: 30px; padding: 0; }
    header p { grid-area: s; font-size: 0.8rem; }
  }
  .status { color: var(--muted); font-size: 0.8rem; text-align: center; margin: 0 auto 6px; max-width: 1080px; min-height: 1em; flex: none; }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    padding: 9px 16px;
    font-size: 0.9rem;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.danger:hover { border-color: var(--danger); }
  button.ghost { background: transparent; color: var(--muted); }
  button:disabled { opacity: .6; cursor: default; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px 12px; margin: 0 0 12px; flex: none; }
  .search { width: 100%; max-width: 260px; margin: 0; justify-self: start; }
  @media (max-width: 720px) {
    .bar { grid-template-columns: 1fr; }
    .bar .vtabs { order: -1; }
    .search { max-width: none; }
  }
  .search input {
    width: 100%; font: inherit; font-size: 16px;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card-bg); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .vtabs { display: flex; gap: 6px; margin: 0; flex: none; justify-content: center; }
  .vtabs[hidden] { display: none; }
  .vtabs button { padding: 7px 16px; border-radius: 999px; color: var(--muted); }
  .vtabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }
  .view[hidden] { display: none; }
  .ptools { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 8px; flex: none; }
  .ptools .count { color: var(--muted); font-size: 0.85rem; }
  .ptools .visto { padding: 5px 12px; font-size: 0.85rem; }
  .ptools .btns { margin-left: auto; }
  .ptools { flex-wrap: wrap; }
  .ptools .btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .ptools .btns button { white-space: nowrap; }
  .ptools .hint { color: var(--muted); font-size: 0.8rem; }
  .pt td.h, .pt th.h { width: 36px; padding-right: 0; }
  .grip { cursor: grab; touch-action: none; user-select: none; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 6px 8px; display: inline-block; border-radius: 8px; }
  .grip:active { cursor: grabbing; }
  .pt tr.dragging { position: relative; z-index: 3; background: var(--card-bg); box-shadow: 0 6px 18px var(--shadow); opacity: .95; }
  .pt tr.drop-before td { box-shadow: inset 0 3px 0 var(--accent); }
  .pt tr.drop-after td { box-shadow: inset 0 -3px 0 var(--accent); }
  .estwrap { position: relative; display: inline-block; }
  .estwrap::after { content: "▾"; position: absolute; right: 9px; top: 50%; transform: translateY(-52%); font-size: .7rem; pointer-events: none; }
  .estsel { min-width: 10.5rem; appearance: none; -webkit-appearance: none; font: inherit; font-size: 0.78rem; font-weight: 600; color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 999px; padding: 3px 24px 3px 10px; cursor: pointer; }
  .estsel option { color: var(--text); background: var(--card-bg); }
  .twrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--border); border-radius: 14px; background: var(--card-bg); -webkit-overflow-scrolling: touch; }
  table.pt { width: 100%; border-collapse: collapse; min-width: 820px; font-size: 0.92rem; }
  .pt th, .pt td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .pt thead th { position: sticky; top: 0; background: color-mix(in srgb, var(--accent) 12%, var(--card-bg)); z-index: 2; box-shadow: 0 1px 0 var(--border); white-space: nowrap; }
  .pt tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--text) 3.5%, var(--card-bg)); }
  .respwrap { color: var(--text); }
  .respwrap .estsel { min-width: 8.5rem; font-weight: 500; border-color: var(--border); }
  .pt th button.sort { all: unset; cursor: pointer; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .pt th button.sort:hover, .pt th button.sort:focus-visible { color: var(--accent); }
  .pt th .arr { font-size: 0.7rem; opacity: .35; }
  .pt th[aria-sort="ascending"] .arr, .pt th[aria-sort="descending"] .arr { opacity: 1; color: var(--accent); }
  .pt tbody tr:last-child td { border-bottom: 0; }
  .pt td.t { font-weight: 600; color: var(--accent); min-width: 160px; }
  .pt td.t a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
  .pt td.n { color: var(--muted); min-width: 240px; }
  .pt td.d { white-space: nowrap; }
  .pt tbody td.d.atraso { background: color-mix(in srgb, var(--danger) 82%, var(--card-bg)); color: #fff; font-weight: 600; }
  /* alterações feitas por outra pessoa e ainda não vistas */
  :root { --novo: #9333ea; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --novo: #c084fc; } }
  :root[data-theme="dark"] { --novo: #c084fc; }
  .pt td.novo, .pt td.novo a, .pt td.novo .nt, .pt td.novo .estwrap { color: var(--novo); }
  .pt td.novo { font-weight: 600; }
  .hitem.novo { border-color: var(--novo); }
  .hitem.novo .ht, .hitem.novo .hd { color: var(--novo); }
  button.visto { border-color: var(--novo); color: var(--novo); font-weight: 600; }
  .vtabs .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--novo); margin-left: 6px; vertical-align: middle; }
  .nwrap { display: flex; gap: 8px; align-items: flex-start; }
  .nadd { flex: none; width: 28px; height: 28px; padding: 0; border-radius: 8px; color: var(--accent); font-weight: 700; line-height: 1; }
  .nlast { all: unset; cursor: pointer; flex: 1; min-width: 0; color: var(--muted); }
  .nlast:hover .nt, .nlast:focus-visible .nt { color: var(--text); }
  .nlast:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .nlast .nt { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .pt td.a { white-space: nowrap; text-align: right; }
  .pt td.a button { width: 32px; height: 32px; padding: 0; color: var(--muted); }
  .pt td.a button + button { margin-left: 4px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; border: 1px solid currentColor; }
  .st-ideia { color: #8a6d00; } .st-planeamento { color: #7a4cc2; } .st-desenvolvimento { color: #2f6fed; }
  .st-testes { color: #c26a00; } .st-producao { color: #1f8a4c; } .st-standby { color: #6b7280; }
  .st-concluido { color: #1f8a4c; opacity: .8; } .st-cancelado { color: #c93a3a; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .st-ideia { color: #e2c14a; } :root:not([data-theme="light"]) .st-planeamento { color: #b58cf0; } :root:not([data-theme="light"]) .st-desenvolvimento { color: #6fa0ff; }
    :root:not([data-theme="light"]) .st-testes { color: #f0a44a; } :root:not([data-theme="light"]) .st-producao { color: #4cc582; } :root:not([data-theme="light"]) .st-standby { color: #9aa0aa; }
    :root:not([data-theme="light"]) .st-concluido { color: #4cc582; } :root:not([data-theme="light"]) .st-cancelado { color: #ff7b7b; }
  }
  :root[data-theme="dark"] .st-ideia { color: #e2c14a; } :root[data-theme="dark"] .st-planeamento { color: #b58cf0; } :root[data-theme="dark"] .st-desenvolvimento { color: #6fa0ff; }
    :root[data-theme="dark"] .st-testes { color: #f0a44a; } :root[data-theme="dark"] .st-producao { color: #4cc582; } :root[data-theme="dark"] .st-standby { color: #9aa0aa; }
    :root[data-theme="dark"] .st-concluido { color: #4cc582; } :root[data-theme="dark"] .st-cancelado { color: #ff7b7b; }
  .columns {
    max-width: 1080px; width: 100%;
    margin: 0 auto;
    display: flex;
    gap: 20px;
    flex: 1; min-height: 0;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
  }
  .col { flex: 0 0 min(100%, 480px); scroll-snap-align: start; display: flex; flex-direction: column; min-height: 0; }
  .columns { justify-content: safe center; }
  @media (max-width: 720px) {
    /* com login: caixas lado a lado; a terceira vê-se a deslizar */
    .columns.multi { gap: 10px; }
    .columns.multi .col { flex-basis: calc(50% - 5px); }
    .columns.multi .column-title { font-size: 0.8rem; }
    .columns.multi .card-title { padding-right: 0; font-size: 1rem; }
    .columns.multi .card { padding: 12px 12px; }
    .columns.multi .col-head button { padding: 4px 8px; font-size: 0.75rem; }
  }
  .col[hidden] { display: none; }
  .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px 4px; flex: none; min-height: 34px; }
  .col-head .column-title { margin: 0; }
  .col-head button { padding: 5px 12px; font-size: 0.85rem; }
  .resp { font-size: 0.9rem; color: var(--muted); }
  .notas { font-size: 0.9rem; color: var(--muted); line-height: 1.4; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .plink { display: block; margin-top: 6px; font-size: 0.85rem; color: var(--accent); overflow-wrap: anywhere; position: relative; z-index: 1; }
  .resp b { color: var(--text); font-weight: 600; }
  .col .grid { overflow-y: auto; flex: 1; min-height: 0; padding: 2px 6px 16px 2px; overscroll-behavior: contain; }
  .column-title {
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 10px 4px;
    color: var(--muted);
    flex: none;
  }
  .grid { display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 6px 4px; }

  .card-wrap { position: relative; }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }
  .card-title { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .curiosidades .card-title { color: var(--accent2); }
  .card-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.4; }
  /* modo editar das curiosidades/sites: tocar abre o item, ☰ arrasta */
  .editing .card { border-style: dashed; padding-right: 48px; cursor: pointer; }
  .editing a.card:hover { transform: none; }
  .card-wrap > .grip { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); }
  .card-wrap.dragging { z-index: 3; }
  .card-wrap.dragging .card { box-shadow: 0 10px 24px var(--shadow); opacity: .95; }
  .card-wrap.drop-before::before, .card-wrap.drop-after::after {
    content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: 2px;
  }
  .card-wrap.drop-before::before { top: -9px; }
  .card-wrap.drop-after::after { bottom: -9px; }

  dialog {
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card-bg);
    color: var(--text);
    padding: 22px;
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  dialog::backdrop { background: rgba(0,0,0,0.45); }
  dialog h2 { margin: 0 0 16px; font-size: 1.15rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
  input, select, textarea {
    display: block;
    width: 100%;
    margin-top: 5px;
    padding: 10px 12px;
    font: inherit;
    font-size: 16px; /* evita zoom automático no iPhone */
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-weight: 400; font-size: 0.75rem; margin-top: 4px; }
  .err { color: var(--danger); font-size: 0.85rem; margin: 0 0 10px; min-height: 1.2em; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  label[hidden] { display: none; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; }
  .seg button { flex: 1; padding: 8px 10px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .cores { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 18px; }
  .cores button { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--c); box-shadow: inset 0 0 0 2px var(--card-bg); }
  .cores button.on { border-color: var(--c); }
  .sub { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: 0; }
  .toolbar .cfg { width: 34px; padding: 0; font-size: 1.05rem; line-height: 1; height: 34px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  #histDlg { width: min(580px, calc(100vw - 32px)); }
  .hist { max-height: 60vh; overflow: auto; margin: 0 0 14px; display: flex; flex-direction: column; gap: 10px; }
  .hitem { position: relative; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
  .hitem .hd { font-size: 0.78rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; padding-right: 32px; }
  .hitem .hd span { color: var(--muted); font-weight: 400; }
  .hitem .ht { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 0.92rem; }
  .hitem .hx { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; color: var(--muted); }

  footer {
    max-width: 1080px;
    margin: 6px auto 0; flex: none;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>Os meus sites</h1>
  <p>Uma conta, vários projetos.</p>
  <div class="toolbar" id="toolbar"></div>
</header>

<div class="status" id="status" role="status"></div>

<div class="bar">
  <div class="search"><input id="q" type="search" placeholder="Pesquisar…" aria-label="Pesquisar" autocomplete="off"></div>
  <div class="vtabs" id="vtabs" hidden>
    <button type="button" id="vtHome">Curiosidades e Sites</button>
    <button type="button" id="vtProj">Projetos</button>
  </div>
</div>

<div class="view" id="viewHome">
  <div class="columns" id="columns">
    <div class="col" id="colCur">
      <div class="col-head"><div class="column-title">Curiosidades</div></div>
      <div class="grid curiosidades" id="curiosidadesGrid"></div>
    </div>
    <div class="col" id="colSites" hidden>
      <div class="col-head"><div class="column-title">Sites</div></div>
      <div class="grid" id="siteGrid"></div>
    </div>
  </div>
</div>

<div class="view" id="viewProj" hidden>
  <div class="ptools">
    <span class="count" id="pCount"></span>
    <button type="button" class="visto" id="btnVisto" hidden title="Marcar todas as alterações como vistas">✓ Visto</button>
    <div class="btns">
      <span class="hint" id="pHint"></span>
      <button type="button" id="btnAddProj" class="primary">+ projeto</button>
      <button type="button" id="btnEditProj">Editar</button>
    </div>
  </div>
  <div class="twrap">
    <table class="pt">
      <thead><tr id="pHead"></tr></thead>
      <tbody id="pBody"></tbody>
    </table>
  </div>
</div>

<dialog id="itemDlg" aria-labelledby="itemDlgTitle">
  <form id="itemForm" novalidate>
    <h2 id="itemDlgTitle">Novo item</h2>
    <label>Categoria
      <select id="fCat">
        <option value="site">Site</option>
        <option value="curiosidade">Curiosidade</option>
      </select>
    </label>
    <label>Link
      <input id="fUrl" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://… ou ficheiro.html" required>
      <span class="hint">Endereço completo (site) ou ficheiro do hub (ex.: quantica.html).</span>
    </label>
    <label>Título

<script>
(() => {
  const SB_URL = "https://aehitgqsfcpzuunyzpsh.supabase.co";
  const SB_KEY = "sb_publishable_UezgSImwgpd_EDfi02YC_w_6sqkD2Qc"; // chave pública; a segurança está nas políticas RLS
  const URL_RE = /^(https?:\/\/[^\s]+|\/?[A-Za-z0-9_.\/~%?=&#-]+)$/;
  const LS_SESSION = "hub.session";
  const LS_CACHE = "hub.itens";

  // Lista de reserva: usada se a base de dados não responder e ainda não houver cópia guardada.
  const SEED = [
    { categoria: "curiosidade", ordem: 10, titulo: "Quântica", url: "quantica.html", descricao: "Notas e explicações sobre mecânica quântica." },
    { categoria: "curiosidade", ordem: 20, titulo: "Relatividade", url: "relatividade.html", descricao: "Notas e explicações sobre a teoria da relatividade." },
    { categoria: "curiosidade", ordem: 30, titulo: "Criptografia", url: "criptografia.html", descricao: "Notas e explicações sobre criptografia." },
    { categoria: "curiosidade", ordem: 40, titulo: "Eletricidade", url: "eletricidade.html", descricao: "Notas e explicações sobre eletricidade." },
    { categoria: "curiosidade", ordem: 50, titulo: "Binário", url: "binario.html", descricao: "Notas e explicações sobre o sistema binário." },
    { categoria: "curiosidade", ordem: 60, titulo: "Internet, Dark Web e Sites", url: "/internet", descricao: "Notas e explicações sobre a internet, a dark web e como funcionam os sites." },
    { categoria: "curiosidade", ordem: 70, titulo: "Bolsa", url: "bolsa.html", descricao: "Notas e explicações sobre a bolsa e o investimento." },
    { categoria: "curiosidade", ordem: 80, titulo: "Guia de Sites", url: "guia-site.html", descricao: "Guia sobre como criar e gerir sites." }
  ];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  let session = store.get(LS_SESSION);
  let isAdmin = false;
  let view = "home"; // "home" | "proj"
  let psort = { key: "data_info", dir: -1 }; // por defeito: última informação, mais recente primeiro
  const RESPS = [["", "—"], ["Dinis", "Dinis"], ["Sebastião", "Sebastião"], ["2", "2"]];
  let vistoEm = 0; // até quando esta conta já viu as alterações (ms)
  let editMode = false;   // projetos: arrastar linhas
  let editItens = false;  // curiosidades/sites: arrastar e editar
  const PERIODOS = [
    ["", "Sem periodicidade"], ["semanal", "Semanal", 7, 0], ["quinzenal", "Quinzenal", 14, 0],
    ["mensal", "Mensal", 0, 1], ["bimestral", "Bimestral", 0, 2], ["trimestral", "Trimestral", 0, 3],
    ["semestral", "Semestral", 0, 6], ["anual", "Anual", 0, 12]
  ];
  let notasBy = new Map(); // projeto_id -> pontos de situação (mais recente primeiro)
  let notaProj = null;     // projeto do diálogo de ponto de situação / histórico
  const ESTADOS = [
    ["ideia", "Ideia"], ["planeamento", "Planeamento"], ["desenvolvimento", "Em desenvolvimento"],
    ["testes", "Fase de testes"], ["producao", "Em produção"], ["standby", "Standby"],
    ["concluido", "Concluído"], ["cancelado", "Cancelado"]
  ];
  const estLabel = (k) => (ESTADOS.find((e) => e[0] === k) || [0, k || "—"])[1];
  const estIdx = (k) => Math.max(0, ESTADOS.findIndex((e) => e[0] === k));
  let projOk = false; // conta autorizada a ver/gerir Projetos (confirmado pelo servidor)
  let projetos = [];
  let editingProj = null;
  let itens = store.get(LS_CACHE) || SEED;
  let editing = null;

  /* ---------- Supabase (REST + Auth, sem bibliotecas) ---------- */
  function setSession(d, email) {
    if (!d) { session = null; store.del(LS_SESSION); return; }
    session = {
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
      email: email || (d.user && d.user.email) || ""
    };
    store.set(LS_SESSION, session);
  }

  async function refreshSession() {
    if (!session || !session.refresh_token) return false;
    try {
      const r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST",
        headers: { apikey: SB_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: session.refresh_token })
      });
      if (!r.ok) { setSession(null); isAdmin = false; return false; }
      setSession(await r.json(), session.email);
      return true;
    } catch (e) { return false; }
  }

  async function api(path, opts = {}, retry = true) {
    if (session && session.expires_at - 60 < Date.now() / 1000) await refreshSession();
    const headers = Object.assign({ apikey: SB_KEY, "Content-Type": "application/json" }, opts.headers || {});
    if (session) headers.Authorization = "Bearer " + session.access_token;
    const r = await fetch(SB_URL + path, Object.assign({}, opts, { headers }));
    if (r.status === 401 && session && retry && (await refreshSession())) return api(path, opts, false);
    return r;
  }

  /* ---------- Datas (AAAA-MM-DD, sem fusos horários) ---------- */
  const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const fmtD = (iso) => iso ? iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4) : "—";
  function proxima(p) {
    const per = PERIODOS.find((x) => x[0] === p.periodicidade);
    const base = ultInfo(p);
    if (!base || !per || !per[0]) return null;
    const [y, m, d] = base.split("-").map(Number);
    let dt;
    if (per[2]) dt = new Date(Date.UTC(y, m - 1, d + per[2]));
    else {
      const ult = new Date(Date.UTC(y, m - 1 + per[3] + 1, 0)).getUTCDate(); // último dia do mês de destino
      dt = new Date(Date.UTC(y, m - 1 + per[3], Math.min(d, ult)));
    }
    return dt.toISOString().slice(0, 10);
  }
  const lastNota = (p) => (notasBy.get(p.id) || [])[0] || null;
  /* Não visto = feito por outra pessoa depois do último "Visto" desta conta. */
  const eu = () => String((session && session.email) || "").toLowerCase();
  const naoVisto = (a) => !!a && String(a.por || "").toLowerCase() !== eu() && Date.parse(a.em) > vistoEm;
  const campoNovo = (p, ...cs) => { const al = p.alteracoes || {}; return naoVisto(al._novo) || cs.some((c) => naoVisto(al[c])); };
  const notaNova = (n) => naoVisto({ por: n.autor, em: n.created_at });
  const temNotaNova = (p) => (notasBy.get(p.id) || []).some(notaNova);
  const projNovo = (p) => campoNovo(p, "titulo", "link", "estado", "responsavel", "pessoas", "data_info", "periodicidade") || temNotaNova(p);
  // Última informação = a mais recente entre a data do último ponto de situação e a data posta à mão.
  const ultInfo = (p) => { const n = lastNota(p), a = n ? n.data : null, b = p.data_info; return a && b ? (a > b ? a : b) : a || b || null; };

  async function checkAdmin() {
    isAdmin = false;
    if (!session) return;
    try {
      const r = await api("/rest/v1/rpc/e_admin_plataforma", { method: "POST", body: "{}" });
      isAdmin = r.ok && (await r.json()) === true;
    } catch (e) {}
  }

  async function checkProj() {
    projOk = false;
    if (!session) return;
    try {
      const r = await api("/rest/v1/rpc/e_hub_projetos", { method: "POST", body: "{}" });
      projOk = r.ok && (await r.json()) === true;
    } catch (e) {}
  }

  async function loadProj() {
    projetos = [];
    if (!projOk) return;
    try {
      const [r, rn, rv] = await Promise.all([
        api("/rest/v1/hub_projetos?select=*&order=ordem.asc,created_at.asc"),
        api("/rest/v1/hub_projeto_notas?select=*&order=data.desc,created_at.desc"),
        api("/rest/v1/hub_vistos?select=visto_em")
      ]);
      if (r.ok) projetos = await r.json();
      if (rv.ok) { const v = (await rv.json())[0]; vistoEm = v ? Date.parse(v.visto_em) : 0; }
      notasBy = new Map();
      if (rn.ok) for (const n of await rn.json()) {
        if (!notasBy.has(n.projeto_id)) notasBy.set(n.projeto_id, []);
        notasBy.get(n.projeto_id).push(n);
      }
    } catch (e) {}
  }

  async function load() {
    try {
      const r = await api("/rest/v1/hub_itens?select=*&order=ordem.asc,created_at.asc");
      if (!r.ok) throw new Error(r.status);
      itens = await r.json();
      store.set(LS_CACHE, itens);
      setStatus("");
    } catch (e) {
      setStatus("Sem ligação à base de dados — a mostrar a última lista guardada.");
    }
    await loadProj();
    render();
  }

  /* ---------- Interface ---------- */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function setStatus(t) { $("status").textContent = t; }

  function card(i) {
    const wrap = el("div", "card-wrap");
    const a = el("a", "card");
    a.href = URL_RE.test(i.url) ? i.url : "#";
    a.append(el("div", "card-title", i.titulo), el("div", "card-desc", i.descricao || ""));
    wrap.append(a);
    if (editItens && isAdmin && i.id) {
      wrap.dataset.id = i.id;
      a.title = "Editar " + i.titulo;
      a.addEventListener("click", (e) => { e.preventDefault(); openItem(i); });
      if (!searching()) {
        const g = el("span", "grip", "☰");
        g.title = "Arrastar para mudar a ordem";
        g.setAttribute("aria-label", "Arrastar " + i.titulo);
        g.addEventListener("pointerdown", (e) => startDrag(e, wrap, g, (ids) =>
          persistOrder("hub_itens", itens.filter((x) => x.categoria === i.categoria), ids, load, () => store.set(LS_CACHE, itens))));
        wrap.append(g);
      }
    }
    return wrap;
  }

  const searching = () => ($("q").value || "").trim() !== "";
  const byOrdem = (a, b) => (a.ordem - b.ordem) || String(a.created_at || "").localeCompare(String(b.created_at || ""));

  let moving = false;

  const norm = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  const PCOLS = [
    ["titulo", "Título"], ["estado", "Estado"], ["responsavel", "Responsável"],
    ["pessoas", "Pessoas envolvidas"], ["notas", "Ponto de situação"],
    ["data_info", "Últ. informação"], ["proxima", "Próx. informação"]
  ];
  const sortVal = (p, k) => k === "notas" ? (lastNota(p) || {}).texto : k === "proxima" ? proxima(p) : k === "data_info" ? ultInfo(p) : p[k];

  function pCompare(a, b) {
    const k = psort.key;
    let r;
    if (k === "estado") r = estIdx(a.estado) - estIdx(b.estado);
    else {
      const va = sortVal(a, k) || "", vb = sortVal(b, k) || "";
      if (!va !== !vb) return va ? -1 : 1; // vazios sempre no fim
      r = String(va).localeCompare(String(vb), "pt", { sensitivity: "base", numeric: true });
    }
    return r * psort.dir || byOrdem(a, b);
  }

  function renderProjHead(canDrag) {
    const tr = $("pHead");
    tr.replaceChildren();
    if (canDrag) tr.append(el("th", "h"));
    for (const [k, label] of PCOLS) {
      const th = el("th");
      th.setAttribute("aria-sort", psort.key === k ? (psort.dir === 1 ? "ascending" : "descending") : "none");
      const b = el("button", "sort");
      b.type = "button";
      b.append(label, el("span", "arr", psort.key === k ? (psort.dir === 1 ? "▲" : "▼") : "↕"));
      b.title = "Ordenar por " + label.toLowerCase();
      b.addEventListener("click", () => {
        if (psort.key !== k) psort = { key: k, dir: 1 };
        else if (psort.dir === 1) psort = { key: k, dir: -1 };
        else psort = { key: null, dir: 1 }; // 3.º clique: volta à ordem manual
        render();
      });
      th.append(b);
      tr.append(th);
    }
    tr.append(el("th"));
  }

  // Opções do responsável (mantém um valor antigo fora da lista para não o perder).
  function respOpcoes(sel, atual) {
    sel.replaceChildren();
    const lista = RESPS.slice();
    if (atual && !lista.some((x) => x[0] === atual)) lista.push([atual, atual]);
    for (const [v, t] of lista) { const o = el("option", null, t); o.value = v; sel.append(o); }
    sel.value = atual || "";
  }

  async function changeResp(p, sel) {
    const old = p.responsavel || "";
    const v = sel.value;
    p.responsavel = v;
    try {
      const r = await api("/rest/v1/hub_projetos?id=eq." + encodeURIComponent(p.id), {
        method: "PATCH", headers: { Prefer: "return=representation" },
        body: JSON.stringify({ responsavel: v, updated_at: new Date().toISOString() })
      });
      const rows = r.ok ? await r.json() : [];
      if (!rows.length) throw new Error("save");
      setStatus("");
    } catch (e) {
      p.responsavel = old;
      setStatus("Não foi possível alterar o responsável.");
    }
    render();
  }

  async function changeEstado(p, sel) {
    const old = p.estado;
    p.estado = sel.value;
    sel.parentNode.className = "estwrap st-" + p.estado;
    try {
      const r = await api("/rest/v1/hub_projetos?id=eq." + encodeURIComponent(p.id), {
        method: "PATCH", headers: { Prefer: "return=representation" },
        body: JSON.stringify({ estado: p.estado, updated_at: new Date().toISOString() })
      });
      const rows = r.ok ? await r.json() : [];
      if (!rows.length) throw new Error("save");
      setStatus("");
      if (psort.key === "estado") render();
    } catch (e) {
      p.estado = old;
      setStatus("Não foi possível alterar o estado.");
      render();
    }
  }

  function projRow(p, canDrag) {
    const tr = el("tr");
    tr.dataset.id = p.id;
    if (canDrag) {
      const h = el("td", "h");
      const g = el("span", "grip", "☰");
      g.title = "Arrastar para mudar a ordem";
      g.setAttribute("aria-label", "Arrastar " + p.titulo);
      g.addEventListener("pointerdown", (e) => startDrag(e, tr, g, (ids) => persistOrder("hub_projetos", projetos, ids, loadProj, () => {})));
      h.append(g);
      tr.append(h);
    }
    const t = el("td", "t");
    if (p.link && URL_RE.test(p.link)) {
      const a = el("a", null, p.titulo);
      a.href = p.link; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.title = p.link.replace(/^https?:\/\//, "");
      t.append(a);
    } else t.textContent = p.titulo;
    if (campoNovo(p, "titulo", "link")) t.classList.add("novo");
    tr.append(t);
    const st = el("td", campoNovo(p, "estado") ? "novo" : null);
    const wrap = el("span", "estwrap st-" + (p.estado || "desenvolvimento"));
    const sel = el("select", "estsel");
    sel.setAttribute("aria-label", "Estado de " + p.titulo);
    for (const [k, label] of ESTADOS) { const o = el("option", null, label); o.value = k; sel.append(o); }
    sel.value = p.estado || "desenvolvimento";
    sel.addEventListener("change", () => changeEstado(p, sel));
    wrap.append(sel);
    st.append(wrap);
    tr.append(st);
    const rc = el("td", campoNovo(p, "responsavel") ? "novo" : null);
    const rw = el("span", "estwrap respwrap");
    const rs = el("select", "estsel");
    rs.setAttribute("aria-label", "Responsável de " + p.titulo);
    respOpcoes(rs, p.responsavel || "");
    rs.addEventListener("change", () => changeResp(p, rs));
    rw.append(rs);
    rc.append(rw);
    tr.append(rc);
    tr.append(el("td", campoNovo(p, "pessoas") ? "novo" : null, p.pessoas || ""));
    const n = el("td", "n");
    const nw = el("div", "nwrap");
    const add = el("button", "nadd", "+");
    add.type = "button"; add.title = "Novo ponto de situação";
    add.setAttribute("aria-label", "Novo ponto de situação de " + p.titulo);
    add.addEventListener("click", () => openNota(p));
    nw.append(add);
    const ln = lastNota(p);
    if (ln) {
      const nb = el("button", "nlast");
      nb.type = "button"; nb.title = "Ver todos os pontos de situação";
      nb.append(el("span", "nt", ln.texto));
      nb.addEventListener("click", () => openHist(p));
      nw.append(nb);
    }
    n.append(nw);
    if (temNotaNova(p) || campoNovo(p)) n.classList.add("novo");
    tr.append(n);
    tr.append(el("td", "d" + (temNotaNova(p) || campoNovo(p, "data_info") ? " novo" : ""), fmtD(ultInfo(p))));
    const px = proxima(p);
    tr.append(el("td", "d" + (px && px < hoje() ? " atraso" : "") + (campoNovo(p, "periodicidade", "data_info") ? " novo" : ""), fmtD(px)));
    const ac = el("td", "a");
    const b = el("button", "edit", "✎");
    b.type = "button"; b.title = "Editar";
    b.setAttribute("aria-label", "Editar " + p.titulo);
    b.addEventListener("click", () => openProj(p));
    ac.append(b);
    tr.append(ac);
    return tr;
  }

  function renderProj(nq) {
    const canDrag = editMode && !psort.key && !nq;
    renderProjHead(canDrag);
    const body = $("pBody");
    body.replaceChildren();
    const rows = projetos

  /* Arrastar (rato e toque): o elemento segue o dedo, o resto não se mexe até largares.
     Serve para as linhas dos projetos e para os cartões das curiosidades/sites. */
  function startDrag(e, tr, grip, onDrop) {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    const body = tr.parentNode, wrap = body.closest(".twrap, .grid");
    const others = [...body.children].filter((x) => x !== tr && x.dataset.id);
    const startY = e.clientY, startScroll = wrap.scrollTop;
    const h = tr.offsetHeight, top0 = tr.offsetTop;
    let target = others.indexOf(tr), dy = 0, lastY = startY, raf = 0;
    tr.classList.add("dragging");
    try { grip.setPointerCapture(e.pointerId); } catch (err) {}

    const centers = others.map((r) => r.offsetTop + r.offsetHeight / 2);
    function update() {
      dy = (lastY - startY) + (wrap.scrollTop - startScroll);
      tr.style.transform = "translateY(" + dy + "px)";
      const c = top0 + h / 2 + dy;
      target = centers.filter((x) => x < c).length; // posição entre as outras linhas
      others.forEach((r, i) => {
        r.classList.toggle("drop-before", i === target);
        r.classList.toggle("drop-after", i === others.length - 1 && target === others.length);
      });
    }
    function tick() {
      const r = wrap.getBoundingClientRect();
      if (lastY < r.top + 50) wrap.scrollTop -= 10;
      else if (lastY > r.bottom - 50) wrap.scrollTop += 10;
      update();
      raf = requestAnimationFrame(tick);
    }
    function onMove(ev) { lastY = ev.clientY; }
    function end(ev, cancel) {
      cancelAnimationFrame(raf);
      grip.removeEventListener("pointermove", onMove);
      grip.removeEventListener("pointerup", onUp);
      grip.removeEventListener("pointercancel", onCancel);
      tr.classList.remove("dragging");
      tr.style.transform = "";
      others.forEach((r) => r.classList.remove("drop-before", "drop-after"));
      if (cancel) return;
      const ref = others[target] || null;
      if (ref === tr.nextSibling || (!ref && !tr.nextSibling)) return; // mesma posição
      body.insertBefore(tr, ref);
      onDrop([...body.children].map((r) => r.dataset.id).filter(Boolean));
    }
    const onUp = (ev) => end(ev, false);
    const onCancel = (ev) => end(ev, true);
    grip.addEventListener("pointermove", onMove);
    grip.addEventListener("pointerup", onUp);
    grip.addEventListener("pointercancel", onCancel);
    raf = requestAnimationFrame(tick);
  }

  async function persistOrder(table, list, ids, reload, persistLocal) {
    if (moving) return;
    const byId = new Map(list.map((x) => [x.id, x]));
    const changed = [];
    ids.forEach((id, idx) => {
      const x = byId.get(id), o = (idx + 1) * 10;
      if (x && x.ordem !== o) { x.ordem = o; changed.push(x); }
    });
    persistLocal();
    render();
    if (!changed.length) return;
    moving = true;
    try {
      const rs = await Promise.all(changed.map((x) =>
        api("/rest/v1/" + table + "?id=eq." + encodeURIComponent(x.id), {
          method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify({ ordem: x.ordem })
        }).then(async (r) => r.ok && (await r.json()).length > 0)
      ));
      if (rs.some((ok) => !ok)) throw new Error("save");
      setStatus("");
    } catch (e) {
      await reload();
      render();
      setStatus("Não foi possível guardar a nova ordem.");
    } finally {
      moving = false;
    }
  }

  /* ---------- Diálogo de item ---------- */
  function normUrl(u) {
    u = u.trim();
    const semParams = u.split(/[?#]/)[0];
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/i.test(u) && !/\.(html?|php)$/i.test(semParams)) return "https://" + u;
    return u;
  }
  function nextOrdem(cat) {
    const o = itens.filter((i) => i.categoria === cat).map((i) => i.ordem || 0);
    return (o.length ? Math.max(...o) : 0) + 10;
  }

    editing = item;
    $("itemDlgTitle").textContent = item ? "Editar item" : "Novo item";
    $("fCat").value = item ? item.categoria : "site";

  async function saveItem(ev) {
    ev.preventDefault();
    const err = $("itemErr");
    const cat = $("fCat").value;
    const url = normUrl($("fUrl").value);
    const titulo = $("fTitulo").value.trim();
    const descricao = $("fDesc").value.trim();
    if (!url) { err.textContent = "Indica o link."; return; }
    if (!URL_RE.test(url) || url.length > 500) { err.textContent = "Link inválido. Usa https://… ou o nome de um ficheiro (ex.: quantica.html)."; return; }
    if (!titulo) { err.textContent = "Indica o título."; return; }

    const body = { categoria: cat, titulo, url, descricao };
    $("btnSave").disabled = true;
    try {
      let r;
      if (editing) {
        body.updated_at = new Date().toISOString();
        if (editing.categoria !== cat) body.ordem = nextOrdem(cat);
        r = await api("/rest/v1/hub_itens?id=eq." + encodeURIComponent(editing.id), {
          method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body)
        });
      } else {
        body.ordem = nextOrdem(cat);
        r = await api("/rest/v1/hub_itens", {
          method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(body)
        });
      }
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        err.textContent = r.status === 401 || r.status === 403
          ? "Sem permissão para guardar. Entra com a conta de administrador."
          : "Não foi possível guardar" + (d.message ? ": " + d.message : ".");
        return;
      }
      const rows = await r.json();
      if (!rows.length) { err.textContent = "Sem permissão para guardar. Entra com a conta de administrador."; return; }
      $("itemDlg").close();
      await load();
    } catch (e) {
      err.textContent = "Sem ligação. Tenta outra vez.";
    } finally {
      $("btnSave").disabled = false;
    }
  }

  function aplicarAspeto() {
    window.hubAspeto(aspeto);
    const fundo = aspeto.tema === "claro" ? "#f4f5f7" : aspeto.tema === "escuro" ? "#121316" : null;
    for (const [m, orig] of META_TC) m.content = fundo || orig;
    for (const b of $("setTema").children) b.classList.toggle("on", (b.dataset.tema || "") === (aspeto.tema || ""));
    const r = document.documentElement;
    const escuro = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    for (const b of $("setCor").children) {
      b.style.setProperty("--c", window.HUB_CORES[b.dataset.cor][escuro ? 2 : 1]);
      b.classList.toggle("on", b.dataset.cor === (aspeto.cor || "azul"));
    }
  }
  function setAspeto(k, v) { aspeto[k] = v; store.set("hub.aspeto", aspeto); aplicarAspeto(); }
  function openSet() { aplicarAspeto(); $("setDlg").showModal(); }

        body: JSON.stringify({ email, password: $("lPass").value })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        err.textContent = /invalid login/i.test(d.error_description || d.msg || "")
          ? "Email ou palavra-passe incorretos."
          : (d.error_description || d.msg || "Não foi possível entrar.");

  $("btnDel").addEventListener("click", deleteItem);
  $("loginForm").addEventListener("submit", doLogin);
  $("projForm").addEventListener("submit", saveProj);
  $("btnAddProj").addEventListener("click", () => openProj(null));
  $("btnVisto").addEventListener("click", marcarVisto);
  $("pCancel").addEventListener("click", () => $("projDlg").close());
  $("pDel").addEventListener("click", deleteProj);
  for (const [k, label] of ESTADOS) { const o = el("option", null, label); o.value = k; $("pEstado").append(o); }
  for (const [k, label] of PERIODOS) { const o = el("option", null, label); o.value = k; $("pPer").append(o); }
  $("notaForm").addEventListener("submit", saveNota);
  $("nCancel").addEventListener("click", () => $("notaDlg").close());
  $("hClose").addEventListener("click", () => $("histDlg").close());
  $("hAdd").addEventListener("click", () => openNota(notaProj));
  $("btnEditProj").addEventListener("click", () => {
    editMode = !editMode;
    if (editMode) psort = { key: null, dir: 1 };
    render();
  });
  $("vtHome").addEventListener("click", () => setView("home"));
  $("vtProj").addEventListener("click", () => setView("proj"));
  $("btnLoginCancel").addEventListener("click", () => $("loginDlg").close());
  // Fecha ao tocar fora só se o toque começou E acabou fora (arrastar a partir do diálogo não fecha).
  const fora = (d, e) => { const r = d.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  for (const id of ["itemDlg", "loginDlg", "projDlg", "notaDlg", "histDlg", "setDlg"]) {
    const d = $(id);
    let comecouFora = false;
    d.addEventListener("pointerdown", (e) => { comecouFora = e.target === d && fora(d, e); });
    d.addEventListener("click", (e) => { if (comecouFora && e.target === d && fora(d, e)) d.close(); comecouFora = false; });
  }

  render(); // mostra já a última lista guardada
  (async () => {
    await Promise.all([checkAdmin(), checkProj()]);
    await load();
  })();
})();
</script>

</body>
</html>
