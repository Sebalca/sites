          rowsWrap.querySelectorAll('.ccmv-valor').forEach(inp=> inp.onchange=()=>{ c.manualValores[+inp.dataset.mi].valor = +inp.value; });
          rowsWrap.querySelectorAll('#ccRmMv').forEach(btn=> btn.onclick=()=>{ c.manualValores.splice(+btn.dataset.mi,1); paintManual(); });
        }
        area.querySelector('#ccAddManualRow').onclick = ()=>{ c.manualValores.push({mes:0,valor:0}); paintManual(); };
        paintManual();
      } else if(dist==='percentual'){
        area.innerHTML = `<div class="section-sub">Distribuição percentual por mês (deve somar 100%)</div>
          <div id="ccPercRows"></div>
          <button class="icon-btn" id="ccAddPercRow">+ Adicionar mês</button>
          <div class="methodology" id="ccPercSum"></div>`;
        const rowsWrap = area.querySelector('#ccPercRows');
        function paintPerc(){
          rowsWrap.innerHTML = (c.percentuais||[]).map((pv,i)=>`
            <div class="grid cols-3" style="margin-bottom:6px;">
              <input type="number" data-pi="${i}" class="ccpv-mes" placeholder="Mês" value="${pv.mes}">
              <input type="number" step="0.01" data-pi="${i}" class="ccpv-perc" placeholder="%" value="${(pv.perc*100).toFixed(2)}">
              <button class="icon-btn danger" data-pi="${i}" id="ccRmPv">Remover</button>
            </div>`).join('');
          rowsWrap.querySelectorAll('.ccpv-mes').forEach(inp=> inp.onchange=()=>{ c.percentuais[+inp.dataset.pi].mes = +inp.value; updateSum(); });
          rowsWrap.querySelectorAll('.ccpv-perc').forEach(inp=> inp.onchange=()=>{ c.percentuais[+inp.dataset.pi].perc = (+inp.value)/100; updateSum(); });
          rowsWrap.querySelectorAll('#ccRmPv').forEach(btn=> btn.onclick=()=>{ c.percentuais.splice(+btn.dataset.pi,1); paintPerc(); updateSum(); });
          updateSum();
        }
        function updateSum(){
          const soma = Util.sum(c.percentuais||[], x=>x.perc||0);
          area.querySelector('#ccPercSum').innerHTML = `Soma: <strong>${Util.fmtPct(soma)}</strong> ${Math.abs(soma-1)>0.005?'<span class="tag bad">deve ser 100%</span>':'<span class="tag ok">ok</span>'}`;
        }
        area.querySelector('#ccAddPercRow').onclick = ()=>{ c.percentuais.push({mes:0,perc:0}); paintPerc(); };
        paintPerc();
      } else {
        area.innerHTML = '';
      }
    }
    modalEl.querySelector('#cc_distribuicao').onchange = renderDistArea;
    renderDistArea();
    const catSelectEl = modalEl.querySelector('#cc_categoria');
    const catNovaEl = modalEl.querySelector('#cc_categoria_nova');
    function toggleCategoriaNova(){
      if(catSelectEl.value==='__nova__'){ catNovaEl.style.display='block'; catNovaEl.focus(); }
      else { catNovaEl.style.display='none'; }
    }
    catSelectEl.onchange = toggleCategoriaNova;
    toggleCategoriaNova();
    const projStart = Store.active() ? Store.active().assumptions.dataInicio : null;
    const ccMesInicioEl = modalEl.querySelector('#cc_mesInicio'), ccMesFimEl = modalEl.querySelector('#cc_mesFim');
    function updateMesHints(){
      modalEl.querySelector('#cc_mesInicioHint').textContent = projStart ? Util.fmtDate(Util.addMonths(projStart, +ccMesInicioEl.value||0)) : '';
      modalEl.querySelector('#cc_mesFimHint').textContent = projStart ? Util.fmtDate(Util.addMonths(projStart, +ccMesFimEl.value||0)) : '';
    }
    ccMesInicioEl.oninput = updateMesHints;
    ccMesFimEl.oninput = updateMesHints;
    updateMesHints();
    modalEl.closest('.modal-backdrop').querySelector('#btnCancel').onclick = closeModals;

      const catSel = modalEl.querySelector('#cc_categoria').value;
      c.categoria = catSel==='__nova__' ? (modalEl.querySelector('#cc_categoria_nova').value.trim()||'Outros') : catSel;
      c.subcategoria = modalEl.querySelector('#cc_subcategoria').value;
      c.descricao = modalEl.querySelector('#cc_descricao').value;
      c.fornecedor = modalEl.querySelector('#cc_fornecedor').value;
      c.valorVenda = +modalEl.querySelector('#cc_valorVenda').value||0;
      // Se o valor de construção não for preenchido (ou for 0), assume o valor de venda —
      // nunca fica a 0, e fica gravado assim (não se perde ao mudar de aba).
      c.valorConstrucao = +modalEl.querySelector('#cc_valorConstrucao').value || c.valorVenda || 0;
      c.temIVA = modalEl.querySelector('#cc_temIVA').checked;
      c.taxaIVA = (+modalEl.querySelector('#cc_taxaIVA').value||0)/100;
      c.ivaDedutivel = modalEl.querySelector('#cc_ivaDedutivel').value;
      c.percDedutivel = (+modalEl.querySelector('#cc_percDedutivel').value||0)/100;
      c.mesInicio = +modalEl.querySelector('#cc_mesInicio').value||0;
      c.mesFim = +modalEl.querySelector('#cc_mesFim').value||0;
      c.distribuicao = modalEl.querySelector('#cc_distribuicao').value;
      c.observacoes = modalEl.querySelector('#cc_observacoes').value;
      onSave(c);
      closeModals();
    };
  });
}

/* =========================================================================
   VIEW: CUSTOS OUTROS (igual a "Custos construção", mas com "valor de compra"
   em vez de "valor de construção" — para custos que não são de obra)
   ========================================================================= */
function viewCustosOutros(p){
  const itemsOriginal = p.custosOutros||[];
  const totalVenda = Util.sum(itemsOriginal, x=>x.valorVenda||0);
  const totalCompra = Util.sum(itemsOriginal, x=>x.valorCompra||0);
  const sortAtivo = !!(UI.tableSort.custosOutros && UI.tableSort.custosOutros.col);
  const items = applyTableSort('custosOutros', itemsOriginal, {
    categoria: c=>c.categoria||'', subcategoria: c=>c.subcategoria||'', descricao: c=>c.descricao||'',
    valorVenda: c=>c.valorVenda||0, valorCompra: c=>c.valorCompra||0,
    lucro: c=>(c.valorVenda||0)-(c.valorCompra||0), distribuicao: c=>c.distribuicao||'', mesInicio: c=>c.mesInicio||0
  });
  const rows = items.map((c,idx)=>{
    const lucro = (c.valorVenda||0)-(c.valorCompra||0);
    const realIdx = itemsOriginal.indexOf(c);
    return `<tr data-id="${c.id}">
      <td class="num mono" style="color:var(--ink-faint);">
        ${sortAtivo ? '—' : `<div style="display:flex;align-items:center;gap:2px;">
          <button class="icon-btn" data-act="up" title="Mover para cima" ${realIdx===0?'disabled':''}>↑</button>
          <button class="icon-btn" data-act="down" title="Mover para baixo" ${realIdx===itemsOriginal.length-1?'disabled':''}>↓</button>
        </div>`}
      </td>
      <td>${Util.escapeHtml(c.categoria)}</td>
      <td>${Util.escapeHtml(c.subcategoria||'')}</td>
      <td>${Util.escapeHtml(c.descricao||'')}</td>
      <td class="num mono">${Util.fmtMoney0(c.valorVenda)}</td>
      <td class="num mono">${Util.fmtMoney0(c.valorCompra)}</td>
      <td class="num mono" style="${lucro<0?'color:var(--neg)':''}">${Util.fmtMoney0(lucro)}</td>
      <td>${c.distribuicao}</td>
      <td class="num mono">${Util.monthWithDate(p.assumptions.dataInicio, c.mesInicio)}</td>
      <td class="row-actions">
        <button class="icon-btn" data-act="edit">Editar</button>
        <button class="icon-btn" data-act="move" title="Mover para 'Custos construção'">Mover →</button>
        <button class="icon-btn" data-act="dup">Duplicar</button>
        <button class="icon-btn danger" data-act="del">Eliminar</button>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="view-head"><div><h2>Custos outros</h2><p>Restantes rubricas de custo do projeto (não ligadas diretamente à obra), com o mesmo modelo de "Custos construção": valor de venda e valor de compra por rubrica. Clica num cabeçalho de coluna para ordenar.</p></div>
    <button class="tb-btn primary" id="btnAddCustoOutro">+ Adicionar custo</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="k-label">Total de venda</div><div class="k-value">${Util.fmtMoney0(totalVenda)}</div></div>
    <div class="kpi"><div class="k-label">Total de compra</div><div class="k-value">${Util.fmtMoney0(totalCompra)}</div></div>
    <div class="kpi"><div class="k-label">Lucro total</div><div class="k-value ${totalVenda-totalCompra<0?'neg':'pos'}">${Util.fmtMoney0(totalVenda-totalCompra)}</div></div>
    <div class="kpi"><div class="k-label">Nº de rubricas</div><div class="k-value">${items.length}</div></div>
  </div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th></th>
      ${sortTh('custosOutros','categoria','Categoria')}
      ${sortTh('custosOutros','subcategoria','Subcategoria')}
      ${sortTh('custosOutros','descricao','Descrição')}
      ${sortTh('custosOutros','valorVenda','Valor de venda','num')}
      ${sortTh('custosOutros','valorCompra','Valor de compra','num')}
      ${sortTh('custosOutros','lucro','Lucro','num')}
      ${sortTh('custosOutros','distribuicao','Distribuição')}
      ${sortTh('custosOutros','mesInicio','Mês início','num')}
      <th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="10" class="empty">Sem custos registados.</td></tr>'}</tbody>
  </table></div>`;
}

/* =========================================================================
   VIEW: ANÁLISE CONSTRUÇÃO
   ========================================================================= */
function viewAnaliseConstrucao(p, cf){
  const ce = ConstructionEngine.build(p, cf.monthCount);
  const labels = Array.from({length:cf.monthCount},(_,i)=>Util.monthLabel(cf.start,i));
  const catLabels = Object.keys(ce.porCategoria);
  const margem = ce.totalVenda>0 ? ce.totalLucro/ce.totalVenda : null;
  return `
  <div class="view-head"><div><h2>Análise construção</h2><p>Margem (venda vs. construção) por rubrica e por categoria, com base nas rubricas da aba "Custos construção". O "valor de venda" de cada rubrica é o mesmo que conta como custo no cash-flow geral do projeto.</p></div></div>
  <div class="kpis">
    <div class="kpi"><div class="k-label">Total de venda${kpiInfo('Soma do "valor de venda" de todas as rubricas de Custos construção. É este valor que conta como custo real no cash-flow geral do projeto. Fórmula: Σ valorVenda de cada rubrica.')}</div><div class="k-value">${Util.fmtMoney0(ce.totalVenda)}</div></div>
    <div class="kpi"><div class="k-label">Total de construção${kpiInfo('Soma do "valor de construção" de todas as rubricas — o custo real de obra, só usado para calcular a margem nesta aba (não entra no cash-flow geral). Fórmula: Σ valorConstrucao de cada rubrica.')}</div><div class="k-value">${Util.fmtMoney0(ce.totalConstrucao)}</div></div>
    <div class="kpi"><div class="k-label">Lucro total${kpiInfo('Diferença entre o valor de venda e o valor de construção de todas as rubricas. Fórmula: Total de venda − Total de construção.')}</div><div class="k-value ${ce.totalLucro<0?'neg':'pos'}">${Util.fmtMoney0(ce.totalLucro)}</div></div>
    <div class="kpi"><div class="k-label">Margem${kpiInfo('Lucro total em percentagem do valor de venda. Fórmula: Lucro total ÷ Total de venda.')}</div><div class="k-value">${margem!==null?Util.fmtPct(margem):'—'}</div></div>
  </div>
  <div class="card"><h3>Cash-flow da construção (venda vs construção, mensal e acumulado)</h3><div class="chart-box"><canvas id="chartConstrucaoCF"></canvas></div></div>
  <div class="card"><h3>Venda, construção e lucro por categoria</h3><div class="chart-box"><canvas id="chartConstrucaoCat"></canvas></div></div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th>Categoria</th><th class="num">Venda</th><th class="num">Construção</th><th class="num">Lucro</th><th class="num">Margem</th></tr></thead>
    <tbody>${catLabels.length?catLabels.map(k=>{
      const v = ce.porCategoria[k];
      const m = v.venda>0 ? v.lucro/v.venda : null;
      return `<tr><td>${Util.escapeHtml(k)}</td><td class="num mono">${Util.fmtMoney0(v.venda)}</td><td class="num mono">${Util.fmtMoney0(v.construcao)}</td><td class="num mono" style="${v.lucro<0?'color:var(--neg)':''}">${Util.fmtMoney0(v.lucro)}</td><td class="num mono">${m!==null?Util.fmtPct(m):'—'}</td></tr>`;
    }).join(''):'<tr><td colspan="5" class="empty">Sem custos de construção registados.</td></tr>'}</tbody>
  </table></div>`;
}

function viewCasas(p, cf){
  const rows = p.houses.map(h=>{
    const total = SalesEngine.paymentsTotal(h);
    const preco = h.precoVendaEfetivo||h.precoVendaPrevisto||0;
    const pct = preco>0 ? total/preco : 1;
    const fase = p.phases.find(f=>f.id===h.faseId);
    return `<tr data-id="${h.id}">
      <td>${Util.escapeHtml(h.referencia)}</td>
      <td>${fase?Util.escapeHtml(fase.nome):'—'}</td>
      <td>${Util.escapeHtml(h.tipologia||'')}</td>
      <td class="num">${h.area||'—'}</td>
      <td><span class="tag">${h.estado}</span></td>
      <td class="num mono">${Util.fmtMoney0(h.precoVendaPrevisto)}</td>
      <td class="num mono">${h.precoVendaEfetivo?Util.fmtMoney0(h.precoVendaEfetivo):'—'}</td>
      <td>${Math.abs(pct-1)>0.005 && !h.ignorarValidacao100 ? `<span class="tag bad">${Util.fmtPct(pct,0)}</span>` : `<span class="tag ok">100%</span>`}</td>
      <td class="row-actions">
        <button class="icon-btn" data-act="pagamentos">Pagamentos</button>
        <button class="icon-btn" data-act="edit">Editar</button>
        <button class="icon-btn" data-act="dup">Duplicar</button>
        <button class="icon-btn danger" data-act="del">Eliminar</button>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="view-head"><div><h2>Casas / Vendas</h2><p>Cada moradia com o seu próprio plano de pagamentos, alimentando automaticamente o cash-flow.</p></div>
    <div class="small-btn-row">
      <button class="tb-btn" id="btnBulkAdd">+ Adicionar várias</button>
      <button class="tb-btn" id="btnApplyPlan">Aplicar plano de pagamentos a uma fase</button>
      <button class="tb-btn" id="btnManagePhases">Gerir fases</button>
      <button class="tb-btn primary" id="btnAddHouse">+ Adicionar casa</button>
    </div>
  </div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th>Referência</th><th>Fase</th><th>Tipologia</th><th class="num">Área</th><th>Estado</th><th class="num">Preço previsto</th><th class="num">Preço efetivo</th><th>Pagamentos</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="9" class="empty">Sem casas registadas.</td></tr>'}</tbody>
  </table></div>`;
}

function paymentsEditorModal(house, onSave){
  const h = Util.deepClone(house);
  function total(){ return h.precoVendaEfetivo||h.precoVendaPrevisto||0; }

  `, (modalEl)=>{
    const wrap = modalEl.querySelector('#payRows');
    const estados = ['prevista','paga'];
    function paint(){
      wrap.innerHTML = h.pagamentos.map((pay,i)=>`
        <div class="grid cols-4" style="margin-bottom:8px;align-items:end;">
          <div class="field"><label>Nome</label><input class="p-nome" data-i="${i}" value="${Util.escapeHtml(pay.nome)}"></div>

          <div class="field"><label>Data prevista</label><input type="date" class="p-datap" data-i="${i}" value="${pay.dataPrevista||''}"></div>
          <div class="field"><label>Data efetiva</label><input type="date" class="p-datae" data-i="${i}" value="${pay.dataEfetiva||''}"></div>
          <div class="field"><label>Estado</label><select class="p-estado" data-i="${i}">${estados.map(e=>`<option ${pay.estado===e?'selected':''}>${e}</option>`).join('')}</select></div>
          <button class="icon-btn danger" data-i="${i}" id="rmPay">Remover</button>
        </div>`).join('');
      wrap.querySelectorAll('.p-nome').forEach(el=> el.onchange=()=>{ h.pagamentos[+el.dataset.i].nome = el.value; });
      wrap.querySelectorAll('.p-perc').forEach(el=> el.onchange=()=>{ h.pagamentos[+el.dataset.i].percentagem = (+el.value)/100; h.pagamentos[+el.dataset.i].valor = (+el.value)/100*total(); paint(); });
      wrap.querySelectorAll('.p-valor').forEach(el=> el.onchange=()=>{ h.pagamentos[+el.dataset.i].valor = +el.value; updateSum(); });
      wrap.querySelectorAll('.p-datap').forEach(el=> el.onchange=()=>{ h.pagamentos[+el.dataset.i].dataPrevista = el.value; });

      wrap.querySelectorAll('#rmPay').forEach(btn=> btn.onclick=()=>{ h.pagamentos.splice(+btn.dataset.i,1); paint(); updateSum(); });
      updateSum();
    }
    function updateSum(){
      const soma = Util.sum(h.pagamentos, x=>x.valor||0);
      const pct = total()>0?soma/total():0;
      modalEl.querySelector('#paySum').innerHTML = `Soma dos pagamentos: <strong>${Util.fmtMoney0(soma)}</strong> (${Util.fmtPct(pct)}) ${Math.abs(pct-1)>0.005?'<span class="tag bad">≠ 100%</span>':'<span class="tag ok">100%</span>'}`;
    }
    modalEl.querySelector('#addPayRow').onclick = ()=>{ h.pagamentos.push({id:Util.uid(),nome:'Nova etapa',percentagem:0,valor:0,dataPrevista:'',dataEfetiva:null,estado:'prevista'}); paint(); };
    paint();
    modalEl.closest('.modal-backdrop').querySelector('#btnCancel').onclick = closeModals;
    modalEl.closest('.modal-backdrop').querySelector('#btnSave').onclick = ()=>{ onSave(h); closeModals(); };
  });
}

function viewInvestidores(p, cf){
  const itemsOriginal = p.investors.map(inv=>{
    const contrib = cf.investorContribBreakdown.find(x=>x.id===inv.id)||{total:0};
    const dist = cf.investorDistBreakdown.find(x=>x.id===inv.id)||{capitalDevolvido:0,remuneracao:0};
    const dataNec = computeDataNecessidade(p, inv);
    return {inv, contrib, dist, dataNec};
  });
  const items = applyTableSort('investidores', itemsOriginal, {
    nome: x=>x.inv.nome||'', referencia: x=>x.inv.referencia||'', capital: x=>x.contrib.total||0,
    modelo: x=>(x.inv.returnModel?x.inv.returnModel.tipo:'')||'', entrada: x=>x.inv.dataEntrada||'',
    saida: x=>x.inv.dataSaidaPrevista||'', dataNec: x=>x.dataNec||'',
    totalReceber: x=>(x.dist.capitalDevolvido+x.dist.remuneracao)||0
  });
  const rows = items.map(({inv, contrib, dist, dataNec})=>{
    return `<tr data-id="${inv.id}">
      <td>${Util.escapeHtml(inv.nome)}</td>

  </div>
  <div class="tbl-wrap"><table class="data">

      ${sortTh('investidores','nome','Nome')}
      ${sortTh('investidores','referencia','Referência')}

const WF_TIER_LABELS = {suprimentos:'3. Devolução de suprimentos', preferencial:'4. Retorno preferencial (hurdle)', capital:'5. Devolução de capital (social + prestações)', lucro:'6. Distribuição do lucro', residual:'7. Resultado residual do promotor'};

function investorEditorModal(investor, onSave){
  const isNew = !investor;
  const inv = investor ? Util.deepClone(investor) : {id:Util.uid(),nome:'Novo Investidor',referencia:'',dataEntrada:Store.active().assumptions.dataInicio,dataSaidaPrevista:'',observacoes:'',contributions:[],categoriaNecessidade:null,diasNecessidade:0,returnModel:{tipo:'fixo',percentagem:0.2,percentagemAnual:0.15,percentagemMensal:0.015,percentagemLucro:0.2,retornoMinimo:null,retornoMaximo:null,hurdleRate:null,prazoMinimo:null,prazoMaximo:null,penalizacaoSaidaAntecipada:null,premioPermanencia:null,eventos:[]}};
  const tiposContrib = ['capital_social','suprimentos','prestacoes'];
  const tiposRetorno = [
    ['fixo','A. Retorno fixo total'], ['anual','B. Retorno anual'], ['mensal','C. Retorno mensal'],
    ['percentual_lucro','D. % do lucro do projeto'], ['capital_mais_lucro','E. Capital + participação no lucro'], ['manual','F. Modelo personalizado (eventos manuais)']
  ];
  openModal(`
    <h3>${isNew?'Novo investidor':'Editar investidor'}</h3>
    <div class="grid cols-2" style="margin-top:10px;">
      <div class="field"><label>Nome</label><input id="i_nome" value="${Util.escapeHtml(inv.nome)}"></div>
      <div class="field"><label>Referência</label><input id="i_ref" value="${Util.escapeHtml(inv.referencia)}"></div>
      <div class="field"><label>Data de entrada</label><input type="date" id="i_dataEntrada" value="${inv.dataEntrada}"></div>
      <div class="field"><label>Data prevista de saída</label><input type="date" id="i_dataSaida" value="${inv.dataSaidaPrevista||''}"></div>
    </div>
    <div class="section-sub">Estrutura da entrada (capital comprometido)</div>
    <div id="contribRows"></div>
    <button class="icon-btn" id="addContrib">+ Adicionar entrada de capital</button>

    <div class="section-sub">Data necessidade (opcional)${kpiInfo('Define quando o capital deste investidor tem de estar disponível: escolhe uma categoria de custo e um nº de dias de antecedência. A data necessidade = data de início dessa categoria − nº de dias. Se definida, o cash-flow passa a assumir que o dinheiro deste investidor entra nessa data, em vez das datas configuradas em cada entrada de capital.')}</div>
    <div class="grid cols-3">
      <div class="field"><label>Categoria necessária</label><select id="i_categoriaNecessidade">
        <option value="">— Nenhuma (usa as datas das entradas) —</option>
        ${Array.from(new Set(allProjectCosts(Store.active()||{construcaoCustos:[],custosOutros:[]}).map(c=>c.categoria).filter(Boolean))).map(cat=>`<option value="${Util.escapeHtml(cat)}" ${inv.categoriaNecessidade===cat?'selected':''}>${Util.escapeHtml(cat)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Dias de antecedência</label><input type="number" id="i_diasNecessidade" value="${inv.diasNecessidade||0}"></div>
      <div class="field"><label>Data necessidade calculada</label><div class="k-value" id="i_dataNecessidadePreview" style="font-size:15px;padding-top:6px;">—</div></div>
    </div>

    <div class="section-sub">Modelo de retorno</div>
    <div class="field"><select id="i_tipoRetorno">${tiposRetorno.map(([v,l])=>`<option value="${v}" ${inv.returnModel.tipo===v?'selected':''}>${l}</option>`).join('')}</select></div>
    <div id="retornoParamsArea" style="margin-top:10px;"></div>

    <div class="section-sub">Condições avançadas (opcional)</div>
    <div class="grid cols-4">
      <div class="field"><label>Retorno mínimo (€)</label><input type="number" id="i_retMin" value="${inv.returnModel.retornoMinimo!==null&&inv.returnModel.retornoMinimo!==undefined?inv.returnModel.retornoMinimo:''}"></div>
      <div class="field"><label>Retorno máximo (€)</label><input type="number" id="i_retMax" value="${inv.returnModel.retornoMaximo!==null&&inv.returnModel.retornoMaximo!==undefined?inv.returnModel.retornoMaximo:''}"></div>
      <div class="field"><label>Hurdle rate anual (%)</label><input type="number" step="0.01" id="i_hurdle" value="${inv.returnModel.hurdleRate?(inv.returnModel.hurdleRate*100).toFixed(2):''}"></div>
      <div class="field"></div>
      <div class="field"><label>Prazo mínimo (meses)</label><input type="number" id="i_prazoMin" value="${inv.returnModel.prazoMinimo!==null&&inv.returnModel.prazoMinimo!==undefined?inv.returnModel.prazoMinimo:''}"></div>
      <div class="field"><label>Prazo máximo (meses)</label><input type="number" id="i_prazoMax" value="${inv.returnModel.prazoMaximo!==null&&inv.returnModel.prazoMaximo!==undefined?inv.returnModel.prazoMaximo:''}"></div>
      <div class="field"><label>Penalização saída antecipada (%)</label><input type="number" step="0.01" id="i_penalizacao" value="${inv.returnModel.penalizacaoSaidaAntecipada?(inv.returnModel.penalizacaoSaidaAntecipada*100).toFixed(2):''}"></div>
      <div class="field"><label>Prémio por permanência (%)</label><input type="number" step="0.01" id="i_premio" value="${inv.returnModel.premioPermanencia?(inv.returnModel.premioPermanencia*100).toFixed(2):''}"></div>
    </div>
    <div class="methodology">Prazo mínimo/máximo ajustam automaticamente a data de saída efetiva usada no cálculo. Se a saída for antecipada em relação ao prazo mínimo, aplica-se a penalização; se ultrapassar o prazo máximo definido como limiar, aplica-se o prémio por permanência. Hurdle rate substitui a taxa configurada quando for mais exigente.</div>
    <div class="field" style="margin-top:10px;"><label>Observações</label><textarea id="i_obs" rows="2">${Util.escapeHtml(inv.observacoes)}</textarea></div>
    <div class="modal-foot"><button class="tb-btn" id="btnCancel">Cancelar</button><button class="tb-btn primary" id="btnSave">Guardar</button></div>
  `, (modalEl)=>{
    const cWrap = modalEl.querySelector('#contribRows');
    function paintContrib(){
      cWrap.innerHTML = inv.contributions.map((c,i)=>`
        <div class="grid cols-3" style="margin-bottom:6px;">
          <select class="cc-tipo" data-i="${i}">${tiposContrib.map(t=>`<option value="${t}" ${c.tipo===t?'selected':''}>${t.replace('_',' ')}</option>`).join('')}</select>
          <input type="number" step="0.01" class="cc-valor" data-i="${i}" value="${c.valor}" placeholder="Valor (€)">
          <div style="display:flex;gap:6px;"><input type="date" class="cc-data" data-i="${i}" value="${c.data}"><button class="icon-btn danger" data-i="${i}" id="rmContrib">✕</button></div>
        </div>`).join('');
      cWrap.querySelectorAll('.cc-tipo').forEach(el=>el.onchange=()=>inv.contributions[+el.dataset.i].tipo=el.value);
      cWrap.querySelectorAll('.cc-valor').forEach(el=>el.onchange=()=>inv.contributions[+el.dataset.i].valor=+el.value);
      cWrap.querySelectorAll('.cc-data').forEach(el=>el.onchange=()=>inv.contributions[+el.dataset.i].data=el.value);
      cWrap.querySelectorAll('#rmContrib').forEach(btn=>btn.onclick=()=>{ inv.contributions.splice(+btn.dataset.i,1); paintContrib(); });
    }
    modalEl.querySelector('#addContrib').onclick = ()=>{ inv.contributions.push({id:Util.uid(),tipo:'capital_social',valor:0,data:inv.dataEntrada}); paintContrib(); };
    paintContrib();

    const catNecEl = modalEl.querySelector('#i_categoriaNecessidade'), diasNecEl = modalEl.querySelector('#i_diasNecessidade');
    function updateDataNecessidadePreview(){
      const previewInv = {...inv, categoriaNecessidade: catNecEl.value||null, diasNecessidade: +diasNecEl.value||0};
      const dn = Store.active() ? computeDataNecessidade(Store.active(), previewInv) : null;
      modalEl.querySelector('#i_dataNecessidadePreview').textContent = dn ? Util.fmtDate(dn) : (catNecEl.value ? 'sem rubricas nessa categoria' : '—');
    }
    catNecEl.onchange = updateDataNecessidadePreview;
    diasNecEl.oninput = updateDataNecessidadePreview;
    updateDataNecessidadePreview();

    function renderRetornoParams(){
      const tipo = modalEl.querySelector('#i_tipoRetorno').value;
      const area = modalEl.querySelector('#retornoParamsArea');
      if(tipo==='fixo'){
        area.innerHTML = `<div class="field"><label>Retorno total sobre o capital (%)</label><input type="number" step="0.01" id="rp_perc" value="${((inv.returnModel.percentagem||0)*100).toFixed(2)}"></div>
        <div class="methodology">Exemplo: capital investido × (1 + retorno) é devolvido integralmente na data de saída.</div>`;
      } else if(tipo==='anual'){
        area.innerHTML = `<div class="field"><label>Retorno anual (%)</label><input type="number" step="0.01" id="rp_anual" value="${((inv.returnModel.percentagemAnual||0)*100).toFixed(2)}"></div>`;
      } else if(tipo==='mensal'){
        area.innerHTML = `<div class="field"><label>Retorno mensal (%)</label><input type="number" step="0.01" id="rp_mensal" value="${((inv.returnModel.percentagemMensal||0)*100).toFixed(2)}"></div>`;
      } else if(tipo==='percentual_lucro' || tipo==='capital_mais_lucro'){
        area.innerHTML = `<div class="field"><label>% do lucro do projeto atribuído</label><input type="number" step="0.01" id="rp_lucro" value="${((inv.returnModel.percentagemLucro||0)*100).toFixed(2)}"></div>
        <div class="methodology">Aplicado ao resultado do projeto antes da participação deste investidor (evita circularidade). Devolução do capital investido é sempre incluída.</div>`;
      } else if(tipo==='manual'){
        area.innerHTML = `<div class="section-sub">Eventos manuais</div><div id="evRows"></div><button class="icon-btn" id="addEv">+ Adicionar evento</button>`;
        const evWrap = area.querySelector('#evRows');
        const evTipos = ['devolucao_capital_social','devolucao_suprimentos','devolucao_prestacoes','remuneracao','participacao_lucro'];
        function paintEv(){
          evWrap.innerHTML = (inv.returnModel.eventos||[]).map((ev,i)=>`
            <div class="grid cols-3" style="margin-bottom:6px;">
              <select class="ev-tipo" data-i="${i}">${evTipos.map(t=>`<option value="${t}" ${ev.tipo===t?'selected':''}>${t.replace(/_/g,' ')}</option>`).join('')}</select>
              <input type="number" step="0.01" class="ev-valor" data-i="${i}" value="${ev.valor}" placeholder="Valor (€)">
              <div style="display:flex;gap:6px;"><input type="date" class="ev-data" data-i="${i}" value="${ev.data}"><button class="icon-btn danger" data-i="${i}" id="rmEv">✕</button></div>
            </div>`).join('');
          evWrap.querySelectorAll('.ev-tipo').forEach(el=>el.onchange=()=>inv.returnModel.eventos[+el.dataset.i].tipo=el.value);
          evWrap.querySelectorAll('.ev-valor').forEach(el=>el.onchange=()=>inv.returnModel.eventos[+el.dataset.i].valor=+el.value);
          evWrap.querySelectorAll('.ev-data').forEach(el=>el.onchange=()=>inv.returnModel.eventos[+el.dataset.i].data=el.value);
          evWrap.querySelectorAll('#rmEv').forEach(btn=>btn.onclick=()=>{ inv.returnModel.eventos.splice(+btn.dataset.i,1); paintEv(); });
        }
        area.querySelector('#addEv').onclick = ()=>{ inv.returnModel.eventos.push({data:inv.dataEntrada,tipo:'remuneracao',valor:0}); paintEv(); };
        paintEv();
      }
    }
    modalEl.querySelector('#i_tipoRetorno').onchange = renderRetornoParams;
    renderRetornoParams();

    modalEl.closest('.modal-backdrop').querySelector('#btnCancel').onclick = closeModals;
    modalEl.closest('.modal-backdrop').querySelector('#btnSave').onclick = ()=>{
      inv.nome = modalEl.querySelector('#i_nome').value;
      inv.referencia = modalEl.querySelector('#i_ref').value;
      inv.dataEntrada = modalEl.querySelector('#i_dataEntrada').value;
      inv.dataSaidaPrevista = modalEl.querySelector('#i_dataSaida').value||'';
      inv.categoriaNecessidade = modalEl.querySelector('#i_categoriaNecessidade').value||null;
      inv.diasNecessidade = +modalEl.querySelector('#i_diasNecessidade').value||0;
      const tipo = modalEl.querySelector('#i_tipoRetorno').value;
      inv.returnModel.tipo = tipo;
      if(tipo==='fixo') inv.returnModel.percentagem = (+modalEl.querySelector('#rp_perc').value||0)/100;
      if(tipo==='anual') inv.returnModel.percentagemAnual = (+modalEl.querySelector('#rp_anual').value||0)/100;
      if(tipo==='mensal') inv.returnModel.percentagemMensal = (+modalEl.querySelector('#rp_mensal').value||0)/100;
      if(tipo==='percentual_lucro'||tipo==='capital_mais_lucro') inv.returnModel.percentagemLucro = (+modalEl.querySelector('#rp_lucro').value||0)/100;
      inv.returnModel.retornoMinimo = modalEl.querySelector('#i_retMin').value!=='' ? +modalEl.querySelector('#i_retMin').value : null;
      inv.returnModel.retornoMaximo = modalEl.querySelector('#i_retMax').value!=='' ? +modalEl.querySelector('#i_retMax').value : null;
      inv.returnModel.hurdleRate = modalEl.querySelector('#i_hurdle').value!=='' ? (+modalEl.querySelector('#i_hurdle').value)/100 : null;
      inv.returnModel.prazoMinimo = modalEl.querySelector('#i_prazoMin').value!=='' ? +modalEl.querySelector('#i_prazoMin').value : null;
      inv.returnModel.prazoMaximo = modalEl.querySelector('#i_prazoMax').value!=='' ? +modalEl.querySelector('#i_prazoMax').value : null;
      inv.returnModel.penalizacaoSaidaAntecipada = modalEl.querySelector('#i_penalizacao').value!=='' ? (+modalEl.querySelector('#i_penalizacao').value)/100 : null;
      inv.returnModel.premioPermanencia = modalEl.querySelector('#i_premio').value!=='' ? (+modalEl.querySelector('#i_premio').value)/100 : null;
      inv.observacoes = modalEl.querySelector('#i_obs').value;
      onSave(inv);
      closeModals();
    };
  });
}

const CF_ENTRADA_LABELS = {
  capitalSocial:'Capital social (investidores/promotor)', suprimentos:'Suprimentos (investidores/promotor)',
  prestacoes:'Prestações acessórias', creditoBancario:'Crédito bancário (utilizações)',
  cpcv:'Sinais de CPCV (vendas)', pagamentosIntermedios:'Pagamentos intermédios (vendas)',
  escrituras:'Escrituras (vendas)', outrosProveitos:'Outros proveitos'
};
const CF_SAIDA_LABELS = {
  jurosFinanciamento:'Juros de financiamento',
  comissoesFinanciamento:'Comissões de financiamento', amortizacaoDivida:'Amortização de dívida',
  devolucaoCapitalSocial:'Devolução de capital social', devolucaoSuprimentos:'Devolução de suprimentos',
  devolucaoPrestacoes:'Devolução de prestações acessórias', remuneracaoInvestidores:'Remuneração de investidores',
  participacaoLucroInvestidores:'Participação nos lucros (investidores)', tributacao:'Tributação (IRC)',
  distribuicaoPromotor:'Distribuição final ao promotor (residual do projeto, se positivo)'
};
// Entradas de dinheiro discriminadas pela sua origem real — capital social, suprimentos
// e prestações por investidor; CPCV, pagamentos intermédios e escrituras por fase da casa —
// com a data EXATA de cada movimento (não reconstituída a partir do índice do mês, que só
// tem granularidade mensal e por isso "arredondava" sempre ao dia 1 do mês).
const GRANULAR_ENTRADA_KEYS = ['capitalSocial','suprimentos','prestacoes','cpcv','pagamentosIntermedios','escrituras'];
const TIPO_CONTRIB_LABELS = {capital_social:'Capital social', suprimentos:'Suprimentos', prestacoes:'Prestações acessórias'};
// Saídas para investidores (devoluções/remuneração/participação) são discriminadas por
// investidor via cf.led.investorEventos, em vez de agregadas por categoria — por isso ficam
// de fora da agregação genérica por categoria (tal como GRANULAR_ENTRADA_KEYS para entradas).
const GRANULAR_SAIDA_KEYS = ['devolucaoCapitalSocial','devolucaoSuprimentos','devolucaoPrestacoes','remuneracaoInvestidores','participacaoLucroInvestidores'];
const INVESTOR_EVENT_LABELS = {
  devolucao_capital_social:'Devolução de capital social', devolucao_suprimentos:'Devolução de suprimentos',
  devolucao_prestacoes:'Devolução de prestações acessórias', remuneracao:'Remuneração de investidores',
  participacao_lucro:'Participação nos lucros (investidores)'
};
function buildGranularEntradas(p){
  const out = [];
  (p.investors||[]).forEach(inv=>{
    (inv.contributions||[]).forEach(c=>{
      const dataEfetiva = investorEffectiveContribDate(p, inv, c.data);
      if(!dataEfetiva || !(c.valor)) return;
      out.push({data:dataEfetiva, tipo:'entrada', v:c.valor||0, label:`${TIPO_CONTRIB_LABELS[c.tipo]||c.tipo} - ${inv.nome}`});
    });
  });
  (p.houses||[]).forEach(h=>{
    const fase = (p.phases||[]).find(f=>f.id===h.faseId);
    const faseNome = fase ? fase.nome : 'Sem fase';
    (h.pagamentos||[]).forEach(pay=>{
      const dataRef = pay.dataEfetiva||pay.dataPrevista;
      if(!dataRef) return;
      const valor = (pay.valor!==undefined&&pay.valor!==null)?pay.valor:(pay.percentagem||0)*(h.precoVendaEfetivo||h.precoVendaPrevisto||0);
      if(!valor) return;
      const nomeLower = (pay.nome||'').toLowerCase();
      const tipoLabel = nomeLower.includes('cpcv') ? 'CPCV' : nomeLower.includes('escrit') ? 'Escritura' : 'Pagamento intermédio';
      out.push({data:dataRef, tipo:'entrada', v:valor, label:`${tipoLabel} - ${faseNome}`});
    });
  });
  return out;
}
// Devolve os movimentos (entradas/saídas discriminadas) de um mês do cash-flow —
// usado tanto no detalhe expansível da vista "Geral" como na vista "Flow necessidades".
// Capital social/suprimentos/prestações e CPCV/pagamentos intermédios/escrituras vêm
// discriminados por investidor/fase (buildGranularEntradas); as restantes entradas e
// todas as saídas continuam agregadas por categoria, como antes.
function cfMonthMovements(p, cf, i){
  const entGranular = buildGranularEntradas(p)
    .filter(x=> Util.clamp(Util.monthIndex(x.data, cf.start),0,cf.monthCount-1)===i)
    .filter(x=>Math.abs(x.v)>0.005);
  const entAgregado = Object.keys(CF_ENTRADA_LABELS).filter(k=>!GRANULAR_ENTRADA_KEYS.includes(k)).map(k=>{
    const arr = cf.led[k];
    return {label:CF_ENTRADA_LABELS[k], v:(arr&&arr[i])||0, tipo:'entrada'};
  }).filter(x=>Math.abs(x.v)>0.005);
  const custosDetail = Object.values(cf.led.custosPorCategoriaSub||{}).map(x=>({
    label:'Custo — '+x.categoria+(x.subcategoria?' / '+x.subcategoria:''), v:(x.arr&&x.arr[i])||0, tipo:'saida'
  })).filter(x=>Math.abs(x.v)>0.005);
  const saiInvestidores = (cf.led.investorEventos||[]).filter(x=>x.mes===i).map(x=>({
    label:`${INVESTOR_EVENT_LABELS[x.tipo]||x.tipo} - ${x.invNome}`, v:x.valor, tipo:'saida'
  })).filter(x=>Math.abs(x.v)>0.005);
  const outrasSaidas = Object.keys(CF_SAIDA_LABELS).filter(k=>!GRANULAR_SAIDA_KEYS.includes(k)).map(k=>{
    const arr = k==='distribuicaoPromotor' ? cf.led.distribuicaoPromotor : cf.led[k];
    return {label:CF_SAIDA_LABELS[k], v:(arr&&arr[i])||0, tipo:'saida'};
  }).filter(x=>Math.abs(x.v)>0.005);
  return [...entGranular, ...entAgregado, ...custosDetail, ...saiInvestidores, ...outrasSaidas];
}

    <div class="kpi"><div class="k-label">Duração modelada${kpiInfo('Número de meses simulados no cash-flow, do primeiro ao último mês com algum movimento de entrada ou saída de dinheiro.')}</div><div class="k-value">${cf.monthCount} meses</div></div>

function viewCashflow(p, cf){
  if((UI.cashflowSubView||'geral')==='necessidades') return viewCashflowNecessidades(p, cf);
  const labels = Array.from({length:cf.monthCount},(_,i)=>Util.monthLabel(cf.start,i));
  function detailRows(i){
    const mv = cfMonthMovements(p, cf, i);
    const ent = mv.filter(x=>x.tipo==='entrada');
    const sai = mv.filter(x=>x.tipo==='saida');
    return `<div class="grid cols-2" style="gap:14px;">
      <div><div class="section-sub">Origem das entradas</div>${ent.length?ent.map(x=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px;"><span>${Util.escapeHtml(x.label)}</span><span class="mono">${Util.fmtMoney0(x.v)}</span></div>`).join(''):'<div class="empty">Sem entradas este mês.</div>'}</div>
      <div><div class="section-sub">Destino das saídas (custos discriminados por categoria)</div>${sai.length?sai.map(x=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:12.5px;"><span>${Util.escapeHtml(x.label)}</span><span class="mono">${Util.fmtMoney0(x.v)}</span></div>`).join(''):'<div class="empty">Sem saídas este mês.</div>'}</div>

  const rows = labels.map((lab,i)=>`
    <tr class="cf-row" data-mi="${i}" style="cursor:pointer;">

      <td class="num mono">${Util.fmtMoney0(cf.entradas[i])}</td>
      <td class="num mono">${Util.fmtMoney0(cf.saidas[i])}</td>
      <td class="num mono ${cf.cfLiquido[i]<0?'':''}" style="${cf.cfLiquido[i]<0?'color:var(--neg)':''}">${Util.fmtMoney0(cf.cfLiquido[i])}</td>
      <td class="num mono" style="${cf.cfAcumulado[i]<0?'color:var(--neg);font-weight:600':''}">${Util.fmtMoney0(cf.cfAcumulado[i])}</td>
    </tr>
    <tr class="cf-detail-row" data-mi-detail="${i}" style="display:none;"><td colspan="5" style="background:var(--surface-alt);">${detailRows(i)}</td></tr>`).join('');
  return `
  <div class="view-head"><div><h2>Cash-Flow Mensal</h2><p>Linha temporal completa do projeto, do primeiro ao último mês com movimento, apenas com o que foi introduzido (custos, vendas, financiamento, investidores) — o saldo pode ficar negativo se o projeto estiver, nesse momento, por financiar. No final, se sobrar saldo positivo, é distribuído ao promotor. Clica numa linha da tabela para ver o detalhe do mês. Cenário: <strong>${Store.getScenario()}</strong>. Cálculo pelo ${UI.custoBasis==='custo'?'valor de custo (construção/compra)':'valor de venda'} das rubricas de custos.</p></div></div>
  ${cashflowSubTabs()}
  ${kpisCashflowBlock(cf)}
  <div class="card"><h3>Cash-flow mensal e acumulado</h3><div class="chart-box"><canvas id="chartCF"></canvas></div></div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th>Mês</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">CF líquido</th><th class="num">CF acumulado</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

// VISTA: "Flow necessidades" — livro-razão cronológico, uma linha por movimento
// (entrada OU saída), com saldo acumulado linha a linha (estilo folha de cálculo).
function viewCashflowNecessidades(p, cf){
  const linhas = [];
  // Entradas discriminadas por investidor/fase, com a data exata de cada movimento.
  buildGranularEntradas(p).forEach(x=> linhas.push(x));
  // Restantes entradas (crédito bancário, outros proveitos), saídas para investidores
  // (discriminadas por investidor) e custos (discriminados por categoria/subcategoria) e
  // demais saídas, por mês (sem granularidade diária — a fonte destes valores só tem
  // granularidade mensal).
  for(let i=0;i<cf.monthCount;i++){
    const dt = Util.addMonths(cf.start, i);
    Object.keys(CF_ENTRADA_LABELS).filter(k=>!GRANULAR_ENTRADA_KEYS.includes(k)).forEach(k=>{
      const v = (cf.led[k]&&cf.led[k][i])||0;
      if(Math.abs(v)>0.005) linhas.push({data:dt, tipo:'entrada', v, label:CF_ENTRADA_LABELS[k]});
    });
    Object.values(cf.led.custosPorCategoriaSub||{}).forEach(x=>{
      const v = (x.arr&&x.arr[i])||0;
      if(Math.abs(v)>0.005) linhas.push({data:dt, tipo:'saida', v, label:'Custo — '+x.categoria+(x.subcategoria?' / '+x.subcategoria:'')});
    });
    (cf.led.investorEventos||[]).filter(x=>x.mes===i).forEach(x=>{
      if(Math.abs(x.valor)>0.005) linhas.push({data:dt, tipo:'saida', v:x.valor, label:`${INVESTOR_EVENT_LABELS[x.tipo]||x.tipo} - ${x.invNome}`});
    });
    Object.keys(CF_SAIDA_LABELS).filter(k=>!GRANULAR_SAIDA_KEYS.includes(k)).forEach(k=>{
      const arr = k==='distribuicaoPromotor' ? cf.led.distribuicaoPromotor : cf.led[k];
      const v = (arr&&arr[i])||0;
      if(Math.abs(v)>0.005) linhas.push({data:dt, tipo:'saida', v, label:CF_SAIDA_LABELS[k]});
    });
  }
  linhas.sort((a,b)=> a.data<b.data?-1:(a.data>b.data?1:0));
  // marca a última linha de cada mês (para destacar visualmente a fronteira entre meses)
  const mesKey = iso => (iso||'').slice(0,7);
  linhas.forEach((r,idx)=>{ r.fimDoMes = (idx===linhas.length-1) || (mesKey(linhas[idx+1].data) !== mesKey(r.data)); });
  let saldo = 0;
  const rowsHtml = linhas.map(r=>{
    saldo += (r.tipo==='entrada' ? r.v : -r.v);
    return `<tr class="${r.fimDoMes?'cf-mes-fim':''}">
      <td class="mono">${Util.fmtDate(r.data)}</td>
      <td class="num mono" style="color:var(--neg)">${r.tipo==='saida'?Util.fmtMoney0(r.v):''}</td>
      <td class="num mono" style="color:var(--accent-ink)">${r.tipo==='entrada'?Util.fmtMoney0(r.v):''}</td>
      <td>${Util.escapeHtml(r.label)}</td>
      <td class="num mono" style="${saldo<0?'color:var(--neg);font-weight:600':''}">${Util.fmtMoney0(saldo)}</td>
    </tr>`;
  }).join('');
  return `
  <div class="view-head"><div><h2>Flow necessidades</h2><p>Todos os movimentos de dinheiro do projeto, um por linha, por ordem cronológica — como uma folha de caixa. Saldo acumulado linha a linha. A última linha de cada mês fica destacada para marcar a fronteira entre meses. Cálculo pelo ${UI.custoBasis==='custo'?'valor de custo (construção/compra)':'valor de venda'} das rubricas de custos.</p></div></div>
  ${cashflowSubTabs()}
  ${kpisCashflowBlock(cf)}
  <div class="card"><h3>Cash-flow mensal e acumulado</h3><div class="chart-box"><canvas id="chartCFNecessidades"></canvas></div></div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th>Data</th><th class="num">Saída</th><th class="num">Entrada</th><th>Categoria / Observações</th><th class="num">Saldo</th></tr></thead>
    <tbody>${rowsHtml || '<tr><td colspan="5" class="empty">Sem movimentos registados.</td></tr>'}</tbody>
  </table></div>`;
}

  // próprio, com timing real), não sobre o cash-flow total do projeto — este último inclui
  // dinheiro de investidores e do banco, que não é capital do promotor.
  const irr = MetricsEngine.irrMonthly(cf.promoterCashFlow);
  const rMensalDesc = Math.pow(1+p.assumptions.taxaDescontoAnual,1/12)-1;
  const val = MetricsEngine.npv(cf.promoterCashFlow, rMensalDesc);
  const roi = cf.custosEconomicosTotais>0 ? cf.resultadoLiquido/cf.custosEconomicosTotais : null;
  const roe = cf.capitalProprioPromotorTotal>0 ? cf.resultadoAtribuivelPromotor/cf.capitalProprioPromotorTotal : null;
  const moic = cf.capitalProprioPromotorTotal>0 ? cf.promoterFinalDistribution/cf.capitalProprioPromotorTotal : null;

  const catLabels = Object.keys(cf.led.custosPorCategoria);
  const catTotals = catLabels.map(k=>Util.sum(cf.led.custosPorCategoria[k]));

  return `

    <div class="kpi"><div class="k-label">Receitas totais${kpiInfo('Total de dinheiro recebido pelo projeto — vendas de casas mais qualquer outra entrada modelada. É a base para calcular o resultado do projeto.')}</div><div class="k-value">${Util.fmtMoney0(cf.receitasTotais)}</div></div>
    <div class="kpi clickable" id="kpiCustos"><div class="k-label">Custos totais (económico)${kpiInfo('Soma de todos os custos (Custos construção + Custos outros) em base económica, ou seja, excluindo o IVA que é dedutível (que não é um custo real do projeto).')}</div><div class="k-value">${Util.fmtMoney0(cf.custosEconomicosTotais)}</div></div>
    <div class="kpi"><div class="k-label">Resultado antes de impostos${kpiInfo('Receitas totais menos custos totais (económico), antes de aplicar a taxa de tributação. Fórmula: Receitas totais − Custos totais.')}</div><div class="k-value">${Util.fmtMoney0(cf.resultadoFinalAntesImpostos)}</div></div>
    <div class="kpi"><div class="k-label">Tributação estimada${kpiInfo('Imposto estimado sobre o resultado antes de impostos, à taxa de tributação definida nos pressupostos do projeto. Fórmula: Resultado antes de impostos × taxa de tributação.')}</div><div class="k-value">${Util.fmtMoney0(cf.tributacaoTotal)}</div></div>

    <div class="kpi"><div class="k-label">Capital de investidores${kpiInfo('Soma de todas as contribuições de capital de investidores externos ao projeto.')}</div><div class="k-value">${Util.fmtMoney0(cf.totalCapitalInvestidores)}</div></div>
    <div class="kpi"><div class="k-label">Dívida bancária${kpiInfo('Soma dos montantes utilizados em financiamento bancário (empréstimos) associados ao projeto.')}</div><div class="k-value">${Util.fmtMoney0(cf.totalFinanciamentoBancario)}</div></div>
    <div class="kpi"><div class="k-label">Distribuição final ao promotor${kpiInfo('Valor final entregue ao promotor no fim do projeto: capital próprio devolvido mais o lucro residual, depois de pagos investidores e banco. Fórmula: max(0, saldo acumulado final).')}</div><div class="k-value pos">${Util.fmtMoney0(cf.promoterFinalDistribution)}</div><div class="k-sub">capital devolvido + lucro residual</div></div>
    <div class="kpi"><div class="k-label">ROI${kpiInfo('Retorno sobre o total investido no projeto (todos os custos, não só o capital do promotor). Fórmula: Resultado líquido ÷ Custos totais.')}</div><div class="k-value">${roi!==null?Util.fmtPct(roi):'—'}</div><div class="k-sub">resultado líquido / custos totais</div></div>
    <div class="kpi"><div class="k-label">ROE (promotor)${kpiInfo('Retorno sobre o capital próprio efetivamente investido pelo promotor (não sobre o total do projeto). Fórmula: lucro atribuível ao promotor ÷ capital próprio do promotor.')}</div><div class="k-value">${roe!==null?Util.fmtPct(roe):'—'}</div><div class="k-sub">lucro do promotor / capital próprio investido</div></div>
    <div class="kpi"><div class="k-label">TIR do promotor (anualizada)${kpiInfo('Taxa interna de retorno anualizada, calculada sobre o cash-flow próprio do promotor (entradas e saídas do seu capital, com o timing real de cada mês).')}</div><div class="k-value">${irr.value!==null?Util.fmtPct(MetricsEngine.annualize(irr.value)):'—'}</div>${irr.warning?`<div class="k-sub" style="color:var(--gold)">${irr.warning}</div>`:''}</div>
    <div class="kpi"><div class="k-label">VAL (capital próprio do promotor)${kpiInfo('Valor atual líquido do cash-flow do promotor, descontado à taxa mensal equivalente à taxa de desconto anual definida nos pressupostos. Positivo indica que o projeto cria valor acima dessa taxa exigida.')}</div><div class="k-value">${Util.fmtMoney0(val)}</div><div class="k-sub">taxa mensal ${Util.fmtPct(rMensalDesc,3)}</div></div>
    <div class="kpi"><div class="k-label">Múltiplo sobre capital (MOIC)${kpiInfo('Quantas vezes o capital próprio investido pelo promotor é devolvido no total. Fórmula: distribuição final ao promotor ÷ capital próprio investido.')}</div><div class="k-value">${moic!==null?Util.fmtNum(moic,2)+'x':'—'}</div></div>
    <div class="kpi"><div class="k-label">Duração do projeto${kpiInfo('Número de meses simulados no cash-flow do projeto.')}</div><div class="k-value">${cf.monthCount} meses</div></div>
  </div>
  <div class="grid cols-2">
    <div class="card"><h3>Receitas vs Custos</h3><div class="chart-box"><canvas id="chartRC"></canvas></div></div>
    <div class="card"><h3>Custos por categoria</h3><div class="chart-box"><canvas id="chartCat"></canvas></div></div>
  </div>
  <div class="card"><h3>Resultado por fase</h3>
    <div class="tbl-wrap"><table class="data"><thead><tr><th>Fase</th><th class="num">Nº casas</th><th class="num">Receitas (vendas atribuídas)</th></tr></thead>
    <tbody>${p.phases.map(f=>{
      const casas = p.houses.filter(h=>h.faseId===f.id);
      const rec = Util.sum(casas, h=>h.precoVendaEfetivo||h.precoVendaPrevisto||0);
      return `<tr><td>${Util.escapeHtml(f.nome)}</td><td class="num">${casas.length}</td><td class="num mono">${Util.fmtMoney0(rec)}</td></tr>`;
    }).join('')}</tbody></table></div>
  </div>
  <div class="methodology">
    <strong>Metodologia:</strong> o capital próprio do promotor é calculado mês a mês como o residual necessário para o saldo de caixa do projeto nunca ficar negativo, depois de contabilizadas as entradas já configuradas de investidores e financiamento bancário — não é um valor fixo, reflete o timing real. O saldo acumulado no final do projeto (após pagas todas as obrigações a investidores, banco e fisco) é distribuído integralmente ao promotor. ROI = resultado líquido ÷ custos económicos totais. ROE = lucro atribuível ao promotor ÷ capital próprio investido pelo promotor. TIR calculada por Newton-Raphson sobre os cash-flows mensais reais do capital próprio do promotor (injeções negativas + distribuição final positiva), anualizada por (1+TIR mensal)^12−1. VAL descontado à mesma série, à taxa mensal equivalente da taxa de desconto anual. MOIC = distribuição final ÷ capital próprio investido. Esta abordagem assume que o promotor apenas levanta caixa no final do projeto; não constitui aconselhamento financeiro.
  </div>
  <div id="drilldownArea"></div>`;
}

/* =========================================================================
   VIEW: ANÁLISE INVESTIDOR
   ========================================================================= */
function viewInvestidor(p, cf){
  if(p.investors.length===0){
    return `<div class="view-head"><div><h2>Análise do Investidor</h2></div></div><div class="empty"><h3>Sem investidores</h3><p>Adicione investidores no separador "Investidores" para ver a sua análise individual.</p></div>`;
  }
  if(!UI.activeInvestorId || !p.investors.find(i=>i.id===UI.activeInvestorId)) UI.activeInvestorId = p.investors[0].id;
  const inv = p.investors.find(i=>i.id===UI.activeInvestorId);
  const contrib = cf.investorContribBreakdown.find(x=>x.id===inv.id)||{total:0};
  const dist = cf.investorDistBreakdown.find(x=>x.id===inv.id)||{capitalDevolvido:0,remuneracao:0};
  const totalRecebido = dist.capitalDevolvido+dist.remuneracao;
  const lucro = totalRecebido - contrib.total;

  const cfInv = new Array(cf.monthCount).fill(0);
  (inv.contributions||[]).forEach(c=>{
    const dataEfetiva = investorEffectiveContribDate(p, inv, c.data);
    const idx = Util.clamp(Util.monthIndex(dataEfetiva, cf.start),0,cf.monthCount-1);
    cfInv[idx]-= c.valor||0;
  });
  const exitIdx = inv.dataSaidaPrevista ? Util.clamp(Util.monthIndex(inv.dataSaidaPrevista, cf.start),0,cf.monthCount-1) : cf.monthCount-1;
  cfInv[exitIdx]+= totalRecebido;
  const irr = MetricsEngine.irrMonthly(cfInv);
  const rMensalDesc = Math.pow(1+p.assumptions.taxaDescontoAnual,1/12)-1;
  const val = MetricsEngine.npv(cfInv, rMensalDesc);
  const entradaIdx = Util.clamp(Util.monthIndex(inv.dataEntrada, cf.start),0,cf.monthCount-1);
  const anos = Math.max(1/12,(exitIdx-entradaIdx)/12);
  const rentAnualizada = contrib.total>0 ? Math.pow(totalRecebido/contrib.total, 1/anos)-1 : null;

  const cumulative = []; let run=0;
  cfInv.forEach(v=>{ run+=v; cumulative.push(run); });

  return `
  <div class="view-head"><div><h2>Análise do Investidor</h2><p>Selecione o investidor para ver o detalhe individual.</p></div>
    <select id="investorSelect">${p.investors.map(i=>`<option value="${i.id}" ${i.id===inv.id?'selected':''}>${Util.escapeHtml(i.nome)}</option>`).join('')}</select>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="k-label">Capital comprometido/investido${kpiInfo('Soma de todas as entradas de capital deste investidor no projeto (as suas contribuições registadas).')}</div><div class="k-value">${Util.fmtMoney0(contrib.total)}</div></div>
    <div class="kpi"><div class="k-label">Capital devolvido (previsto)${kpiInfo('Parte do total a receber que corresponde à devolução do capital originalmente investido (sem a remuneração/lucro).')}</div><div class="k-value">${Util.fmtMoney0(dist.capitalDevolvido)}</div></div>
    <div class="kpi"><div class="k-label">Remuneração/participação (prevista)${kpiInfo('Retorno/remuneração previsto para este investidor, calculado de acordo com o modelo de retorno definido (fixo, percentagem anual, participação no lucro, etc.).')}</div><div class="k-value">${Util.fmtMoney0(dist.remuneracao)}</div></div>
    <div class="kpi"><div class="k-label">Total previsto a receber${kpiInfo('Soma do capital devolvido com a remuneração/participação prevista. Fórmula: Capital devolvido + Remuneração.')}</div><div class="k-value pos">${Util.fmtMoney0(totalRecebido)}</div></div>
    <div class="kpi"><div class="k-label">Lucro${kpiInfo('Ganho líquido do investidor. Fórmula: Total previsto a receber − Capital investido.')}</div><div class="k-value ${lucro<0?'neg':'pos'}">${Util.fmtMoney0(lucro)}</div></div>
    <div class="kpi"><div class="k-label">Rentabilidade total${kpiInfo('Lucro em percentagem do capital investido, sem considerar o tempo de permanência do investimento. Fórmula: Lucro ÷ Capital investido.')}</div><div class="k-value">${contrib.total>0?Util.fmtPct(lucro/contrib.total):'—'}</div></div>
    <div class="kpi"><div class="k-label">Rentabilidade anualizada${kpiInfo('Rentabilidade total normalizada para uma base anual, tendo em conta o número de anos entre a entrada e a saída prevista. Fórmula: (Total a receber ÷ Capital investido)^(1/anos) − 1.')}</div><div class="k-value">${rentAnualizada!==null?Util.fmtPct(rentAnualizada):'—'}</div></div>
    <div class="kpi"><div class="k-label">MOIC${kpiInfo('Múltiplo sobre o capital investido — quantas vezes o investidor recebe de volta o que investiu. Fórmula: Total previsto a receber ÷ Capital investido.')}</div><div class="k-value">${contrib.total>0?Util.fmtNum(totalRecebido/contrib.total,2)+'x':'—'}</div></div>
    <div class="kpi"><div class="k-label">TIR anualizada${kpiInfo('Taxa interna de retorno anualizada, calculada sobre o cash-flow próprio deste investidor (entradas negativas nas contribuições, entrada positiva na saída), com o timing real de cada mês.')}</div><div class="k-value">${irr.value!==null?Util.fmtPct(MetricsEngine.annualize(irr.value)):'—'}</div></div>
    <div class="kpi"><div class="k-label">VAL do investimento${kpiInfo('Valor atual líquido do cash-flow deste investidor, descontado à taxa mensal equivalente à taxa de desconto anual dos pressupostos do projeto.')}</div><div class="k-value">${Util.fmtMoney0(val)}</div></div>
    <div class="kpi"><div class="k-label">Data prevista de saída${kpiInfo('Data em que este investidor deverá receber o capital devolvido e a remuneração, definida na ficha do investidor.')}</div><div class="k-value" style="font-size:16px;">${Util.fmtDate(inv.dataSaidaPrevista)}</div></div>
  </div>
  <div class="card"><h3>Evolução: investimento → recebimentos → saída</h3><div class="chart-box"><canvas id="chartInvestor"></canvas></div></div>
  <div class="methodology">Rentabilidade total ≠ rentabilidade anualizada: a primeira mede o ganho sobre todo o período; a segunda normaliza para uma base anual usando o número de anos de permanência do capital.</div>`;
}

    </div>
    <p class="methodology" style="margin-top:10px;">A pessoa só consegue criar conta depois de o email estar aqui. Ao adicionar, ainda não tem acesso a nenhuma aba nem projeto — configure abaixo.</p>

async function loadContasList(){
  const area = document.getElementById('contasListArea');
  if(!area) return;
  const [{ data: emails, error: errE }, { data: access, error: errA }] = await Promise.all([
    supaClient.from('promo_allowed_emails').select('email,is_admin,allowed_views').order('email'),
    supaClient.from('promo_project_access').select('project_id,email,can_edit')
  ]);
  if(errE){ area.innerHTML = '<div class="empty">Erro ao carregar: '+Util.escapeHtml(errE.message)+'</div>'; return; }
  const projects = Object.values(Store.all());
  const rows = (emails||[]).map(em=>{
    if(em.is_admin){
      return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;"><b>${Util.escapeHtml(em.email)}</b><span class="tag ok">Administrador</span></div></div>`;
    }
    const allowed = em.allowed_views||[];
    const tabsHtml = NAV.map(n=>`<label class="inline"><input type="checkbox" class="viewChk" data-email="${Util.escapeHtml(em.email)}" data-view="${n.id}" ${allowed.includes(n.id)?'checked':''}> ${n.label}</label>`).join('');
    const projRows = projects.map(p=>{
      const acc = (access||[]).find(a=>a.project_id===p.id && a.email===em.email);
      const val = acc ? (acc.can_edit?'edit':'view') : 'none';
      return `<tr><td>${Util.escapeHtml(p.meta.nome)}</td><td>
        <select class="projAccessSel" data-email="${Util.escapeHtml(em.email)}" data-project="${Util.escapeHtml(p.id)}">
          <option value="none" ${val==='none'?'selected':''}>Sem acesso</option>
          <option value="view" ${val==='view'?'selected':''}>Só ver</option>
          <option value="edit" ${val==='edit'?'selected':''}>Ver e editar</option>
        </select>
      </td></tr>`;
    }).join('');
    return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${Util.escapeHtml(em.email)}</b>
        <button class="icon-btn danger removeEmailBtn" data-email="${Util.escapeHtml(em.email)}">Remover acesso</button>
      </div>
      <div class="section-sub">Abas com acesso</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;">${tabsHtml}</div>
      <div class="section-sub">Acesso a projetos</div>
      <div class="tbl-wrap"><table class="data"><tbody>${projRows||'<tr><td class="empty">Sem projetos criados ainda.</td></tr>'}</tbody></table></div>
    </div>`;
  }).join('');
  area.innerHTML = rows || '<div class="empty">Nenhum email autorizado além do administrador.</div>';

  area.querySelectorAll('.viewChk').forEach(cb=> cb.onchange = async ()=>{
    const email = cb.dataset.email;
    const checked = area.querySelectorAll('.viewChk[data-email="'+CSS.escape(email)+'"]:checked');
    const views = Array.from(checked).map(x=>x.dataset.view);
    const { error } = await supaClient.from('promo_allowed_emails').update({ allowed_views: views }).eq('email', email);
    toast(error ? 'Erro ao gravar: '+error.message : 'Acesso a abas atualizado.', !!error);
  });
  area.querySelectorAll('.projAccessSel').forEach(sel=> sel.onchange = async ()=>{
    const email = sel.dataset.email, projectId = sel.dataset.project, val = sel.value;
    let error;
    if(val==='none'){
      ({ error } = await supaClient.from('promo_project_access').delete().eq('project_id', projectId).eq('email', email));
    } else {
      ({ error } = await supaClient.from('promo_project_access').upsert({ project_id: projectId, email, can_edit: val==='edit' }));
    }
    toast(error ? 'Erro: '+error.message : 'Acesso ao projeto atualizado.', !!error);
  });
  area.querySelectorAll('.removeEmailBtn').forEach(btn=> btn.onclick = async ()=>{
    const email = btn.dataset.email;
    if(!confirm('Remover o acesso de '+email+'? Deixa de conseguir entrar na aplicação.')) return;
    const { error } = await supaClient.from('promo_allowed_emails').delete().eq('email', email);
    if(error){ toast('Erro: '+error.message, true); return; }
    toast('Email removido.');
    loadContasList();
  });
}

    }
    document.getElementById('btnExportProjectHere').onclick = async ()=>{ const ok = await StorageEngine.exportProject(p); toast(ok?'Projeto exportado.':'Falha ao exportar.', !ok); };
    document.getElementById('btnExportBackupHere').onclick = async ()=>{ const ok = await StorageEngine.exportBackup(); toast(ok?'Backup exportado.':'Falha ao exportar.', !ok); };
    document.getElementById('btnRunChecks').onclick = ()=>{
      const checks = ValidationEngine.runConsistencyChecks(p, cf);
      const failed = checks.filter(c=>!c.ok).length;
      document.getElementById('checksArea').innerHTML = `
        <div class="methodology" style="margin-top:12px;">${failed===0?`Todos os ${checks.length} testes passaram.`:`${failed} de ${checks.length} teste(s) com divergência — ver detalhe abaixo.`}</div>
        <div class="tbl-wrap" style="margin-top:8px;"><table class="data">
          <thead><tr><th>Teste</th><th class="num">Esperado</th><th class="num">Obtido</th><th class="num">Diferença</th><th>Resultado</th></tr></thead>
          <tbody>${checks.map(c=>`<tr><td>${Util.escapeHtml(c.label)}</td><td class="num mono">${Util.fmtMoney0(c.esperado)}</td><td class="num mono">${Util.fmtMoney0(c.obtido)}</td><td class="num mono">${Util.fmtMoney0(c.diff)}</td><td>${c.ok?'<span class="tag ok">OK</span>':'<span class="tag bad">Divergência</span>'}</td></tr>`).join('')}</tbody>
        </table></div>`;
    };
  }
}

/* =========================================================================
   INICIALIZAÇÃO
   ========================================================================= */
document.getElementById('authLoginBtn').onclick = ()=> Auth.signIn(document.getElementById('authEmail').value, document.getElementById('authPass').value);
document.getElementById('authSignupBtn').onclick = ()=> Auth.signUp(document.getElementById('authEmail').value, document.getElementById('authPass').value);
document.getElementById('authPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('authLoginBtn').click(); });

Auth.init(async ()=>{
  const isAdmin = Auth.isAdmin();
  if(isAdmin) Store.load(); // cache local / semente de demonstração só para o administrador
  const remote = await RemoteStore.pullAll();
  if(remote && remote.length){
    const projects = {};
    let migrouAlgum = false;
    remote.forEach(r=>{
      try{
        const before = (r.data&&r.data.costs&&r.data.costs.length)||0;
        projects[r.id] = StorageEngine.migrate(r.data);
        if(before>0 && (projects[r.id].costs||[]).length===0) migrouAlgum = true;
      }catch(e){ console.error('Falha na migração (arranque)', e, r); projects[r.id] = r.data; }
    });
    Store.replaceAll(projects, isAdmin);
    // Garante que a migração de "Custos" para as novas abas fica gravada no servidor
    // para todos os projetos (não só o ativo), já na primeira vez que corre.
    if(isAdmin && migrouAlgum) Store.pushAllRemote();
  } else if(isAdmin){
    Store.pushAllRemote();
  } else {
    Store.replaceAll({}, false);
  }
  RemoteStore.setReady(true);
  render();
  LiveSync.start();
});
</script>
