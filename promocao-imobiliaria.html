const Store = (function(){
  let projects = {};     // id -> project
  let activeId = null;
  let scenario = 'base';
  let listeners = [];
  const LS_KEY = 'promo_imob_v1';

  function persist(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({projects, activeId, schemaVersion:SCHEMA_VERSION}));
    }catch(e){ console.warn('Falha ao gravar localStorage', e); }
    if(activeId && projects[activeId]) RemoteStore.push(activeId, projects[activeId]);
  }
  function load(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        projects = parsed.projects||{};
        activeId = parsed.activeId||null;
      }
    }catch(e){ console.warn('Falha ao ler localStorage', e); }
    Object.values(projects).forEach(pr=>{ try{ StorageEngine.migrate(pr); }catch(e){ console.error('Falha na migração (load local)', e); } });
    if(Object.keys(projects).length===0){
      const demo = buildDemoProject();
      projects[demo.id] = demo;
      activeId = demo.id;
      persist();
    }
    if(!activeId || !projects[activeId]) activeId = Object.keys(projects)[0];
  }
  function notify(){ listeners.forEach(fn=>fn()); }
  function subscribe(fn){ listeners.push(fn); }
  function all(){ return projects; }
  function active(){ return projects[activeId]; }
  function setActive(id){ activeId = id; scenario='base'; persist(); notify(); }
  function getScenario(){ return scenario; }
  function setScenario(s){ scenario = s; notify(); }
  function addProject(p){ projects[p.id]=p; activeId=p.id; scenario='base'; persist(); notify(); }
  function removeProject(id){
    RemoteStore.remove(id);
    delete projects[id];
    if(activeId===id) activeId = Object.keys(projects)[0]||null;
    if(!activeId){ const demo=buildDemoProject(); projects[demo.id]=demo; activeId=demo.id; }
    persist(); notify();
  }
  function update(mutatorFn){
    const p = active();
    if(!p) return;
    mutatorFn(p);
    persist();
    notify();
  }
  function replaceAll(newProjects, seedDemoIfEmpty){
    const prevActiveId = activeId;
    const prevScenario = scenario;
    projects = newProjects||{};
    if(Object.keys(projects).length===0 && seedDemoIfEmpty!==false){
      const demo = buildDemoProject();
      projects[demo.id] = demo;
    }
    if(prevActiveId && projects[prevActiveId]){
      // Mantém o projeto e o cenário ativos (ex: quando a lista é recarregada
      // em tempo real) em vez de saltar sempre para o primeiro projeto.
      activeId = prevActiveId;
      scenario = prevScenario;
    } else {
      activeId = Object.keys(projects)[0]||null;
      scenario = 'base';
    }
    if(activeId) persist(); else try{ localStorage.setItem(LS_KEY, JSON.stringify({projects, activeId, schemaVersion:SCHEMA_VERSION})); }catch(e){}
    notify();
  }
  function pushAllRemote(){
    Object.values(projects).forEach(p=> RemoteStore.push(p.id, p));
  }
  function persistLocalOnly(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({projects, activeId, schemaVersion:SCHEMA_VERSION})); }catch(e){}
  }
  // Aplicam uma alteração vinda do Supabase Realtime (outra sessão/utilizador) sem
  // voltar a enviá-la para o servidor — evita eco e ecrãs que "lutam" entre si.
  function applyRemoteUpsert(id, data){
    projects[id] = data;
    if(!activeId) activeId = id;
    persistLocalOnly();
    notify();
  }
  function applyRemoteRemove(id){
    if(!(id in projects)) return;
    delete projects[id];
    if(activeId===id) activeId = Object.keys(projects)[0]||null;
    persistLocalOnly();
    notify();
  }
  function hasProject(id){ return id in projects; }
  return {load,persist,all,active,setActive,addProject,removeProject,update,replaceAll,pushAllRemote,notify,subscribe,getScenario,setScenario,applyRemoteUpsert,applyRemoteRemove,hasProject};
})();

/* =========================================================================
   LIVE SYNC — atualiza o ecrã em tempo real quando outra sessão (ou o
   administrador, a partir da aba "Contas") altera dados no Supabase,
   sem ser preciso atualizar a página.
   ========================================================================= */
const LiveSync = (function(){
  let channels = [];
  let started = false;
  let refreshingAccess = false;

  async function refreshAccessAndProjects(){
    if(refreshingAccess) return; // evita corridas quando chegam vários eventos seguidos
    refreshingAccess = true;
    try{
      await Auth.refreshPermissions();
      const remote = await RemoteStore.pullAll();
      if(remote){
        const projects = {};
        remote.forEach(r=>{ try{ projects[r.id] = StorageEngine.migrate(r.data); }catch(e){ console.error('Falha na migração (refreshAccessAndProjects)', e, r); projects[r.id] = r.data; } });
        Store.replaceAll(projects, Auth.isAdmin());
      }
      render();
    } finally { refreshingAccess = false; }
  }

  function start(){
    if(started) return;
    started = true;

    const projCh = supaClient.channel('promo-projects-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'promo_projects' }, payload=>{
        if(payload.eventType === 'DELETE'){
          const oldId = payload.old && payload.old.id;
          if(oldId) Store.applyRemoteRemove(oldId);
          return;
        }
        const row = payload.new;
        if(!row) return;
        let data;
        try{ data = StorageEngine.migrate(row.data); }catch(e){ console.error('Falha na migração (LiveSync upsert)', e, row); data = row.data; }
        const isNew = !Store.hasProject(row.id);
        Store.applyRemoteUpsert(row.id, data);
        // Um projeto novo pode significar acesso novo (RLS já filtrou) — confirma via lista de acesso também.
        if(isNew) refreshAccessAndProjects();
      })
      .subscribe();

    const accessCh = supaClient.channel('promo-access-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'promo_project_access' }, ()=> refreshAccessAndProjects())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'promo_allowed_emails' }, ()=> refreshAccessAndProjects())
      .subscribe();

    channels = [projCh, accessCh];
  }

  function stop(){
    channels.forEach(ch=>{ try{ supaClient.removeChannel(ch); }catch(e){} });
    channels = [];
    started = false;
  }

  return { start, stop };
})();

/* =========================================================================
   COST ENGINE
   ========================================================================= */
const CostEngine = (function(){
  // returns array indexed by absolute month (from project start) of {base, ivaSuportado, ivaDedutivel, ivaNaoDedutivel, cashOut, economico}
  function distributeCost(cost, startIso, monthCount){
    const arr = [];
    for(let i=0;i<monthCount;i++) arr.push({base:0});
    const put = (mIdx, val)=>{
      if(mIdx<0) mIdx=0;
      if(mIdx>=monthCount) mIdx = monthCount-1;
      if(!arr[mIdx]) arr[mIdx]={base:0};
      arr[mIdx].base += val;
    };
    const mIni = cost.mesInicio||0;
    const mFim = (cost.mesFim===undefined||cost.mesFim===null)?mIni:cost.mesFim;
    if(cost.distribuicao==='unico'){
      put(mIni, cost.valorBase);
    } else if(cost.distribuicao==='igual'){
      const n = Math.max(1, mFim-mIni+1);
      const parcela = cost.valorBase/n;
      for(let m=mIni;m<=mFim;m++) put(m, parcela);
    } else if(cost.distribuicao==='manual'){
      (cost.manualValores||[]).forEach(mv=> put(mv.mes, mv.valor||0) );
    } else if(cost.distribuicao==='percentual'){
      (cost.percentuais||[]).forEach(pv=> put(pv.mes, (pv.perc||0)*cost.valorBase) );
    }
    // apply IVA logic per month slice
    return arr.map(slice=>{
      const base = slice.base||0;
      const ivaSuportado = cost.temIVA ? base*(cost.taxaIVA||0) : 0;
      let percDed = 0;
      if(cost.ivaDedutivel==='sim') percDed = 1;
      else if(cost.ivaDedutivel==='parcial') percDed = cost.percDedutivel||0;
      const ivaDedutivel = ivaSuportado*percDed;
      const ivaNaoDedutivel = ivaSuportado-ivaDedutivel;
      return {
        base, ivaSuportado, ivaDedutivel, ivaNaoDedutivel,
        cashOut: base+ivaSuportado,
        economico: base+ivaNaoDedutivel
      };
    });
  }
  function distributionTotal(cost){
    if(cost.distribuicao==='manual') return Util.sum(cost.manualValores||[], x=>x.valor||0);
    if(cost.distribuicao==='percentual') return Util.sum(cost.percentuais||[], x=>(x.perc||0))*cost.valorBase;
    return cost.valorBase;
  }
  return {distributeCost, distributionTotal};
})();

/* =========================================================================
   CONSTRUCTION ENGINE (análise de margem por rubrica de "Custos construção":
   valor de venda vs. valor de construção. É só para esta análise — o valor
   que conta como custo real do projeto, no cash-flow geral, é sempre o
   "valor de venda" de cada rubrica, tal como qualquer outro custo).
   ========================================================================= */
const ConstructionEngine = (function(){
  // repartição genérica: aplica a "forma" de uma rubrica (único/igual/manual/percentual)
  // a um valor total qualquer, devolvendo um array indexado por mês absoluto.
  function distributeByShape(item, totalValue, monthCount){
    const arr = new Array(monthCount).fill(0);
    const put = (mIdx, val)=>{
      if(mIdx<0) mIdx=0;
      if(mIdx>=monthCount) mIdx=monthCount-1;
      arr[mIdx]+= val;
    };
    const mIni = item.mesInicio||0;
    const mFim = (item.mesFim===undefined||item.mesFim===null)?mIni:item.mesFim;
    if(item.distribuicao==='unico'){
      put(mIni, totalValue);
    } else if(item.distribuicao==='igual'){
      const n = Math.max(1, mFim-mIni+1);
      const parcela = totalValue/n;
      for(let m=mIni;m<=mFim;m++) put(m, parcela);
    } else if(item.distribuicao==='manual'){
      const totalManual = Util.sum(item.manualValores||[], x=>x.valor||0);
      (item.manualValores||[]).forEach(mv=>{
        const frac = totalManual>0 ? (mv.valor||0)/totalManual : 0;
        put(mv.mes, frac*totalValue);
      });
    } else if(item.distribuicao==='percentual'){
      (item.percentuais||[]).forEach(pv=> put(pv.mes, (pv.perc||0)*totalValue));
    }
    return arr;
  }
  // devolve, por mês, {vendaBase, vendaCashIn, vendaEconomico, construcaoBase, lucro}
  function distributeItem(item, monthCount){
    const vendaBase = distributeByShape(item, item.valorVenda||0, monthCount);
    const construcaoBase = distributeByShape(item, item.valorConstrucao||0, monthCount);
    return vendaBase.map((v,i)=>{
      const ivaSuportado = item.temIVA ? v*(item.taxaIVA||0) : 0;
      let percDed = 0;
      if(item.ivaDedutivel==='sim') percDed = 1;
      else if(item.ivaDedutivel==='parcial') percDed = item.percDedutivel||0;
      const ivaDedutivel = ivaSuportado*percDed;
      const ivaNaoDedutivel = ivaSuportado-ivaDedutivel;
      return {
        vendaBase:v, vendaCashIn:v+ivaSuportado, vendaEconomico:v+ivaNaoDedutivel,
        construcaoBase: construcaoBase[i], lucro: v-construcaoBase[i]
      };
    });
  }
  function build(project, monthCount){
    const items = project.construcaoCustos||[];
    const vendaMensal = new Array(monthCount).fill(0);
    const construcaoMensal = new Array(monthCount).fill(0);
    const lucroMensal = new Array(monthCount).fill(0);
    const porCategoria = {}; // categoria -> {venda, construcao, lucro}
    const breakdown = [];
    items.forEach(item=>{
      const arr = distributeItem(item, monthCount);
      let totVenda=0, totConstrucao=0;
      arr.forEach((s,i)=>{ vendaMensal[i]+=s.vendaCashIn; construcaoMensal[i]+=s.construcaoBase; lucroMensal[i]+=s.lucro; totVenda+=s.vendaCashIn; totConstrucao+=s.construcaoBase; });
      if(!porCategoria[item.categoria]) porCategoria[item.categoria] = {venda:0, construcao:0, lucro:0};
      porCategoria[item.categoria].venda += totVenda;
      porCategoria[item.categoria].construcao += totConstrucao;
      porCategoria[item.categoria].lucro += (totVenda-totConstrucao);
      breakdown.push({id:item.id, categoria:item.categoria, descricao:item.descricao, venda:totVenda, construcao:totConstrucao, lucro:totVenda-totConstrucao});
    });
    let run=0; const acumulado = lucroMensal.map(v=>{ run+=v; return run; });
    const totalVenda = Util.sum(vendaMensal), totalConstrucao = Util.sum(construcaoMensal), totalLucro = Util.sum(lucroMensal);
    return { vendaMensal, construcaoMensal, lucroMensal, acumulado, porCategoria, breakdown, totalVenda, totalConstrucao, totalLucro };
  }
  return { distributeByShape, distributeItem, build };
})();

// Lista consolidada dos custos "reais" do projeto: junta "Custos construção" e "Custos
// outros" (cada rubrica passa a contar como custo do projeto pelo seu "valor de venda",
// que guarda o valor total da rubrica; "valor de construção/compra" é só para a margem
// nas abas de Análise). Usado pelo Cash-Flow, validações e pela aba "Custos" (consolidada).
// basis: 'venda' (por defeito, usa o valor de venda como custo — comportamento normal
// do cash-flow) ou 'custo' (usa o valor de construção/compra em vez do valor de venda,
// para simular o cash-flow pelo lado do custo real de obra/compra).
function allProjectCosts(project, basis){
  const useCusto = basis==='custo';
  const fromConstrucao = (project.construcaoCustos||[]).map(c=>({...c, valorBase: useCusto ? (c.valorConstrucao||c.valorVenda||0) : (c.valorVenda||0), origem:'construcao'}));
  const fromOutros = (project.custosOutros||[]).map(c=>({...c, valorBase: useCusto ? (c.valorCompra||c.valorVenda||0) : (c.valorVenda||0), origem:'outros'}));
  return [...fromConstrucao, ...fromOutros];
}

// Data em que o capital de um investidor é necessário: escolhe-se uma categoria de custo
// e um nº de dias de antecedência; a data-necessidade = data de início dessa categoria
// (o mês mais cedo entre as rubricas dessa categoria) menos esse nº de dias. Devolve null
// se o investidor não tiver categoria definida ou não houver rubricas dessa categoria.
function computeDataNecessidade(project, investor){
  if(!investor || !investor.categoriaNecessidade) return null;
  const items = allProjectCosts(project).filter(c=>c.categoria===investor.categoriaNecessidade);
  if(!items.length) return null;
  const minMes = Math.min(...items.map(c=>c.mesInicio||0));
  const dataCategoria = Util.addMonths(project.assumptions.dataInicio, minMes);
  const dias = investor.diasNecessidade||0;
  const d = new Date(dataCategoria+'T00:00:00');
  d.setDate(d.getDate()-dias);
  return d.toISOString().slice(0,10);
}
// Data efetiva a usar no cash-flow para as entradas de capital de um investidor: se tiver
// uma categoria de necessidade definida, todas as suas entradas de capital são tratadas
// como acontecendo nessa data (o dinheiro entra mesmo quando é precisado); caso contrário,
// usa-se a data configurada em cada entrada de capital.
function investorEffectiveContribDate(project, investor, contribData){
  const dn = computeDataNecessidade(project, investor);
  return dn || contribData;
}

/* =========================================================================
   SALES ENGINE (casas / recebimentos)
   ========================================================================= */
const SalesEngine = (function(){
  function houseMonthlyReceipts(house, startIso, monthCount, scenarioDelay){
    const arr = new Array(monthCount).fill(0);
    (house.pagamentos||[]).forEach(pay=>{
      const dataRef = pay.dataEfetiva || pay.dataPrevista;
      if(!dataRef) return;
      let idx = Util.monthIndex(dataRef, startIso) + (scenarioDelay||0);
      idx = Util.clamp(idx, 0, monthCount-1);
      const valor = (pay.valor!==undefined && pay.valor!==null) ? pay.valor : (pay.percentagem||0)*(house.precoVendaEfetivo||house.precoVendaPrevisto||0);
      arr[idx]+= valor;
    });
    return arr;
  }
  function paymentsTotal(house){
    return Util.sum(house.pagamentos||[], p=> (p.valor!==undefined&&p.valor!==null)?p.valor:(p.percentagem||0)*(house.precoVendaEfetivo||house.precoVendaPrevisto||0));
  }
  return {houseMonthlyReceipts, paymentsTotal};
})();

/* =========================================================================
   FINANCING ENGINE
   ========================================================================= */
const FinancingEngine = (function(){
  function monthlyRate(annual){ return Math.pow(1+annual,1/12)-1; }
  function scheduleTranche(loan, startIso, monthCount, taxaDelta){
    const draws = new Array(monthCount).fill(0);
    const interest = new Array(monthCount).fill(0);
    const principal = new Array(monthCount).fill(0);
    const balance = new Array(monthCount).fill(0);
    const fees = new Array(monthCount).fill(0);
    const drawIdx = Util.clamp(Util.monthIndex(loan.dataUtilizacao, startIso),0,monthCount-1);
    draws[drawIdx]+= (loan.montanteUtilizado||0);
    fees[drawIdx]+= (loan.comissoes||0);
    const taxaAnual = (loan.taxaBase||0)+(loan.spread||0)+(taxaDelta||0);
    const rMensal = monthlyRate(taxaAnual);
    const carencia = loan.carenciaMeses||0;
    const prazo = loan.prazoMeses||1;
    const amortMonths = Math.max(1, prazo-carencia);
    let saldo = 0;
    const tipo = loan.tipoAmortizacao||'constante';
    let annuity = 0;
    if(tipo==='francesa'){
      annuity = rMensal>0 ? (loan.montanteUtilizado*rMensal)/(1-Math.pow(1+rMensal,-amortMonths)) : (loan.montanteUtilizado/amortMonths);
    }
    for(let m=0;m<monthCount;m++){
      if(m>=drawIdx) saldo += draws[m];
      const jur = saldo*rMensal;
      let amort = 0;
      const mesesDesdeInicio = m - drawIdx;
      if(mesesDesdeInicio >= carencia && mesesDesdeInicio < carencia+amortMonths && saldo>0){
        if(tipo==='bullet'){
          amort = (mesesDesdeInicio === carencia+amortMonths-1) ? saldo : 0;
        } else if(tipo==='francesa'){
          amort = Math.min(saldo, Math.max(0, annuity - jur));
        } else { // constante (linear)
          amort = Math.min(saldo, loan.montanteUtilizado/amortMonths);
        }
      }
      interest[m]=jur;
      principal[m]=amort;
      saldo = Math.max(0, saldo-amort);
      balance[m]=saldo;
    }
    return {draws, interest, principal, balance, fees};
  }
  return {scheduleTranche, monthlyRate};
})();

/* =========================================================================
   INVESTOR ENGINE
   ========================================================================= */
const InvestorEngine = (function(){
  // project (opcional): quando o investidor tem uma "categoria de necessidade" definida,
  // todas as suas entradas de capital passam a contar na data-necessidade calculada a
  // partir dessa categoria, em vez das datas configuradas em cada entrada.
  function contributionsByMonth(investor, startIso, monthCount, project){
    const arr = new Array(monthCount).fill(0);
    const byTipo = {capital_social:0, suprimentos:0, prestacoes:0};
    (investor.contributions||[]).forEach(c=>{
      const dataEfetiva = project ? investorEffectiveContribDate(project, investor, c.data) : c.data;
      const idx = Util.clamp(Util.monthIndex(dataEfetiva, startIso),0,monthCount-1);
      arr[idx]+= c.valor||0;
      byTipo[c.tipo] = (byTipo[c.tipo]||0)+(c.valor||0);
    });
    return {arr, byTipo, total: byTipo.capital_social+byTipo.suprimentos+byTipo.prestacoes};
  }
  // Compute distribution events for an investor, given resolved project profit (may be null on pass 1)
  function computeDistributions(investor, startIso, monthCount, projectProfitBeforeParticipation, project){
    const cap = contributionsByMonth(investor, startIso, monthCount, project);
    const events = []; // {mes, tipo, valor}
    const rm = investor.returnModel||{tipo:'fixo'};
    const entradaIdx = Util.clamp(Util.monthIndex(investor.dataEntrada, startIso),0,monthCount-1);
    let exitIdx = investor.dataSaidaPrevista ? Util.clamp(Util.monthIndex(investor.dataSaidaPrevista, startIso),0,monthCount-1) : monthCount-1;
    // aplicar prazo mínimo/máximo de permanência, quando definidos
    let prazoAjustado = false;
    if(rm.prazoMinimo!==null && rm.prazoMinimo!==undefined && (exitIdx-entradaIdx) < rm.prazoMinimo){ exitIdx = Util.clamp(entradaIdx+rm.prazoMinimo,0,monthCount-1); prazoAjustado='min'; }
    if(rm.prazoMaximo!==null && rm.prazoMaximo!==undefined && (exitIdx-entradaIdx) > rm.prazoMaximo){ exitIdx = Util.clamp(entradaIdx+rm.prazoMaximo,0,monthCount-1); prazoAjustado='max'; }

    function pushCapitalReturn(){
      if(cap.byTipo.capital_social>0) events.push({mes:exitIdx, tipo:'devolucao_capital_social', valor:cap.byTipo.capital_social});
      if(cap.byTipo.suprimentos>0) events.push({mes:exitIdx, tipo:'devolucao_suprimentos', valor:cap.byTipo.suprimentos});
      if(cap.byTipo.prestacoes>0) events.push({mes:exitIdx, tipo:'devolucao_prestacoes', valor:cap.byTipo.prestacoes});
    }
    function clampMinMax(valor){
      if(rm.retornoMinimo!==null && rm.retornoMinimo!==undefined) valor = Math.max(valor, rm.retornoMinimo);
      if(rm.retornoMaximo!==null && rm.retornoMaximo!==undefined) valor = Math.min(valor, rm.retornoMaximo);
      return valor;
    }
    function applyPenaltyOrBonus(valor){
      // penalização por saída antecipada: aplica-se se o prazo mínimo tiver forçado o ajuste ('min' significa que a saída pretendida era mais cedo que o prazo mínimo)
      if(prazoAjustado==='min' && rm.penalizacaoSaidaAntecipada) valor = valor*(1-rm.penalizacaoSaidaAntecipada);
      if(prazoAjustado==='max' && rm.premioPermanencia) valor = valor*(1+rm.premioPermanencia);
      return valor;
    }

    if(rm.tipo==='fixo'){
      let remuneracao = cap.total*(rm.percentagem||0);
      remuneracao = applyPenaltyOrBonus(clampMinMax(remuneracao));
      pushCapitalReturn();
      if(remuneracao>0) events.push({mes:exitIdx, tipo:'remuneracao', valor:remuneracao});
    } else if(rm.tipo==='anual' || rm.tipo==='mensal'){
      // hurdle rate, quando definido, substitui a taxa configurada como retorno preferencial mínimo a satisfazer
      const rAnualBase = rm.tipo==='anual' ? (rm.percentagemAnual||0) : (Math.pow(1+(rm.percentagemMensal||0),12)-1);
      const rAnual = (rm.hurdleRate!==null && rm.hurdleRate!==undefined) ? Math.max(rAnualBase, rm.hurdleRate) : rAnualBase;
      const rMensal = FinancingEngine.monthlyRate(rAnual);
      let saldo = 0; let acumJuros = 0;
      for(let m=entradaIdx;m<=exitIdx;m++){
        if(m===entradaIdx) saldo = cap.total; else acumJuros += saldo*rMensal;
      }
      let remuneracao = applyPenaltyOrBonus(clampMinMax(acumJuros));
      pushCapitalReturn();
      if(remuneracao>0) events.push({mes:exitIdx, tipo:'remuneracao', valor:remuneracao});
    } else if(rm.tipo==='percentual_lucro' || rm.tipo==='capital_mais_lucro'){
      pushCapitalReturn();
      if(projectProfitBeforeParticipation!==null && projectProfitBeforeParticipation>0){
        let part = projectProfitBeforeParticipation*(rm.percentagemLucro||0);
        part = applyPenaltyOrBonus(clampMinMax(part));
        events.push({mes:exitIdx, tipo:'participacao_lucro', valor:part});
      }
    } else if(rm.tipo==='manual'){
      (rm.eventos||[]).forEach(ev=>{
        const idx = Util.clamp(Util.monthIndex(ev.data, startIso),0,monthCount-1);
        events.push({mes:idx, tipo:ev.tipo, valor:ev.valor||0});
      });
    }
    return events;
  }
  // Calcula a "procura" de cada investidor por categoria de tier de waterfall (sem aplicar pushCapitalReturn diretamente),
  // usada pelo WaterfallEngine para montar os totais por prioridade.
  function computeWaterfallDemand(investor, startIso, monthCount, projectProfitBeforeParticipation, project){
    const cap = contributionsByMonth(investor, startIso, monthCount, project);
    const rm = investor.returnModel||{tipo:'fixo'};
    const entradaIdx = Util.clamp(Util.monthIndex(investor.dataEntrada, startIso),0,monthCount-1);
    let exitIdx = investor.dataSaidaPrevista ? Util.clamp(Util.monthIndex(investor.dataSaidaPrevista, startIso),0,monthCount-1) : monthCount-1;
    let prazoAjustado = false;
    if(rm.prazoMinimo!==null && rm.prazoMinimo!==undefined && (exitIdx-entradaIdx) < rm.prazoMinimo){ exitIdx = Util.clamp(entradaIdx+rm.prazoMinimo,0,monthCount-1); prazoAjustado='min'; }
    if(rm.prazoMaximo!==null && rm.prazoMaximo!==undefined && (exitIdx-entradaIdx) > rm.prazoMaximo){ exitIdx = Util.clamp(entradaIdx+rm.prazoMaximo,0,monthCount-1); prazoAjustado='max'; }
    function clampMinMax(valor){
      if(rm.retornoMinimo!==null && rm.retornoMinimo!==undefined) valor = Math.max(valor, rm.retornoMinimo);
      if(rm.retornoMaximo!==null && rm.retornoMaximo!==undefined) valor = Math.min(valor, rm.retornoMaximo);
      return valor;
    }
    function applyPenaltyOrBonus(valor){
      if(prazoAjustado==='min' && rm.penalizacaoSaidaAntecipada) valor = valor*(1-rm.penalizacaoSaidaAntecipada);
      if(prazoAjustado==='max' && rm.premioPermanencia) valor = valor*(1+rm.premioPermanencia);
      return valor;
    }
    let preferencial = 0, lucro = 0;
    if(rm.tipo==='fixo'){
      preferencial = applyPenaltyOrBonus(clampMinMax(cap.total*(rm.percentagem||0)));
    } else if(rm.tipo==='anual' || rm.tipo==='mensal'){
      const rAnualBase = rm.tipo==='anual' ? (rm.percentagemAnual||0) : (Math.pow(1+(rm.percentagemMensal||0),12)-1);
      const rAnual = (rm.hurdleRate!==null && rm.hurdleRate!==undefined) ? Math.max(rAnualBase, rm.hurdleRate) : rAnualBase;
      const rMensal = FinancingEngine.monthlyRate(rAnual);
      let saldo=0, acumJuros=0;
      for(let m=entradaIdx;m<=exitIdx;m++){ if(m===entradaIdx) saldo=cap.total; else acumJuros += saldo*rMensal; }
      preferencial = applyPenaltyOrBonus(clampMinMax(acumJuros));
    } else if(rm.tipo==='percentual_lucro' || rm.tipo==='capital_mais_lucro'){
      if(projectProfitBeforeParticipation!==null && projectProfitBeforeParticipation>0){
        lucro = applyPenaltyOrBonus(clampMinMax(projectProfitBeforeParticipation*(rm.percentagemLucro||0)));
      }
    }
    return { exitIdx, suprimentos:cap.byTipo.suprimentos||0, capital:(cap.byTipo.capital_social||0)+(cap.byTipo.prestacoes||0), preferencial, lucro };
  }
  return {contributionsByMonth, computeDistributions, computeWaterfallDemand};
})();

/* =========================================================================
   WATERFALL ENGINE — distribuição do residual final por ordem de prioridade.
   Prioridades 1 (despesas) e 2 (serviço da dívida) já são satisfeitas
   estruturalmente pelo cash-flow normal (são custos obrigatórios, não sujeitos
   a escolha de alocação). Este motor distribui o remanescente (pool) pelas
   restantes prioridades, na ordem configurada em project.waterfall.ordem:
   'suprimentos' | 'preferencial' | 'capital' | 'lucro' | 'residual' (promotor).
   ========================================================================= */
const WaterfallEngine = (function(){
  function allocate(project, startIso, monthCount, pool, resultadoAntesParticipacao){
    const ordem = (project.waterfall && project.waterfall.ordem) || ['suprimentos','preferencial','capital','lucro','residual'];
    const demands = project.investors.map(inv=> ({ inv, d: InvestorEngine.computeWaterfallDemand(inv, startIso, monthCount, resultadoAntesParticipacao, project) }));
    let remaining = pool;
    const alloc = {}; // invId -> {suprimentos,capital,preferencial,lucro}
    demands.forEach(({inv})=> alloc[inv.id] = {suprimentos:0, capital:0, preferencial:0, lucro:0});
    ordem.forEach(tier=>{
      if(tier==='residual') return; // tratado no fim
      const key = tier;
      const total = Util.sum(demands, x=> x.d[key]||0);
      if(total<=0) return;
      const paid = Math.min(total, Math.max(0,remaining));
      const factor = total>0 ? paid/total : 0;
      demands.forEach(({inv,d})=>{ alloc[inv.id][key] = (d[key]||0)*factor; });
      remaining -= paid;
    });
    const promoterResidual = Math.max(0, remaining);
    return { alloc, promoterResidual, exitIdxByInvestor: Object.fromEntries(demands.map(({inv,d})=>[inv.id,d.exitIdx])) };
  }
  return {allocate};
})();

/* =========================================================================
   SCENARIO ENGINE — devolve um "projeto computável" com deltas aplicados,
   nunca modifica o objeto original.
   ========================================================================= */
const ScenarioEngine = (function(){
  function apply(project, scenarioKey){
    if(scenarioKey==='base' || !project.scenarios[scenarioKey]){
      return { proj: project, deltas: {vendaDelta:0,custoDelta:0,atrasoVendasMeses:0,atrasoConstrucaoMeses:0,taxaFinanciamentoDelta:0} };
    }
    const deltas = project.scenarios[scenarioKey];
    const p = Util.deepClone(project);
    function applyCostDeltas(c){
      c.valorVenda = (c.valorVenda||0)*(1+(deltas.custoDelta||0));
      c.mesInicio = Math.max(0, c.mesInicio + (deltas.atrasoConstrucaoMeses||0));
      c.mesFim = Math.max(c.mesInicio, (c.mesFim||c.mesInicio) + (deltas.atrasoConstrucaoMeses||0));
      if(c.manualValores) c.manualValores = c.manualValores.map(mv=>({...mv, mes: mv.mes+(deltas.atrasoConstrucaoMeses||0)}));
      if(c.percentuais) c.percentuais = c.percentuais.map(pv=>({...pv, mes: pv.mes+(deltas.atrasoConstrucaoMeses||0)}));
    }
    (p.construcaoCustos||[]).forEach(applyCostDeltas);
    (p.custosOutros||[]).forEach(applyCostDeltas);
    p.houses.forEach(h=>{
      if(h.precoVendaPrevisto) h.precoVendaPrevisto = h.precoVendaPrevisto*(1+(deltas.vendaDelta||0));
      (h.pagamentos||[]).forEach(pay=>{
        if(pay.valor) pay.valor = pay.valor*(1+(deltas.vendaDelta||0));
        if(pay.dataPrevista) pay.dataPrevista = Util.addMonths(pay.dataPrevista, deltas.atrasoVendasMeses||0);
      });
    });
    p.financing.forEach(f=>{ f.spread = (f.spread||0)+(deltas.taxaFinanciamentoDelta||0); });
    return { proj: p, deltas };
  }
  return {apply};
})();

/* =========================================================================
   CASH FLOW ENGINE — agrega tudo num único livro mensal
   ========================================================================= */
const CashFlowEngine = (function(){
  function computeMonthCount(project){
    const start = project.assumptions.dataInicio;
    let maxIdx = Util.monthIndex(project.assumptions.dataFim, start);
    allProjectCosts(project).forEach(c=>{ maxIdx = Math.max(maxIdx, (c.mesFim||c.mesInicio||0)); });
    project.houses.forEach(h=>{
      (h.pagamentos||[]).forEach(p=>{
        const d = p.dataEfetiva||p.dataPrevista;
        if(d) maxIdx = Math.max(maxIdx, Util.monthIndex(d,start));
      });
    });
    project.investors.forEach(inv=>{
      if(inv.dataSaidaPrevista) maxIdx = Math.max(maxIdx, Util.monthIndex(inv.dataSaidaPrevista,start));
    });
    project.financing.forEach(f=>{ maxIdx = Math.max(maxIdx, Util.monthIndex(f.dataUtilizacao,start)+(f.prazoMeses||0)); });
    return Math.max(6, maxIdx+3);
  }

  // full: builds the complete monthly ledger. excludeInvestorReturns: for pass-1 profit calc.
  function build(project, scenarioKey, excludeInvestorReturns, basis){
    const {proj, deltas} = ScenarioEngine.apply(project, scenarioKey);
    const start = proj.assumptions.dataInicio;
    const monthCount = computeMonthCount(proj);

    const zeros = ()=> new Array(monthCount).fill(0);
    const led = {
      capitalSocial: zeros(), suprimentos: zeros(), prestacoes: zeros(), creditoBancario: zeros(),
      cpcv: zeros(), pagamentosIntermedios: zeros(), escrituras: zeros(), outrosProveitos: zeros(),
      custosPorCategoria: {}, // categoria -> array cashOut
      custosPorCategoriaSub: {}, // "categoria|||subcategoria" -> {categoria,subcategoria,arr}
      custosEconomicoPorCategoria: {},
      ivaSuportado: zeros(), ivaDedutivel: zeros(), ivaNaoDedutivel: zeros(),
      jurosFinanciamento: zeros(), comissoesFinanciamento: zeros(), amortizacaoDivida: zeros(), saldoDivida: zeros(),
      devolucaoCapitalSocial: zeros(), devolucaoSuprimentos: zeros(), devolucaoPrestacoes: zeros(),
      remuneracaoInvestidores: zeros(), participacaoLucroInvestidores: zeros(),
      tributacao: zeros(),
      investorEventos: [], // {mes, tipo, valor, invNome} — devoluções/remuneração/participação, com identidade do investidor
    };
    const costBreakdown = []; // {id, categoria, descricao, cashOut, economico, ivaSuportado, ivaDedutivel}

    // custos (consolidados de "Custos construção" + "Custos outros") — basis 'venda'
    // (por defeito) ou 'custo', conforme escolhido na aba Cash-Flow.
    allProjectCosts(proj, basis).forEach(cost=>{
      const dist = CostEngine.distributeCost(cost, start, monthCount);
      if(!led.custosPorCategoria[cost.categoria]) led.custosPorCategoria[cost.categoria]=zeros();
      if(!led.custosEconomicoPorCategoria[cost.categoria]) led.custosEconomicoPorCategoria[cost.categoria]=zeros();
      const subKey = cost.categoria+'|||'+(cost.subcategoria||'');
      if(!led.custosPorCategoriaSub[subKey]) led.custosPorCategoriaSub[subKey] = {categoria:cost.categoria, subcategoria:cost.subcategoria||'', arr:zeros()};
      let totCashOut=0, totEcon=0, totIvaS=0, totIvaD=0;
      dist.forEach((slice,m)=>{
        led.custosPorCategoria[cost.categoria][m]+= slice.cashOut;
        led.custosPorCategoriaSub[subKey].arr[m]+= slice.cashOut;
        led.custosEconomicoPorCategoria[cost.categoria][m]+= slice.economico;
        led.ivaSuportado[m]+= slice.ivaSuportado;
        led.ivaDedutivel[m]+= slice.ivaDedutivel;
        led.ivaNaoDedutivel[m]+= slice.ivaNaoDedutivel;
        totCashOut+=slice.cashOut; totEcon+=slice.economico; totIvaS+=slice.ivaSuportado; totIvaD+=slice.ivaDedutivel;
      });
      costBreakdown.push({id:cost.id, categoria:cost.categoria, descricao:cost.descricao, cashOut:totCashOut, economico:totEcon, ivaSuportado:totIvaS, ivaDedutivel:totIvaD});
    });

    // casas / vendas
    const houseBreakdown = [];
    proj.houses.forEach(h=>{
      (h.pagamentos||[]).forEach(pay=>{
        const dataRef = pay.dataEfetiva||pay.dataPrevista;
        if(!dataRef) return;
        const idx = Util.clamp(Util.monthIndex(dataRef,start),0,monthCount-1);
        const valor = (pay.valor!==undefined&&pay.valor!==null)?pay.valor:(pay.percentagem||0)*(h.precoVendaEfetivo||h.precoVendaPrevisto||0);
        const nomeLower = (pay.nome||'').toLowerCase();
        if(nomeLower.includes('cpcv')) led.cpcv[idx]+=valor;
        else if(nomeLower.includes('escrit')) led.escrituras[idx]+=valor;
        else led.pagamentosIntermedios[idx]+=valor;
      });
      const totalRecebido = SalesEngine.paymentsTotal(h);
      houseBreakdown.push({id:h.id, referencia:h.referencia, precoVenda:h.precoVendaEfetivo||h.precoVendaPrevisto||0, totalRecebido});
    });

    // financiamento
    const financeBreakdown = [];
    proj.financing.forEach(f=>{
      const sch = FinancingEngine.scheduleTranche(f, start, monthCount, deltas.taxaFinanciamentoDelta);
      for(let m=0;m<monthCount;m++){
        led.creditoBancario[m]+= sch.draws[m];
        led.jurosFinanciamento[m]+= sch.interest[m];
        led.comissoesFinanciamento[m]+= sch.fees[m];
        led.amortizacaoDivida[m]+= sch.principal[m];
        led.saldoDivida[m]+= sch.balance[m];
      }
      financeBreakdown.push({id:f.id, banco:f.banco, totalJuros:Util.sum(sch.interest), totalAmortizado:Util.sum(sch.principal)});
    });

    // investidores — contribuições sempre entram
    const investorContribBreakdown = [];
    proj.investors.forEach(inv=>{
      const c = InvestorEngine.contributionsByMonth(inv, start, monthCount, proj);
      for(let m=0;m<monthCount;m++){
        // allocate proportionally by type per month isn't tracked per month by type here; approximate via totals below
      }
      (inv.contributions||[]).forEach(cc=>{
        const dataEfetiva = investorEffectiveContribDate(proj, inv, cc.data);
        const idx = Util.clamp(Util.monthIndex(dataEfetiva,start),0,monthCount-1);
        if(cc.tipo==='capital_social') led.capitalSocial[idx]+=cc.valor||0;
        else if(cc.tipo==='suprimentos') led.suprimentos[idx]+=cc.valor||0;
        else if(cc.tipo==='prestacoes') led.prestacoes[idx]+=cc.valor||0;
      });
      investorContribBreakdown.push({id:inv.id, nome:inv.nome, total:c.total});
    });

    // resultado económico parcial (sem participação de investidores) — necessário para modelos % lucro
    function sumArr(a){ return Util.sum(a); }
    const receitasTotais = sumArr(led.cpcv)+sumArr(led.pagamentosIntermedios)+sumArr(led.escrituras)+sumArr(led.outrosProveitos);
    let custosEconomicosTotais = 0;
    Object.values(led.custosEconomicoPorCategoria).forEach(a=> custosEconomicosTotais+=sumArr(a));
    const jurosTotais = sumArr(led.jurosFinanciamento)+sumArr(led.comissoesFinanciamento);
    const resultadoAntesParticipacao = receitasTotais - custosEconomicosTotais - jurosTotais;

    const waterfallOn = !!(proj.waterfall && proj.waterfall.ativo);
    let investorDistBreakdown = [];
    let waterfallInfo = null;

    if(!waterfallOn){
      // investidores — devoluções e remuneração (pass 2, usa resultadoAntesParticipacao quando aplicável)
      proj.investors.forEach(inv=>{
        const events = InvestorEngine.computeDistributions(inv, start, monthCount, excludeInvestorReturns?null:resultadoAntesParticipacao, proj);
        let totCapital=0, totRemun=0, totPart=0;
        events.forEach(ev=>{
          if(excludeInvestorReturns) return;
          const m = Util.clamp(ev.mes,0,monthCount-1);
          if(ev.tipo==='devolucao_capital_social'){ led.devolucaoCapitalSocial[m]+=ev.valor; totCapital+=ev.valor; }
          else if(ev.tipo==='devolucao_suprimentos'){ led.devolucaoSuprimentos[m]+=ev.valor; totCapital+=ev.valor; }
          else if(ev.tipo==='devolucao_prestacoes'){ led.devolucaoPrestacoes[m]+=ev.valor; totCapital+=ev.valor; }
          else if(ev.tipo==='remuneracao'){ led.remuneracaoInvestidores[m]+=ev.valor; totRemun+=ev.valor; }
          else if(ev.tipo==='participacao_lucro'){ led.participacaoLucroInvestidores[m]+=ev.valor; totPart+=ev.valor; }
          if(Math.abs(ev.valor)>0.005) led.investorEventos.push({mes:m, tipo:ev.tipo, valor:ev.valor, invNome:inv.nome});
        });
        investorDistBreakdown.push({id:inv.id, nome:inv.nome, capitalDevolvido:totCapital, remuneracao:totRemun+totPart});
      });
    }
    // (ramo waterfall tratado mais abaixo, depois de calculada a tributação e o pool disponível)

    // tributação (anual simplificada) — baseada nos montantes NOMINAIS devidos aos investidores
    // (no modo waterfall, calculados via computeWaterfallDemand, sem depender ainda do pool disponível)
    let nominalRemuneracaoTotal = 0, nominalParticipacaoTotal = 0;
    if(waterfallOn){
      proj.investors.forEach(inv=>{
        const d = InvestorEngine.computeWaterfallDemand(inv, start, monthCount, excludeInvestorReturns?null:resultadoAntesParticipacao, proj);
        nominalRemuneracaoTotal += d.preferencial;
        nominalParticipacaoTotal += d.lucro;
      });
    } else {
      nominalRemuneracaoTotal = sumArr(led.remuneracaoInvestidores);
      nominalParticipacaoTotal = sumArr(led.participacaoLucroInvestidores);
    }
    const resultadoFinalAntesImpostos = resultadoAntesParticipacao - nominalParticipacaoTotal - nominalRemuneracaoTotal;
    let tributacaoTotal = 0;
    if(resultadoFinalAntesImpostos>0){
      tributacaoTotal = resultadoFinalAntesImpostos*(proj.assumptions.taxaTributacao||0);
      const payIdx = Math.min(monthCount-1, monthCount-2>=0?monthCount-2:0);
      led.tributacao[payIdx]+= tributacaoTotal;
    }

    // consolidar entradas/saídas mensais (base, sem capital próprio do promotor)
    const entradasBase = zeros(), saidasBase = zeros();
    let custosTotaisArr = zeros();
    Object.values(led.custosPorCategoria).forEach(a=>{ for(let m=0;m<monthCount;m++) custosTotaisArr[m]+=a[m]; });
    for(let m=0;m<monthCount;m++){
      entradasBase[m] = led.capitalSocial[m]+led.suprimentos[m]+led.prestacoes[m]+led.creditoBancario[m]+led.cpcv[m]+led.pagamentosIntermedios[m]+led.escrituras[m]+led.outrosProveitos[m];
      saidasBase[m] = custosTotaisArr[m] + led.jurosFinanciamento[m] + led.comissoesFinanciamento[m] + led.amortizacaoDivida[m]
                 + led.devolucaoCapitalSocial[m]+led.devolucaoSuprimentos[m]+led.devolucaoPrestacoes[m]
                 + led.remuneracaoInvestidores[m]+led.participacaoLucroInvestidores[m] + led.tributacao[m];
    }
    const cfLiquidoBase = entradasBase.map((e,i)=>e-saidasBase[i]);

    // necessidade de capital do PROJETO sem qualquer financiamento (nem investidores nem banco) —
    // diagnóstico do pior cenário de funding gap, útil para dimensionar a estrutura de capital.
    const opEntradas = zeros();
    for(let m=0;m<monthCount;m++) opEntradas[m] = led.cpcv[m]+led.pagamentosIntermedios[m]+led.escrituras[m]+led.outrosProveitos[m];
    const opCf = opEntradas.map((e,i)=> e - saidasBase[i]);
    let opRun=0; const opAcum=[];
    opCf.forEach(v=>{ opRun+=v; opAcum.push(opRun); });
    let piorMes=0, piorValor=0;
    opAcum.forEach((v,i)=>{ if(v<piorValor){ piorValor=v; piorMes=i; } });
    const capitalNecessario = -piorValor;

    // Sem injeção automática de capital do promotor para cobrir défice de caixa: o saldo
    // acumulado reflete apenas o que foi realmente introduzido (custos, vendas, financiamento,
    // investidores) e pode ficar negativo se o projeto estiver, nesse momento, por financiar.
    // No final, se sobrar saldo positivo (depois de pagas todas as obrigações a
    // investidores/banco/fisco), esse residual é distribuído ao promotor.
    // No modo waterfall, esta primeira passagem exclui as devoluções/remunerações de investidores
    // (ainda todas a zero nos arrays led), pois estas só são conhecidas depois de repartido o pool.
    const capitalProprioPromotor = zeros();
    let runP = 0;
    for(let m=0;m<monthCount;m++){
      runP += cfLiquidoBase[m];
    }
    let promoterFinalDistribution = Math.max(0, runP);
    const distribuicaoPromotor = zeros();
    led.capitalProprioPromotor = capitalProprioPromotor;

    if(waterfallOn && !excludeInvestorReturns){
      // repartir o pool disponível (runP) pelas prioridades configuradas
      const poolFinal = Math.max(0, runP);
      const wf = WaterfallEngine.allocate(proj, start, monthCount, poolFinal, resultadoAntesParticipacao);
      const settlementIdx = monthCount-1;
      proj.investors.forEach(inv=>{
        const a = wf.alloc[inv.id] || {suprimentos:0,capital:0,preferencial:0,lucro:0};
        led.devolucaoSuprimentos[settlementIdx] += a.suprimentos;
        led.devolucaoCapitalSocial[settlementIdx] += a.capital;
        led.remuneracaoInvestidores[settlementIdx] += a.preferencial;
        led.participacaoLucroInvestidores[settlementIdx] += a.lucro;
        if(Math.abs(a.suprimentos)>0.005) led.investorEventos.push({mes:settlementIdx, tipo:'devolucao_suprimentos', valor:a.suprimentos, invNome:inv.nome});
        if(Math.abs(a.capital)>0.005) led.investorEventos.push({mes:settlementIdx, tipo:'devolucao_capital_social', valor:a.capital, invNome:inv.nome});
        if(Math.abs(a.preferencial)>0.005) led.investorEventos.push({mes:settlementIdx, tipo:'remuneracao', valor:a.preferencial, invNome:inv.nome});
        if(Math.abs(a.lucro)>0.005) led.investorEventos.push({mes:settlementIdx, tipo:'participacao_lucro', valor:a.lucro, invNome:inv.nome});
        investorDistBreakdown.push({id:inv.id, nome:inv.nome, capitalDevolvido:a.suprimentos+a.capital, remuneracao:a.preferencial+a.lucro});
      });
      promoterFinalDistribution = wf.promoterResidual;
      const totalDemand = Util.sum(proj.investors, inv=>{
        const d = InvestorEngine.computeWaterfallDemand(inv, start, monthCount, resultadoAntesParticipacao, proj);
        return d.suprimentos+d.capital+d.preferencial+d.lucro;
      });
      waterfallInfo = { pool: poolFinal, totalDemand, promoterResidual: wf.promoterResidual, insuficiente: totalDemand > poolFinal+0.01 };
    }
    if(promoterFinalDistribution>0) distribuicaoPromotor[monthCount-1] += promoterFinalDistribution;
    led.distribuicaoPromotor = distribuicaoPromotor;

    // recalcular entradas/saídas finais incluindo devoluções/remuneração de investidores (agora preenchidas)
    // e a distribuição final ao promotor.
    for(let m=0;m<monthCount;m++){
      saidasBase[m] = custosTotaisArr[m] + led.jurosFinanciamento[m] + led.comissoesFinanciamento[m] + led.amortizacaoDivida[m]
                 + led.devolucaoCapitalSocial[m]+led.devolucaoSuprimentos[m]+led.devolucaoPrestacoes[m]
                 + led.remuneracaoInvestidores[m]+led.participacaoLucroInvestidores[m] + led.tributacao[m];
    }
    const entradas = zeros(), saidas = zeros();
    for(let m=0;m<monthCount;m++){
      entradas[m] = entradasBase[m] + capitalProprioPromotor[m];
      saidas[m] = saidasBase[m] + distribuicaoPromotor[m];
    }
    const cfLiquido = entradas.map((e,i)=>e-saidas[i]);
    const cfAcumulado = []; let run=0;
    cfLiquido.forEach(v=>{ run+=v; cfAcumulado.push(run); });

    const capitalProprioPromotorTotal = Util.sum(capitalProprioPromotor);
    const resultadoAtribuivelPromotor = promoterFinalDistribution - capitalProprioPromotorTotal;
    const promoterCashFlow = capitalProprioPromotor.map((v,i)=> -v + (i===monthCount-1?promoterFinalDistribution:0));

    const totalCapitalInvestidores = Util.sum(investorContribBreakdown, x=>x.total);
    const totalFinanciamentoBancario = Util.sum(led.creditoBancario);

    return {
      proj, deltas, start, monthCount, led, costBreakdown, houseBreakdown, financeBreakdown,
      investorContribBreakdown, investorDistBreakdown, waterfallOn, waterfallInfo,
      entradas, saidas, cfLiquido, cfAcumulado,
      capitalNecessario, mesPiorCapital: piorMes,
      totalCapitalInvestidores, totalFinanciamentoBancario,
      capitalProprioPromotorTotal, promoterFinalDistribution, resultadoAtribuivelPromotor, promoterCashFlow,
      receitasTotais, custosEconomicosTotais, jurosTotais,
      resultadoAntesParticipacao, resultadoFinalAntesImpostos, tributacaoTotal,
      resultadoLiquido: resultadoFinalAntesImpostos - tributacaoTotal,
      custosTotaisArr
    };
  }
  return {build, computeMonthCount};
})();

/* =========================================================================
   METRICS ENGINE
   ========================================================================= */
const MetricsEngine = (function(){
  function npv(cashflows, monthlyRate){
    let v=0;
    cashflows.forEach((cf,i)=>{ v+= cf/Math.pow(1+monthlyRate,i); });
    return v;
  }
  function irrMonthly(cashflows){
    // Newton-Raphson with bisection fallback. returns {value, warning}
    const hasPos = cashflows.some(v=>v>0), hasNeg = cashflows.some(v=>v<0);
    if(!hasPos || !hasNeg) return {value:null, warning:'Sem TIR válida: fluxos sem inversão de sinal.'};
    let signChanges = 0;
    for(let i=1;i<cashflows.length;i++){ if((cashflows[i-1]<0&&cashflows[i]>=0)||(cashflows[i-1]>=0&&cashflows[i]<0)) signChanges++; }
    let r = 0.01, converged=false;
    for(let iter=0; iter<200; iter++){
      let f=0, df=0;
      cashflows.forEach((cf,t)=>{ f+= cf/Math.pow(1+r,t); if(t>0) df+= -t*cf/Math.pow(1+r,t+1); });
      if(Math.abs(df)<1e-12) break;
      const rNew = r - f/df;
      if(!isFinite(rNew) || rNew<=-0.999){ break; }
      if(Math.abs(rNew-r)<1e-9){ r=rNew; converged=true; break; }
      r = rNew;
    }
    if(!converged){
      // bisection fallback over a reasonable range
      let lo=-0.9, hi=5, flo=npv(cashflows,lo), fhi=npv(cashflows,hi);
      if(flo*fhi>0){ return {value:null, warning:'TIR não convergiu — verifique o padrão de fluxos.'}; }
      for(let i=0;i<200;i++){
        const mid=(lo+hi)/2, fm=npv(cashflows,mid);
        if(Math.abs(fm)<1e-6){ r=mid; converged=true; break; }
        if(flo*fm<0){ hi=mid; fhi=fm; } else { lo=mid; flo=fm; }
        r=mid;
      }
    }
    return {value:r, warning: signChanges>1 ? 'Mais do que uma inversão de sinal nos fluxos: possível TIR não-única — interprete com cautela.' : null};
  }
  function annualize(monthlyRate){ return Math.pow(1+monthlyRate,12)-1; }
  return {npv, irrMonthly, annualize};
})();

/* =========================================================================
   VALIDATION ENGINE
   ========================================================================= */
const ValidationEngine = (function(){
  function run(project, cf){
    const alerts = [];
    // pagamentos de casas somam 100%
    project.houses.forEach(h=>{
      if(h.ignorarValidacao100) return;
      const preco = h.precoVendaEfetivo||h.precoVendaPrevisto||0;
      if(preco<=0) return;
      const total = SalesEngine.paymentsTotal(h);
      const pct = total/preco;
      if(Math.abs(pct-1)>0.005){
        alerts.push({nivel:'warn', msg:`Os pagamentos de ${h.referencia} totalizam apenas ${Util.fmtPct(pct)} do preço de venda.`});
      }
    });
    // custos: distribuição manual/percentual soma corretamente
    allProjectCosts(project).forEach(c=>{
      if(c.distribuicao==='percentual'){
        const soma = Util.sum(c.percentuais||[], x=>x.perc||0);
        if(Math.abs(soma-1)>0.005) alerts.push({nivel:'bad', msg:`Distribuição percentual do custo "${c.descricao||c.categoria}" não totaliza 100% (soma ${Util.fmtPct(soma)}).`});
      }
      if(c.distribuicao==='manual'){
        const soma = Util.sum(c.manualValores||[], x=>x.valor||0);
        if(Math.abs(soma-c.valorBase)>1) alerts.push({nivel:'warn', msg:`Distribuição manual do custo "${c.descricao||c.categoria}" (${Util.fmtMoney0(soma)}) não coincide com o valor base (${Util.fmtMoney0(c.valorBase)}).`});
      }
      if(c.temIVA && !c.taxaIVA) alerts.push({nivel:'warn', msg:`Custo "${c.descricao||c.categoria}" tem IVA mas sem taxa definida.`});
    });
    project.investors.forEach(inv=>{
      if(!inv.dataSaidaPrevista) alerts.push({nivel:'warn', msg:`Investidor ${inv.nome} sem data de saída prevista.`});
    });
    // datas escritura vs CPCV
    project.houses.forEach(h=>{
      const cpcv = (h.pagamentos||[]).find(p=>(p.nome||'').toLowerCase().includes('cpcv'));
      const escr = (h.pagamentos||[]).find(p=>(p.nome||'').toLowerCase().includes('escrit'));
      if(cpcv && escr && cpcv.dataPrevista && escr.dataPrevista && new Date(escr.dataPrevista) < new Date(cpcv.dataPrevista)){
        alerts.push({nivel:'bad', msg:`${h.referencia}: data de escritura é anterior à data de CPCV.`});
      }
    });
    if(cf){
      const negIdx = cf.cfAcumulado.findIndex(v=>v<0);
      if(negIdx>=0){
        alerts.push({nivel:'warn', msg:`Cash-flow acumulado negativo a partir de ${Util.monthLabel(cf.start, negIdx)}.`});
      }
      if(cf.capitalNecessario>0){
        alerts.push({nivel:'warn', msg:`Necessidade máxima de capital: ${Util.fmtMoney0(cf.capitalNecessario)} (mês de ${Util.monthLabel(cf.start, cf.mesPiorCapital)}).`});
      }
      if(cf.waterfallOn && cf.waterfallInfo && cf.waterfallInfo.insuficiente){
        alerts.push({nivel:'bad', msg:`Waterfall: o valor disponível (${Util.fmtMoney0(cf.waterfallInfo.pool)}) é inferior ao total devido aos investidores (${Util.fmtMoney0(cf.waterfallInfo.totalDemand)}). Alguns pagamentos ficarão por cobrir integralmente.`});
      }
    }
    return alerts;
  }

  // Bateria de testes de consistência (secção 37 do caderno de encargos).
  // Cada teste devolve {label, esperado, obtido, diff, ok}.
  function runConsistencyChecks(project, cf){
    const checks = [];
    function addCheck(label, esperado, obtido, tolerancia){
      tolerancia = tolerancia===undefined?1:tolerancia;
      const diff = obtido - esperado;
      checks.push({ label, esperado, obtido, diff, ok: Math.abs(diff) <= tolerancia });
    }
    // 1) total dos cash-flows das casas = recebimentos registados
    const totalRegistadoCasas = Util.sum(project.houses, h=>SalesEngine.paymentsTotal(h));
    const totalNoLedger = Util.sum(cf.led.cpcv)+Util.sum(cf.led.pagamentosIntermedios)+Util.sum(cf.led.escrituras);
    addCheck('Total dos recebimentos das casas = registado nos pagamentos', totalRegistadoCasas, totalNoLedger);
    // 2) total distribuído de cada custo = total desse custo
    allProjectCosts(project).forEach(c=>{
      const distTotal = CostEngine.distributionTotal(c);
      addCheck(`Distribuição do custo "${(c.descricao||c.categoria).slice(0,40)}" = valor base`, c.valorBase, distTotal, 1);
    });
    // 3) entradas de investidores = capital registado
    project.investors.forEach(inv=>{
      const registado = Util.sum(inv.contributions||[], x=>x.valor||0);
      const noLedger = cf.investorContribBreakdown.find(x=>x.id===inv.id);
      addCheck(`Entradas de capital de ${inv.nome} = registado`, registado, noLedger?noLedger.total:0);
    });
    // 4) devoluções/remuneração = pagamentos previstos aos investidores (apenas quando waterfall inativo,
    //    pois em waterfall os valores podem ser pro-rateados por insuficiência de fundos, por desenho)
    if(!cf.waterfallOn){
      project.investors.forEach(inv=>{
        const nominal = InvestorEngine.computeWaterfallDemand(inv, cf.start, cf.monthCount, cf.resultadoAntesParticipacao, project);
        const nominalTotal = nominal.suprimentos+nominal.capital+nominal.preferencial+nominal.lucro;
        const real = cf.investorDistBreakdown.find(x=>x.id===inv.id);
        const realTotal = real?(real.capitalDevolvido+real.remuneracao):0;
        addCheck(`Devolução + remuneração de ${inv.nome} = modelo de retorno configurado`, nominalTotal, realTotal, 1);
      });
    }
    // 5) saldo final = saldo inicial (0) + entradas - saídas, mês a mês
    let saldoCalc = 0, maxDiff = 0;
    for(let m=0;m<cf.monthCount;m++){
      saldoCalc += (cf.entradas[m]-cf.saidas[m]);
      maxDiff = Math.max(maxDiff, Math.abs(saldoCalc - cf.cfAcumulado[m]));
    }
    addCheck('Saldo acumulado recalculado = saldo acumulado do modelo (máx. divergência mensal)', 0, maxDiff, 1);
    // 6) saldo final do projeto fecha em zero (tudo distribuído)
    addCheck('Saldo de caixa final do projeto ≈ 0 (tudo distribuído)', 0, cf.cfAcumulado[cf.cfAcumulado.length-1], 1);
    return checks;
  }
  return {run, runConsistencyChecks};
})();
</script>

<script>
/* =========================================================================
   REPORT ENGINE (PDF)
   ========================================================================= */
const ReportEngine = (function(){
  function header(doc, project, title){
    doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text(title, 40, 46);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(100);
    doc.text(project.meta.nome||'Projeto', 40, 62);
    doc.setTextColor(0);
  }
  function footer(doc, pageNum, totalPages){
    const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
    doc.setFontSize(8); doc.setTextColor(130);
    doc.text('Gerado em ' + Util.fmtDate(new Date().toISOString().slice(0,10)), 40, h-24);
    doc.text('Página ' + pageNum + ' / ' + totalPages, w-90, h-24);
    doc.setTextColor(0);
  }
  function addTitledTable(doc, y, title, head, body){
    doc.setFont('helvetica','bold'); doc.setFontSize(11);
    doc.text(title, 40, y);
    doc.autoTable({ startY:y+8, head:[head], body, styles:{fontSize:8, cellPadding:4}, headStyles:{fillColor:[31,92,77]}, margin:{left:40,right:40} });
    return doc.lastAutoTable.finalY + 20;
  }
  function exportPromoterPDF(project, cf, sections){
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    let y = 90;
    header(doc, project, 'Relatório do Promotor');
    if(sections.sumario){
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Sumário Executivo', 40, y); y+=16;
      doc.setFont('helvetica','normal'); doc.setFontSize(9);
      const linhas = [
        `Localização: ${project.meta.localizacao||'—'}    Promotor: ${project.meta.promotor||'—'}`,
        `Nº moradias: ${project.houses.length}    Duração estimada: ${cf.monthCount} meses`,

/* =========================================================================
   STORAGE ENGINE — guardar/carregar/backup
   ========================================================================= */
const StorageEngine = (function(){
  async function saveFile(filename, text){
    try{
      if(window.claude && window.claude.use){
        const downloads = await window.claude.use('downloads');
        if(downloads){ await downloads.save({filename, data:text}); return true; }
      }
    }catch(e){ console.warn('downloads capability indisponível', e); }
    try{
      const blob = new Blob([text], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      return true;
    }catch(e){ console.error(e); return false; }
  }
  function exportProject(project){
    const payload = { fileType:'promo-imob-projeto', schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(), project };
    return saveFile((project.meta.nome||'projeto').replace(/[^a-z0-9]+/gi,'_')+'.json', JSON.stringify(payload,null,2));
  }
  function exportBackup(){
    const payload = { fileType:'promo-imob-backup', schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(), projects: Store.all() };
    return saveFile('backup_promo_imob_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(payload,null,2));
  }
  function migrate(project){
    // ponto de extensão para futuras migrações de schema
    if(!project.schemaVersion) project.schemaVersion = 1;
    if(!project.waterfall) project.waterfall = { ativo:false, ordem:['suprimentos','preferencial','capital','lucro','residual'] };
    if(!project.construcaoCustos) project.construcaoCustos = [];
    if(!project.custosOutros) project.custosOutros = [];
    // Migração: os custos que estavam na aba "Custos" passam a viver em
    // "Custos construção" (categorias de obra) ou "Custos outros" (as restantes),
    // que passam a ser a fonte real dos custos do projeto. A aba "Custos" passa a
    // ser apenas uma lista consolidada das outras duas.
    // Nota: em vez de depender só de uma flag "já migrado" (que, se ficasse
    // marcada por engano sem o conteúdo ter chegado a ser gravado no servidor,
    // bloquearia a migração para sempre), corre sempre que ainda existirem
    // itens em "project.costs" — é o próprio conteúdo por migrar que decide,
    // não apenas a flag. Isto torna a migração auto-reparável.
    if((project.costs||[]).length > 0){
      try{
        const categoriasConstrucao = ['Construção','Infraestruturas','Fiscalização'];
        project.costs.forEach(c=>{
          const item = {
            id: c.id, categoria: c.categoria, subcategoria: c.subcategoria||'', descricao: c.descricao||'', fornecedor: c.fornecedor||'',
            valorVenda: c.valorBase||0,
            temIVA: !!c.temIVA, taxaIVA: c.taxaIVA||0, ivaDedutivel: c.ivaDedutivel||'nao', percDedutivel: c.percDedutivel||0,
            mesInicio: c.mesInicio||0, mesFim: (c.mesFim===undefined||c.mesFim===null)?(c.mesInicio||0):c.mesFim,
            distribuicao: c.distribuicao||'unico',
            manualValores: Util.deepClone(c.manualValores||[]), percentuais: Util.deepClone(c.percentuais||[]),
            observacoes: c.observacoes||''
          };
          if(categoriasConstrucao.includes(c.categoria)){ item.valorConstrucao = item.valorVenda; project.construcaoCustos.push(item); }
          else { item.valorCompra = item.valorVenda; project.custosOutros.push(item); }
        });
        project.costs = [];
        project.custosMigradosParaSubabas = true;
      }catch(e){
        console.error('Falha ao migrar custos para Custos construção/Custos outros', e, project);
      }
    } else if(!project.custosMigradosParaSubabas){
      project.custosMigradosParaSubabas = true;
    }
    // Auto-reparação: o valor de construção/compra nunca deve ficar a 0 ou por
    // preencher — nesse caso, assume o valor de venda (aplica-se sempre que o
    // projeto é carregado, por isso o valor fica gravado e não se perde ao mudar
    // de aba nem entre sessões).
    (project.construcaoCustos||[]).forEach(c=>{ if(!c.valorConstrucao) c.valorConstrucao = c.valorVenda||0; });
    (project.custosOutros||[]).forEach(c=>{ if(!c.valorCompra) c.valorCompra = c.valorVenda||0; });
    (project.investors||[]).forEach(inv=>{
      if(inv.returnModel && inv.returnModel.penalizacaoSaidaAntecipada===undefined) inv.returnModel.penalizacaoSaidaAntecipada = null;
      if(inv.returnModel && inv.returnModel.premioPermanencia===undefined) inv.returnModel.premioPermanencia = null;
      if(inv.categoriaNecessidade===undefined) inv.categoriaNecessidade = null;
      if(inv.diasNecessidade===undefined) inv.diasNecessidade = 0;
    });
    return project;
  }
  function importProjectFromText(text){
    let data;
    try{ data = JSON.parse(text); }catch(e){ throw new Error('Ficheiro inválido: não é um JSON válido.'); }
    if(data.fileType==='promo-imob-backup' && data.projects){
      return {type:'backup', projects:data.projects};
    }
    const project = data.project || data;
    if(!project || !project.meta || !project.assumptions){
      throw new Error('Ficheiro não reconhecido como projeto desta aplicação.');
    }
    if(project.schemaVersion && project.schemaVersion > SCHEMA_VERSION){
      throw new Error('Este ficheiro foi criado numa versão mais recente da aplicação (schema '+project.schemaVersion+'). Atualize a aplicação antes de importar.');
    }
    return {type:'project', project: migrate(project)};
  }
  return {exportProject, exportBackup, importProjectFromText, saveFile, migrate};
})();

// Pequeno ícone "(i)" a colocar ao lado do título de uma caixa de KPI, com uma
// explicação/fórmula em texto (tooltip nativo ao passar o rato).
function kpiInfo(explicacao){
  return `<span class="kpi-info" title="${Util.escapeHtml(explicacao)}">i</span>`;
}

// Ordenação de tabelas (client-side, só para visualização): mantém o estado
// de ordenação por vista (viewKey) em UI.tableSort, sem alterar a ordem real
// dos dados guardados no projeto.
function applyTableSort(viewKey, items, keyFns){
  const st = UI.tableSort[viewKey];
  if(!st || !st.col || !keyFns[st.col]) return items.slice();
  const fn = keyFns[st.col];
  const arr = items.map((it,idx)=>({it,idx}));
  arr.sort((a,b)=>{
    let va = fn(a.it), vb = fn(b.it);
    if(typeof va==='string') va = va.toLowerCase();
    if(typeof vb==='string') vb = vb.toLowerCase();
    if(va<vb) return -1*st.dir;
    if(va>vb) return 1*st.dir;
    return a.idx-b.idx;
  });
  return arr.map(x=>x.it);
}
function sortTh(viewKey, col, label, extraClass){
  const st = UI.tableSort[viewKey];
  const active = st && st.col===col;
  const arrow = active ? `<span class="sort-arrow">${st.dir===1?'▲':'▼'}</span>` : '';
  return `<th class="sortable ${extraClass||''}" data-sort-view="${viewKey}" data-sort-col="${col}">${label}${arrow}</th>`;
}
function wireSortableHeaders(){
  document.querySelectorAll('#content th.sortable').forEach(th=>{
    th.onclick = ()=>{
      const viewKey = th.dataset.sortView, col = th.dataset.sortCol;
      const st = UI.tableSort[viewKey];
      if(!st || st.col!==col){ UI.tableSort[viewKey] = {col, dir:1}; }
      else if(st.dir===1){ st.dir = -1; }
      else { delete UI.tableSort[viewKey]; }
      render();
    };
  });
}

function visibleNav(){
  if(Auth.isAdmin()) return NAV;
  const allowed = Auth.allowedViews();
  return NAV.filter(n=> allowed.includes(n.id));
}

function render(){
  const nav = visibleNav();
  const isContasSpecial = UI.activeView==='contas' && Auth.isAdmin();
  if(!nav.some(n=>n.id===UI.activeView) && !isContasSpecial) UI.activeView = nav.length ? nav[0].id : null;
  renderSidebar();
  renderTopbar();
  renderContent();
}
Store.subscribe(render);

function renderSidebar(){
  const ul = document.getElementById('navlist');
  const nav = visibleNav();
  ul.innerHTML = nav.map(item=>`<li><button data-nav="${item.id}" class="${UI.activeView===item.id?'active':''}"><span class="n">${item.n}</span>${item.label}</button></li>`).join('');
  ul.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ UI.activeView = b.dataset.nav; render(); });
}

function renderTopbar(){
  const tb = document.getElementById('topbar');
  const projects = Store.all();
  const active = Store.active();
  const options = Object.values(projects).map(p=>`<option value="${p.id}" ${active&&p.id===active.id?'selected':''}>${Util.escapeHtml(p.meta.nome)}</option>`).join('');
  const scen = Store.getScenario();
  const isAdmin = Auth.isAdmin();
  const adminBtns = isAdmin ? `
    <button class="tb-btn" id="btnNewProject">+ Novo projeto</button>
    <button class="tb-btn" id="btnDuplicate">Duplicar</button>
    <button class="tb-btn" id="btnLoadProject">Carregar projeto</button>
    <button class="tb-btn danger" id="btnDeleteProject">Eliminar</button>
    <input type="file" id="fileLoadProject" accept="application/json" style="display:none">
  ` : '';
  tb.innerHTML = `
    <select id="projSelect" title="Projeto ativo">${options}</select>
    <div class="tb-scenario" id="scenPicker">
      <button data-s="base" class="${scen==='base'?'active':''}">Base</button>
      <button data-s="otimista" class="${scen==='otimista'?'active':''}">Otimista</button>
      <button data-s="pessimista" class="${scen==='pessimista'?'active':''}">Pessimista</button>
    </div>
    <div class="tb-spacer"></div>
    ${adminBtns}
    <button class="tb-btn" id="btnSaveProject">Guardar projeto</button>
    <div style="display:flex;align-items:center;gap:8px;padding-left:6px;border-left:1px solid var(--border);">
      <span class="mono" style="font-size:11px;color:var(--ink-faint);" title="Sessão iniciada com">${Util.escapeHtml(Auth.email()||'')}</span>
      ${isAdmin?`<button class="tb-btn ${UI.activeView==='contas'?'primary':''}" id="btnContas" title="Gestão de contas (admin)">⚙ Contas</button>`:''}
      <button class="tb-btn" id="btnLogout">Sair</button>
    </div>
  `;
  tb.querySelector('#btnLogout').onclick = ()=> Auth.signOut();
  if(isAdmin) tb.querySelector('#btnContas').onclick = ()=>{ UI.activeView='contas'; render(); };
  tb.querySelector('#projSelect').onchange = e=> Store.setActive(e.target.value);
  tb.querySelectorAll('#scenPicker button').forEach(b=> b.onclick = ()=> Store.setScenario(b.dataset.s));
  tb.querySelector('#btnSaveProject').onclick = async ()=>{
    const p = Store.active(); if(!p) return;
    const ok = await StorageEngine.exportProject(p);
    toast(ok?'Ficheiro do projeto exportado.':'Não foi possível exportar o ficheiro.', !ok);
  };
  if(isAdmin){
    tb.querySelector('#btnNewProject').onclick = ()=>{
      const nome = prompt('Nome do novo projeto:', 'Novo Projeto');
      if(nome===null) return;
      Store.addProject(newProject(nome));
      toast('Projeto criado.');
    };
    tb.querySelector('#btnDuplicate').onclick = ()=>{
      const p = Store.active(); if(!p) return;
      const copy = Util.deepClone(p);
      copy.id = Util.uid(); copy.meta.nome = p.meta.nome + ' (cópia)';
      Store.addProject(copy);
      toast('Projeto duplicado.');
    };
    tb.querySelector('#btnLoadProject').onclick = ()=> tb.querySelector('#fileLoadProject').click();
    tb.querySelector('#fileLoadProject').onchange = async (e)=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        const text = await file.text();
        const result = StorageEngine.importProjectFromText(text);
        if(result.type==='project'){
          if(Store.all()[result.project.id] && !confirm('Já existe um projeto com este ID. Substituir os dados existentes?')) return;
          Store.addProject(result.project);
          toast('Projeto carregado.');
        } else if(result.type==='backup'){
          if(!confirm('Isto irá importar '+Object.keys(result.projects).length+' projeto(s) do backup. Os projetos existentes com o mesmo ID serão substituídos após confirmação. Continuar?')) return;
          Object.values(result.projects).forEach(p=> Store.all()[p.id]=p);
          Store.persist(); Store.pushAllRemote(); render();
          toast('Backup importado.');
        }
      }catch(err){ toast(err.message, true); }
      e.target.value='';
    };
    tb.querySelector('#btnDeleteProject').onclick = ()=>{
      const p = Store.active(); if(!p) return;
      if(confirm('Eliminar definitivamente o projeto "'+p.meta.nome+'"? Esta ação não pode ser desfeita.')){
        Store.removeProject(p.id);
        toast('Projeto eliminado.');
      }
    };
  }
}

  }
  const p = Store.active();
  if(!p){
    c.innerHTML = Auth.isAdmin()
      ? '<div class="empty"><h3>Sem projetos</h3><p>Crie um novo projeto para começar.</p></div>'
      : '<div class="empty"><h3>Sem acesso a projetos</h3><p>Ainda não lhe foi dado acesso a nenhum projeto. Contacte o administrador.</p></div>';
    return;
  }
  const cf = computeCF();
  const alerts = ValidationEngine.run(cf.proj, cf);
  let html = '';
  if(['cashflow','promotor','investidor','custos','custosConstrucao','custosOutros','casas','investidores','financiamento'].includes(UI.activeView) && alerts.length){
    html += '<div class="alerts">' + alerts.slice(0,6).map(a=>`<div class="alert ${a.nivel==='bad'?'bad':''}">${Util.escapeHtml(a.msg)}</div>`).join('') + (alerts.length>6?`<div class="alert">+ ${alerts.length-6} outro(s) alerta(s).</div>`:'') + '</div>';
  }
  switch(UI.activeView){
    case 'projetos': html += viewProjetos(p); break;
    case 'pressupostos': html += viewPressupostos(p); break;
    case 'custosConstrucao': html += viewCustosConstrucao(p); break;
    case 'custosOutros': html += viewCustosOutros(p); break;
    case 'custos': html += viewCustos(p, cf); break;
    case 'casas': html += viewCasas(p, cf); break;
    case 'investidores': html += viewInvestidores(p, cf); break;
    case 'financiamento': html += viewFinanciamento(p, cf); break;
    case 'cashflow': html += viewCashflow(p, cf); break;
    case 'cenarios': html += viewCenarios(p); break;
    case 'analiseConstrucao': html += viewAnaliseConstrucao(p, cf); break;
    case 'promotor': html += viewPromotor(p, cf); break;
    case 'investidor': html += viewInvestidor(p, cf); break;
    case 'relatorios': html += viewRelatorios(p, cf); break;
  }
  c.innerHTML = html;
  wireView(UI.activeView, p, cf);
  const editableViews = ['projetos','pressupostos','custosConstrucao','custosOutros','custos','casas','investidores','financiamento','cenarios'];
  UI.readOnly = editableViews.includes(UI.activeView) && !Auth.isAdmin() && !Auth.canEditProject(p.id);
  applyReadOnlyGate();
}

function applyReadOnlyGate(){
  const c = document.getElementById('content');
  if(!c) return;
  if(!UI.readOnly){
    let banner = document.getElementById('roBanner');
    if(banner) banner.remove();
    return;
  }
  c.querySelectorAll('input, select, textarea').forEach(el=>{ el.disabled = true; });
  c.querySelectorAll('button').forEach(btn=>{
    if(btn.dataset.roSafe) return;
    btn.disabled = true;
  });
  if(!document.getElementById('roBanner')){
    const b = document.createElement('div');
    b.id = 'roBanner';
    b.className = 'alert';
    b.style.marginBottom = '12px';
    b.textContent = 'Acesso só de leitura a este projeto — não pode alterar dados.';
    c.insertBefore(b, c.firstChild);
  }
}

/* ---- Modal helper ---- */
function openModal(innerHtml, onMount){
  const back = document.createElement('div');
  back.className = 'modal-backdrop';
  back.innerHTML = `<div class="modal">${innerHtml}</div>`;
  // Clicar fora da janela não a fecha — só os botões Guardar/Cancelar (evita perder
  // dados por engano ao clicar sem querer fora da janela).
  document.body.appendChild(back);
  if(onMount) onMount(back);
  return back;
}
function closeModals(){ document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove()); }

function viewCustos(p, cf){
  // Vista consolidada, só de leitura: junta os custos de "Custos construção" e
  // "Custos outros" (que são a fonte real dos custos do projeto). Para editar,
  // usa o botão "Editar" — abre o item na aba de onde ele vem.
  const totalCash = Util.sum(cf.costBreakdown, x=>x.cashOut);
  const totalEcon = Util.sum(cf.costBreakdown, x=>x.economico);
  const itemsOriginal = allProjectCosts(p);
  const totalVenda = Util.sum(itemsOriginal, c=>c.valorVenda||0);
  const cashOutOf = c=> (cf.costBreakdown.find(b=>b.id===c.id)||{cashOut:0}).cashOut;

    mesInicio: c=>c.mesInicio||0, cashOut: cashOutOf
  });
  const rows = items.map(c=>{
    const bd = cf.costBreakdown.find(b=>b.id===c.id)||{cashOut:0,economico:0};
    return `<tr data-id="${c.id}" data-origem="${c.origem}">
      <td><span class="tag">${c.origem==='construcao'?'Construção':'Outros'}</span></td>

      <td class="num mono">${Util.fmtMoney0(c.valorBase)}</td>
      <td>${c.temIVA?Util.fmtPct(c.taxaIVA):'—'}</td>
      <td>${c.temIVA?({sim:'Sim',nao:'Não',parcial:'Parcial ('+Util.fmtPct(c.percDedutivel)+')'}[c.ivaDedutivel]):'—'}</td>
      <td>${c.distribuicao}</td>
      <td class="num mono">${Util.monthWithDate(p.assumptions.dataInicio, c.mesInicio)}</td>
      <td class="num mono">${Util.fmtMoney0(bd.cashOut)}</td>
      <td class="row-actions">
        <button class="icon-btn" data-act="edit">Editar</button>

    <div class="kpi"><div class="k-label">Valor total${kpiInfo('Somatório do valor de venda de todas as rubricas de custo (Custos construção + Custos outros). Fórmula: Σ valor de venda de cada rubrica.')}</div><div class="k-value">${Util.fmtMoney0(totalVenda)}</div></div>
    <div class="kpi"><div class="k-label">Custo total (cash-out)</div><div class="k-value">${Util.fmtMoney0(totalCash)}</div></div>
    <div class="kpi"><div class="k-label">Custo económico total</div><div class="k-value">${Util.fmtMoney0(totalEcon)}</div><div class="k-sub">exclui IVA dedutível</div></div>

   ver "Análise construção")

function viewCustosConstrucao(p){
  const itemsOriginal = p.construcaoCustos||[];
  const totalVenda = Util.sum(itemsOriginal, x=>x.valorVenda||0);
  const totalConstrucao = Util.sum(itemsOriginal, x=>x.valorConstrucao||0);
  const sortAtivo = !!(UI.tableSort.custosConstrucao && UI.tableSort.custosConstrucao.col);
  const items = applyTableSort('custosConstrucao', itemsOriginal, {
    categoria: c=>c.categoria||'', subcategoria: c=>c.subcategoria||'', descricao: c=>c.descricao||'',
    valorVenda: c=>c.valorVenda||0, valorConstrucao: c=>c.valorConstrucao||0,
    lucro: c=>(c.valorVenda||0)-(c.valorConstrucao||0), distribuicao: c=>c.distribuicao||'', mesInicio: c=>c.mesInicio||0
  });
  const rows = items.map((c,idx)=>{
    const lucro = (c.valorVenda||0)-(c.valorConstrucao||0);
    const realIdx = itemsOriginal.indexOf(c);
    return `<tr data-id="${c.id}">
      <td class="num mono" style="color:var(--ink-faint);">
        ${sortAtivo ? '—' : `<div style="display:flex;align-items:center;gap:2px;">
          <button class="icon-btn" data-act="up" title="Mover para cima" ${realIdx===0?'disabled':''}>↑</button>
          <button class="icon-btn" data-act="down" title="Mover para baixo" ${realIdx===itemsOriginal.length-1?'disabled':''}>↓</button>
        </div>`}
      </td>
      <td>${Util.escapeHtml(c.categoria)}</td>
      <td>${Util.escapeHtml(c.subcategoria||'')}</td>
      <td>${Util.escapeHtml(c.descricao||'')}</td>
      <td class="num mono">${Util.fmtMoney0(c.valorVenda)}</td>
      <td class="num mono">${Util.fmtMoney0(c.valorConstrucao)}</td>
      <td class="num mono" style="${lucro<0?'color:var(--neg)':''}">${Util.fmtMoney0(lucro)}</td>
      <td>${c.distribuicao}</td>
      <td class="num mono">${Util.monthWithDate(p.assumptions.dataInicio, c.mesInicio)}</td>
      <td class="row-actions">
        <button class="icon-btn" data-act="edit">Editar</button>
        <button class="icon-btn" data-act="move" title="Mover para 'Custos outros'">Mover →</button>
        <button class="icon-btn" data-act="dup">Duplicar</button>
        <button class="icon-btn danger" data-act="del">Eliminar</button>
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="view-head"><div><h2>Custos construção</h2><p>Custos de obra do projeto: cada rubrica tem um valor de venda (que conta como custo no cash-flow geral, tal como qualquer outro custo) e um valor de construção (só para acompanhar a margem em "Análise construção"). Clica num cabeçalho de coluna para ordenar.</p></div>
    <button class="tb-btn primary" id="btnAddCustoConstrucao">+ Adicionar custo</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="k-label">Total de venda</div><div class="k-value">${Util.fmtMoney0(totalVenda)}</div></div>
    <div class="kpi"><div class="k-label">Total de construção</div><div class="k-value">${Util.fmtMoney0(totalConstrucao)}</div></div>
    <div class="kpi"><div class="k-label">Lucro total</div><div class="k-value ${totalVenda-totalConstrucao<0?'neg':'pos'}">${Util.fmtMoney0(totalVenda-totalConstrucao)}</div></div>
    <div class="kpi"><div class="k-label">Nº de rubricas</div><div class="k-value">${items.length}</div></div>
  </div>
  <div class="tbl-wrap"><table class="data">
    <thead><tr><th></th>
      ${sortTh('custosConstrucao','categoria','Categoria')}
      ${sortTh('custosConstrucao','subcategoria','Subcategoria')}
      ${sortTh('custosConstrucao','descricao','Descrição')}
      ${sortTh('custosConstrucao','valorVenda','Valor de venda','num')}
      ${sortTh('custosConstrucao','valorConstrucao','Valor de construção','num')}
      ${sortTh('custosConstrucao','lucro','Lucro','num')}
      ${sortTh('custosConstrucao','distribuicao','Distribuição')}
      ${sortTh('custosConstrucao','mesInicio','Mês início','num')}
      <th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="10" class="empty">Sem custos de construção registados.</td></tr>'}</tbody>
  </table></div>`;
}
