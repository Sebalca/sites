<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análise de Promoção Imobiliária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface-alt:#ECEAE3; --surface-sunken:#EAE8E1;
  --ink:#1C2420; --ink-soft:#5B655E; --ink-faint:#8A9089;
  --accent:#1F5C4D; --accent-ink:#0F3A2F; --accent-soft:#E3ECE7; --accent-soft-border:#C7D9D0;
  --gold:#93712E; --gold-soft:#F1E9D6;
  --neg:#9A3324; --neg-soft:#F6E4DF;
  --border:#DCD9CF; --border-strong:#C3C0B4;
  --focus:#1F5C4D;
  --font-display:"Source Serif 4", Georgia, serif;
  --font-body:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}
:root:not([data-theme="light"]) { }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141815; --surface:#1B211D; --surface-alt:#222922; --surface-sunken:#1F2521;
    --ink:#E9ECE7; --ink-soft:#AEB6AC; --ink-faint:#767F76;
    --accent:#5FAE93; --accent-ink:#8FCBB5; --accent-soft:#1E3129; --accent-soft-border:#2C4A3D;
    --gold:#D3B872; --gold-soft:#2E2717;
    --neg:#E29488; --neg-soft:#3A241F;
    --border:#333B34; --border-strong:#454F46;
  }
}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1B211D; --surface-alt:#222922; --surface-sunken:#1F2521;
  --ink:#E9ECE7; --ink-soft:#AEB6AC; --ink-faint:#767F76;
  --accent:#5FAE93; --accent-ink:#8FCBB5; --accent-soft:#1E3129; --accent-soft-border:#2C4A3D;
  --gold:#D3B872; --gold-soft:#2E2717;
  --neg:#E29488; --neg-soft:#3A241F;
  --border:#333B34; --border-strong:#454F46;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;}
body{min-height:100vh;}
::selection{background:var(--accent-soft);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0 0 .4em 0;color:var(--ink);}
a{color:var(--accent);}
button{font-family:var(--font-body);}
input,select,textarea{font-family:var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--border-strong);border-radius:4px;padding:6px 8px;font-size:13px;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
table input, table select{width:100%;padding:4px 6px;font-size:12.5px;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}

#app{display:none;min-height:100vh;}
#app.ready{display:flex;}
#sidebar{width:220px;flex:0 0 220px;background:var(--accent-ink);color:#EFF3F0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
#sidebar .brand{padding:20px 18px 14px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
#sidebar .brand .b-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:#fff;line-height:1.2;}
#sidebar .brand .b-sub{font-size:11px;color:#B9CBC2;margin-top:3px;}
#navlist{list-style:none;margin:0;padding:10px 8px;flex:1;}
#navlist li{margin-bottom:2px;}
#navlist button{width:100%;text-align:left;background:transparent;border:none;color:#D6E3DC;padding:9px 12px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:9px;}
#navlist button .n{font-family:var(--font-mono);font-size:10.5px;color:#87A597;width:16px;flex:0 0 16px;}
#navlist button:hover{background:rgba(255,255,255,.07);color:#fff;}
#navlist button.active{background:rgba(255,255,255,.14);color:#fff;font-weight:600;}
#sidebar .sidebar-foot{padding:12px 16px;font-size:10.5px;color:#7FA093;border-top:1px solid rgba(255,255,255,.1);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5;flex-wrap:wrap;}
#topbar select{min-width:180px;}
.tb-spacer{flex:1;}
.tb-btn{background:var(--surface);border:1px solid var(--border-strong);color:var(--ink);padding:7px 13px;border-radius:5px;font-size:12.5px;cursor:pointer;}
.tb-btn:hover{background:var(--surface-alt);}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-btn.primary:hover{filter:brightness(1.08);}
.tb-btn.danger{color:var(--neg);border-color:var(--neg-soft);}
.tb-btn.danger:hover{background:var(--neg-soft);}
.tb-scenario{display:flex;gap:4px;background:var(--surface-alt);padding:3px;border-radius:6px;}
.tb-scenario button{border:none;background:transparent;padding:5px 11px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.tb-scenario button.active{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);}

#content{padding:22px 26px 60px 26px;max-width:1400px;width:100%;}
.view{display:none;}
.view.active{display:block;}
.view-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.view-head p{color:var(--ink-soft);font-size:12.5px;margin:2px 0 0 0;max-width:640px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px 20px;margin-bottom:16px;}
.card h3{font-size:14px;text-transform:none;letter-spacing:0;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.grid{display:grid;gap:12px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11.5px;color:var(--ink-soft);font-weight:500;}
.field input,.field select,.field textarea{width:100%;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:default;}
.kpi.clickable{cursor:pointer;}
.kpi.clickable:hover{border-color:var(--accent-soft-border);background:var(--accent-soft);}
.kpi .k-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.kpi .k-value{font-family:var(--font-display);font-size:22px;font-weight:600;}
.kpi .k-value.neg{color:var(--neg);}
.kpi .k-value.pos{color:var(--accent-ink);}
.kpi .k-sub{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.kpi-info{display:inline-block;margin-left:5px;width:14px;height:14px;line-height:14px;text-align:center;border-radius:50%;background:var(--border);color:var(--ink-soft);font-size:10px;font-style:normal;cursor:help;user-select:none;}
.kpi-info:hover{background:var(--accent-soft-border);color:var(--ink);}
table.data th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
table.data th.sortable:hover{color:var(--ink);}
table.data th.sortable .sort-arrow{font-size:10px;color:var(--accent-ink);margin-left:2px;}
.mes-hint{font-size:11px;color:var(--ink-faint);margin-top:3px;}
table.data tr.cf-mes-fim{background:var(--accent-soft-bg,rgba(90,120,255,0.08));}
table.data tr.cf-mes-fim td{border-bottom:2px solid var(--accent-soft-border,var(--border));}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.data th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:7px 8px;border-bottom:1px solid var(--border-strong);white-space:nowrap;}
table.data td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.data tbody tr:hover{background:var(--surface-alt);}
table.data td.num, table.data th.num{text-align:right;}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
.row-actions{display:flex;gap:4px;}
.icon-btn{background:transparent;border:1px solid var(--border-strong);border-radius:4px;padding:3px 7px;cursor:pointer;font-size:11px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-alt);color:var(--ink);}
.icon-btn.danger:hover{color:var(--neg);border-color:var(--neg);}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:600;background:var(--surface-alt);color:var(--ink-soft);}
.tag.ok{background:var(--accent-soft);color:var(--accent-ink);}
.tag.warn{background:var(--gold-soft);color:var(--gold);}
.tag.bad{background:var(--neg-soft);color:var(--neg);}

.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.alert{padding:9px 13px;border-radius:6px;font-size:12.5px;border-left:3px solid var(--gold);background:var(--gold-soft);color:var(--ink);}
.alert.bad{border-color:var(--neg);background:var(--neg-soft);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,24,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);border-radius:10px;max-width:720px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin-bottom:4px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid var(--border);padding-top:14px;}

.empty{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty h3{color:var(--ink-soft);}

.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:100;}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(6px);transition:.25s;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.err{background:var(--neg);color:#fff;}

.chart-box{position:relative;height:280px;}
.section-sub{font-size:12px;color:var(--ink-soft);margin:14px 0 8px 0;font-weight:600;}
.methodology{font-size:12px;color:var(--ink-soft);background:var(--surface-alt);border-radius:6px;padding:10px 13px;margin-top:8px;}
.small-btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.pill-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;}
.pill-toggle button{border:none;background:var(--surface);padding:5px 11px;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.pill-toggle button.active{background:var(--accent);color:#fff;}
.checkbox-row{display:flex;align-items:center;gap:6px;font-size:12.5px;}
label.inline{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="b-title">Análise de Promoção</div>
      <div class="b-sub">Modelação financeira de projetos imobiliários</div>
    </div>
    <ul id="navlist"></ul>
    <div class="sidebar-foot">Dados guardados localmente no navegador. Exporte o ficheiro do projeto regularmente.</div>
  </aside>
  <div id="main">
    <div id="topbar"></div>
    <div id="content"></div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<div id="authOverlay" class="modal-backdrop" style="display:none;z-index:200;">
  <div class="modal" style="max-width:380px;">
    <h3 style="margin-bottom:2px;">Entrar ou criar conta</h3>
    <p style="color:var(--ink-soft);font-size:12px;margin-bottom:16px;">Acesso restrito — só quem estiver autorizado consegue criar conta ou entrar.</p>
    <div class="field" style="margin-bottom:10px;">
      <label for="authEmail">Email</label>
      <input type="email" id="authEmail" placeholder="tu@email.com" autocomplete="email">
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label for="authPass">Palavra-passe</label>
      <input type="password" id="authPass" placeholder="Pelo menos 6 caracteres" autocomplete="current-password">
    </div>
    <div style="display:flex;gap:8px;">
      <button class="tb-btn" id="authSignupBtn" style="flex:1;">Criar conta</button>
      <button class="tb-btn primary" id="authLoginBtn" style="flex:1;">Entrar</button>
    </div>
    <div id="authMsg" style="font-size:12px;margin-top:14px;color:var(--ink-soft);min-height:32px;text-align:center;"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<script>
/* =========================================================================
   UTILITÁRIOS
   ========================================================================= */
const Util = (function(){
  function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function fmtMoney(n){
    if(n===null||n===undefined||isNaN(n)) return '—';
    const neg = n < -0.004;
    const v = Math.abs(n);
    const s = new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
    return (neg?'-':'') + s + ' €';
  }
  function fmtMoney0(n){
    if(n===null||n===undefined||isNaN(n)) return '—';
    const neg = n < -0.5;
    const v = Math.abs(n);
    const s = new Intl.NumberFormat('pt-PT',{minimumFractionDigits:0,maximumFractionDigits:0}).format(Math.round(v));
    return (neg?'-':'') + s + ' €';
  }
  function fmtPct(n, dec){
    if(n===null||n===undefined||isNaN(n)) return '—';
    dec = dec===undefined?2:dec;
    return new Intl.NumberFormat('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n*100) + '%';
  }
  function fmtNum(n,dec){
    if(n===null||n===undefined||isNaN(n)) return '—';
    dec = dec===undefined?2:dec;
    return new Intl.NumberFormat('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return '—';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return `${dd}/${mm}/${d.getFullYear()}`;
  }
  function addMonths(iso, n){
    const d = new Date(iso+'T00:00:00');
    d.setMonth(d.getMonth()+n);
    return d.toISOString().slice(0,10);
  }
  function monthIndex(iso, startIso){
    const d = new Date(iso+'T00:00:00');
    const s = new Date(startIso+'T00:00:00');
    return (d.getFullYear()-s.getFullYear())*12 + (d.getMonth()-s.getMonth());
  }
  function monthLabel(startIso, idx){
    const iso = addMonths(startIso, idx);
    const d = new Date(iso+'T00:00:00');
    const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return meses[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
  function sum(arr, fn){ return arr.reduce((a,x)=>a+(fn?fn(x):x),0); }
  function escapeHtml(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // Mostra o número do mês junto com a data real correspondente, ex: "2 - 01/01/2026",
  // a partir da data de início do projeto (mês 0 = 1º mês).
  function monthWithDate(startIso, idx){
    if(idx===null||idx===undefined||isNaN(idx)) return '—';
    if(!startIso) return String(idx);
    return idx + ' - ' + fmtDate(addMonths(startIso, idx));
  }
  return {uid,fmtMoney,fmtMoney0,fmtPct,fmtNum,fmtDate,addMonths,monthIndex,monthLabel,monthWithDate,clamp,deepClone,sum,escapeHtml};
})();

/* =========================================================================
   TOASTS
   ========================================================================= */
function toast(msg, isErr){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr?' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, 3400);
}

/* =========================================================================
   MODELO DE DADOS / DEMO
   ========================================================================= */
const SCHEMA_VERSION = 1;

function newProject(nome){
  const today = new Date().toISOString().slice(0,10);
  return {
    schemaVersion: SCHEMA_VERSION,
    id: Util.uid(),
    meta: { nome: nome||'Novo Projeto', localizacao:'', promotor:'', descricao:'', dataInicioPrevista: today, dataFimPrevista: Util.addMonths(today,24), numMoradias:0, observacoes:'' },
    assumptions: { dataInicio: today, dataFim: Util.addMonths(today,24), taxaDescontoAnual: 0.10, taxaTributacao: 0.21, ivaPadrao: 0.23, ivaAplicavelVendas: false, observacoes:'' },
    costs: [],
    construcaoCustos: [],
    custosOutros: [],
    custosMigradosParaSubabas: true,
    phases: [],
    houses: [],
    investors: [],
    financing: [],
    scenarios: {
      otimista: { vendaDelta: 0.05, custoDelta: -0.03, atrasoVendasMeses: -2, atrasoConstrucaoMeses: 0, taxaFinanciamentoDelta: 0 },
      pessimista: { vendaDelta: -0.07, custoDelta: 0.10, atrasoVendasMeses: 6, atrasoConstrucaoMeses: 6, taxaFinanciamentoDelta: 0.01 }
    },
    waterfall: { ativo:false, ordem:['suprimentos','preferencial','capital','lucro','residual'] }
  };
}

function buildDemoProject(){
  const p = newProject('Demonstração — Quinta das Oliveiras (22 moradias)');
  const start = p.assumptions.dataInicio;
  p.meta.localizacao = 'Sintra'; p.meta.promotor='Promotor Demo, Lda.'; p.meta.numMoradias = 22;
  p.meta.descricao = 'Projeto de demonstração com 4 fases, 22 moradias, financiamento bancário e dois investidores.';

  // Fases
  const fases = [
    {id:Util.uid(), nome:'Fase 1', mesInicio:0, mesFim:9},
    {id:Util.uid(), nome:'Fase 2', mesInicio:4, mesFim:14},
    {id:Util.uid(), nome:'Fase 3', mesInicio:9, mesFim:19},
    {id:Util.uid(), nome:'Fase 4', mesInicio:14, mesFim:24},
  ];
  p.phases = fases;

  // Custos (repartidos entre "Custos construção" e "Custos outros" pela categoria)
  const CATEGORIAS_CONSTRUCAO_DEMO = ['Construção','Infraestruturas','Fiscalização'];
  function addCost(cat,sub,desc,valor,temIVA,ivaDed,percDed,mesIni,mesFim,dist){
    const item = {id:Util.uid(),categoria:cat,subcategoria:sub||'',descricao:desc,fornecedor:'',valorVenda:valor,
      temIVA:temIVA, taxaIVA: temIVA?0.23:0, ivaDedutivel: ivaDed, percDedutivel: percDed||1,
      mesInicio:mesIni, mesFim:mesFim===undefined?mesIni:mesFim, distribuicao:dist||'unico',
      manualValores:[], percentuais:[], observacoes:''};
    if(CATEGORIAS_CONSTRUCAO_DEMO.includes(cat)){ item.valorConstrucao=0; p.construcaoCustos.push(item); }
    else { item.valorCompra=0; p.custosOutros.push(item); }
  }
  addCost('Aquisição do terreno','','Compra do terreno', 1200000, false,'nao',0, 0,0,'unico');
  addCost('Projetos','','Projetos de arquitetura e especialidades', 65000, true,'sim',1, 0,2,'igual');
  addCost('Licenciamento','','Taxas municipais e licenças', 90000, true,'nao',0, 1,1,'unico');
  addCost('Infraestruturas','','Infraestruturas gerais (arruamentos, redes)', 500000, true,'sim',1, 2,10,'igual');
  addCost('Construção','Fase 1','Construção moradias Fase 1', 750000, true,'sim',1, 2,10,'igual');
  addCost('Construção','Fase 2','Construção moradias Fase 2', 900000, true,'sim',1, 6,15,'igual');
  addCost('Construção','Fase 3','Construção moradias Fase 3', 900000, true,'sim',1, 11,20,'igual');
  addCost('Construção','Fase 4','Construção moradias Fase 4', 750000, true,'sim',1, 16,24,'igual');
  addCost('Fiscalização','','Fiscalização de obra', 60000, true,'sim',1, 2,24,'igual');

const Auth = (function(){

  function email(){ return (session && session.user) ? session.user.email : null; }

  function isAdmin(){ return !!perms.is_admin; }
  function allowedViews(){ return perms.allowed_views||[]; }
  function canEditProject(projectId){
    if(perms.is_admin) return true;
    return !!projectAccess[projectId];
  }

  async function loadPermissions(){
    try{
      const { data, error } = await supaClient.rpc('promo_my_permissions');
      if(error || !data || !data.length){ perms = {is_admin:false, allowed_views:[]}; }
      else{ perms = { is_admin: !!data[0].is_admin, allowed_views: data[0].allowed_views||[] }; }
    }catch(e){ perms = {is_admin:false, allowed_views:[]}; }
    projectAccess = {};
    if(!perms.is_admin){
      try{

        (data||[]).forEach(r=> projectAccess[r.project_id] = !!r.can_edit);
      }catch(e){}
    }
  }

  async function checkAllowlist(em){
    try{
      const { data, error } = await supaClient.rpc('promo_is_allowed', { p_email: em });
      if(error){ console.warn('Falha ao verificar autorização', error); return false; }
      return !!data;
    }catch(e){ console.warn('Falha ao verificar autorização', e); return false; }
  }

  function setMsg(text, isErr){
    const m = document.getElementById('authMsg');
    if(!m) return;
    m.textContent = text||'';
    m.style.color = isErr ? 'var(--neg)' : 'var(--ink-soft)';
  }

  function showLogin(msg, isErr){
    document.getElementById('app').classList.remove('ready');
    const ov = document.getElementById('authOverlay');
    ov.style.display = 'flex';
    setMsg(msg, isErr);
  }
  function showApp(){
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('app').classList.add('ready');
  }

  function validEmail(em){ return !!em && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em); }

  async function signIn(rawEmail, password){
    const em = (rawEmail||'').trim().toLowerCase();
    if(!validEmail(em)){ setMsg('Introduza um email válido.', true); return; }
    if(!password){ setMsg('Introduza a palavra-passe.', true); return; }
    setMsg('A entrar…', false);
    const { error } = await supaClient.auth.signInWithPassword({ email: em, password });
    if(error){
      setMsg(error.message==='Invalid login credentials' ? 'Email ou palavra-passe incorretos.' : 'Erro ao entrar: '+error.message, true);
      return;
    }
    // onAuthStateChange trata da sessão a partir daqui.
  }

  async function signUp(rawEmail, password){
    const em = (rawEmail||'').trim().toLowerCase();
    if(!validEmail(em)){ setMsg('Introduza um email válido.', true); return; }
    if(!password || password.length<6){ setMsg('A palavra-passe deve ter pelo menos 6 caracteres.', true); return; }
    setMsg('A verificar autorização…', false);
    const ok = await checkAllowlist(em);
    if(!ok){ setMsg('Este email não tem acesso autorizado. Peça ao administrador para o adicionar.', true); return; }
    setMsg('A criar conta…', false);
    const { data, error } = await supaClient.auth.signUp({ email: em, password });
    if(error){
      setMsg(/already registered|already exists/i.test(error.message) ? 'Já existe uma conta com este email. Use "Entrar".' : 'Erro ao criar conta: '+error.message, true);
      return;
    }
    if(!data.session){
      setMsg('Conta criada. Verifique o seu email para confirmar antes de entrar.', false);
    }
    // Se a confirmação de email estiver desativada no projeto, data.session já vem preenchida
    // e o onAuthStateChange trata do login automaticamente.
  }

  async function signOut(){
    try{ LiveSync.stop(); }catch(e){}
    try{ await supaClient.auth.signOut(); }catch(e){}
    session = null; allowed = false; perms = {is_admin:false, allowed_views:[]}; projectAccess = {};
    showLogin('Sessão terminada.', false);
  }

  async function resolveSession(startApp){
    if(!session){ showLogin(); return; }
    const em = email();
    const ok = await checkAllowlist(em);
    allowed = ok;
    if(!ok){
      try{ await supaClient.auth.signOut(); }catch(e){}
      session = null;
      showLogin('O email '+em+' não tem acesso autorizado.', true);
      return;
    }
    await loadPermissions();
    showApp();
    await startApp();
  }

  async function init(startApp){
    const { data } = await supaClient.auth.getSession();
    session = data.session;
    await resolveSession(startApp);
    supaClient.auth.onAuthStateChange(async (event, s2)=>{
      if(event==='SIGNED_OUT'){ session=null; allowed=false; showLogin(); return; }
      const tokenChanged = (s2 && (!session || session.access_token!==s2.access_token));
      session = s2;
      if(tokenChanged) await resolveSession(startApp);
    });
  }

  return { init, email, isAllowed, signOut, signIn, signUp, isAdmin, allowedViews, canEditProject, refreshPermissions: loadPermissions };
})();

const RemoteStore = (function(){
  let ready = false;
  function setReady(v){ ready = v; }
  async function pullAll(){
    const { data, error } = await supaClient.from('promo_projects').select('id,data');
    if(error){ console.warn('Falha ao carregar projetos do Supabase', error); return null; }
    return data;
  }
  async function push(id, projData){
    if(!ready || !Auth.isAllowed()) return;
    try{
      // Tenta atualizar uma linha existente primeiro: só exige permissão de edição,
      // ao contrário de um upsert (que exigiria também permissão de criação).
      const { data, error } = await supaClient.from('promo_projects')
        .update({ data: projData, updated_at: new Date().toISOString() })
        .eq('id', id)
        .select('id');
      if(error){ console.warn('Falha ao gravar projeto no Supabase', error); return; }
      if(!data || data.length===0){
        // Ainda não existe (projeto novo) — só o administrador tem permissão para o criar.
        const { error: insErr } = await supaClient.from('promo_projects').insert({ id, data: projData });
        if(insErr) console.warn('Falha ao criar projeto no Supabase', insErr);
      }
    }catch(e){ console.warn('Falha ao gravar projeto no Supabase', e); }
  }
  async function remove(id){
    if(!ready || !Auth.isAllowed()) return;
    try{
      const { error } = await supaClient.from('promo_projects').delete().eq('id', id);
      if(error) console.warn('Falha ao eliminar projeto no Supabase', error);
    }catch(e){ console.warn('Falha ao eliminar projeto no Supabase', e); }
  }
  return { setReady, pullAll, push, remove };
})();
